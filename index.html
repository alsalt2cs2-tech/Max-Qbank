,000 ft","17,000 ft","10,000 ft","41,000 ft"],"e":"Listed with the equipment available on battery power."},{"id":"F06-36","c":"F06","r":"FCOM 6.20","q":"On battery power only, the ground spoilers:","o":["Are inoperative and remain down on landing","Deploy normally","Deploy only with manual handle","Deploy on the right wing only"],"e":"Also: flap indicator shows only the right TE flap position."},{"id":"F06-37","c":"F06","r":"FCOM 6.20","q":"With batteries only, which displays remain on the Captain's side?","o":["Outboard DU with PFD and inboard DU with ND","All Captain and FO displays","Only the ISFD","Captain's outboard DU only"],"e":"The left EFIS control panel and ISFD also remain."},{"id":"F06-38","c":"F06","r":"FCOM 6.20","q":"With batteries only, which antiskid is available?","o":["Inboard antiskid","Outboard antiskid","Full antiskid","None"],"e":"Inboard antiskid is on the battery-powered equipment list."},{"id":"F06-39","c":"F06","r":"FCOM 6.10","q":"Moving a single APU GEN switch ON when neither transfer bus is powered by an IDG:","o":["Connects both transfer buses to the APU generator and disconnects external power","Connects only the related transfer bus","Has no effect until the second switch is moved","Connects APU to the ground service buses only"],"e":"The opposite SOURCE OFF light stays on until the other APU GEN switch is moved ON."},{"id":"F06-40","c":"F06","r":"FCOM 6.10","q":"Both transfer buses on IDGs: moving one APU GEN switch ON results in:","o":["Related transfer bus on APU; the other stays on its IDG","Both buses transfer to the APU","APU powers the tie bus only","Nothing; IDGs have priority"],"e":"Connecting a new source only replaces the source on that transfer bus."},{"id":"F06-41","c":"F06","r":"FCOM 6.20","q":"The external power receptacle is located:","o":["Near the nose gear wheel well, lower right side of the fuselage","Aft of the left wing root","In the main gear well","Lower left side, aft fuselage"],"e":"A status light panel next to it shows the ground crew whether external power is in use."},{"id":"F06-42","c":"F06","r":"FCOM 6.20","q":"Flight deck auxiliary power outlets: a plug inserted before power-up must be:","o":["Removed and reinserted to get power","Left in place; power restores automatically","Inserted only with the BAT switch OFF","Reset with the IFE/PASS switch"],"e":"The protective device needs both prongs inserted together after power is available."},{"id":"F07-01","c":"F07","r":"FCOM 7.20","q":"Which are the primary engine indications?","o":["N1 and EGT","N1, N2 and EGT","N1 and fuel flow","EGT and oil pressure"],"e":"N2, fuel flow, oil pressure/temp/quantity and vibration are secondary."},{"id":"F07-02","c":"F07","r":"FCOM 7.20","q":"Secondary engine indications appear automatically in all of these cases EXCEPT:","o":["When the A/T disconnects","When displays first receive power","In flight with N2 below idle","When a secondary parameter exceeds its normal range"],"e":"Also when a start lever is moved to CUTOFF in flight."},{"id":"F07-03","c":"F07","r":"FCOM 7.20","q":"Which secondary indication is displayed full time below the primary indications?","o":["Fuel flow","N2","Oil pressure","Vibration"],"e":"Others are selected with the ENG switch."},{"id":"F07-04","c":"F07","r":"FCOM 7.20","q":"With the EEC unpowered, which parameters are still shown directly from engine sensors?","o":["N1, N2 and oil quantity","N1 and EGT","All parameters","None"],"e":"Selecting the start switch to GRD powers the EEC."},{"id":"F07-05","c":"F07","r":"FCOM 7.10","q":"The amber ENG FAIL alert appears when:","o":["The engine is below sustainable idle with the start lever in IDLE","N1 drops below 20%","EGT exceeds redline","Oil pressure is low"],"e":"It clears when the engine recovers, the lever goes to CUTOFF or the fire switch is pulled."},{"id":"F07-06","c":"F07","r":"FCOM 7.10","q":"EGT amber color change is inhibited during takeoff or go-around for up to:","o":["5 minutes (10 minutes if an engine fails in the first 5 minutes)","2 minutes","10 minutes always","It is never inhibited"],"e":"Amber marks the maximum continuous limit."},{"id":"F07-07","c":"F07","r":"FCOM 7.10","q":"A flashing white box around the EGT readout during a ground start indicates:","o":["An impending hot start or stall; the EEC will cut fuel","Normal start","Wet start","EGT exceeded start limit"],"e":"It resets when the start lever goes to CUTOFF."},{"id":"F07-08","c":"F07","r":"FCOM 7.10","q":"Engine alerts do not blink (they show steady) during takeoff from 80 kt until:","o":["800 ft RA or 30 s after 80 kt, whichever first","1,500 ft RA","Thrust reduction","Gear retraction"],"e":"During landing, inhibited below 200 ft RA until 30 s after touchdown."},{"id":"F07-09","c":"F07","r":"FCOM 7.20","q":"The EEC has:","o":["Two independent channels, alternating with each start attempt","One channel with backup hydromechanical control","Three channels","Two channels, always channel A first"],"e":"Transfer to the other channel is automatic on failure."},{"id":"F07-10","c":"F07","r":"FCOM 7.20","q":"If required signals are lost, the EEC automatically goes to:","o":["Soft alternate mode, using last valid flight conditions","Hard alternate mode","Manual mode","Fuel cutoff"],"e":"The ALTN light illuminates and ON remains visible."},{"id":"F07-11","c":"F07","r":"FCOM 7.20","q":"Soft alternate becomes hard alternate when:","o":["Thrust lever retarded to idle, or ALTN selected manually","Airplane lands","After 10 minutes","Both EECs fail"],"e":"Hard alternate thrust is equal to or greater than normal mode thrust."},{"id":"F07-12","c":"F07","r":"FCOM 7.20","q":"In hard alternate mode, why avoid advancing thrust levers to full forward except for terrain emergencies?","o":["No EEC thrust limiting, so overboost is possible","Engine will flame out","Reversers may deploy","The A/T will disconnect"],"e":"Max rated thrust may be reached before the forward stop."},{"id":"F07-13","c":"F07","r":"FCOM 7.20","q":"Loss of either DPC causes:","o":["Both EECs to revert to alternate mode","Only the on-side EEC to revert","No engine effect","Engine shutdown"],"e":"Prevents both engines operating on a single data source."},{"id":"F07-14","c":"F07","r":"FCOM 7.20","q":"Which limit does the EEC NOT protect, so the crew must observe it?","o":["EGT redline","N1 redline","N2 redline","Both N1 and N2"],"e":"N1/N2 overspeed protection is provided in normal and alternate modes."},{"id":"F07-15","c":"F07","r":"FCOM 7.20","q":"TCMA shuts down an engine when:","o":["On the ground, thrust lever at idle, and engine above idle not decelerating normally","In flight with thrust asymmetry","N2 overspeed in flight","EGT exceeds limit on the ground"],"e":"Each engine is monitored on its own; it doesn't compare engines."},{"id":"F07-16","c":"F07","r":"FCOM 7.20","q":"The Electronic Overspeed System (EOS) in flight:","o":["Shuts off fuel for an uncontrollable N2 overspeed","Limits N1 to 104%","Reduces thrust to idle","Arms auto-relight"],"e":"ENG FAIL appears when N2 falls below scheduled idle."},{"id":"F07-17","c":"F07","r":"FCOM 7.20","q":"Icing idle is selected in flight when:","o":["Flaps up, main gear not down and locked, and engine anti-ice ON","Flaps 15 or more","Wing anti-ice ON","Below 22,000 ft"],"e":"Full icing idle is reached at or below 22,000 ft (transition starts at 30,400 ft)."},{"id":"F07-18","c":"F07","r":"FCOM 7.20","q":"Approach idle is selected when:","o":["Flaps 15 or greater, or flaps not up with engine anti-ice ON","Gear down","Below 10,000 ft","Only flaps 30 and 40"],"e":"It improves acceleration for a go-around."},{"id":"F07-19","c":"F07","r":"FCOM 7.20","q":"If the EEC loses flap or anti-ice signals in flight, approach idle begins below:","o":["19,000 ft MSL","10,000 ft MSL","22,000 ft MSL","15,000 ft MSL"],"e":"Default protective schedule."},{"id":"F07-20","c":"F07","r":"FCOM 7.20","q":"Bowed Rotor Motoring (BRM) runs for:","o":["6–90 seconds, on the ground only","Exactly 60 seconds in flight and on the ground","Up to 5 minutes","Only after long cold soak"],"e":"MOTORING shows on the N2 gauge between 18% and 26% N2."},{"id":"F07-21","c":"F07","r":"FCOM 7.20","q":"During the TCMA/EOS test after moving the start lever to IDLE:","o":["Fuel flow shows zero and ENG VALVE CLOSED stays bright blue","EGT box flashes white","START VALVE OPEN extinguishes","Ignition is tested only"],"e":"The valve cycles; the start continues after the test."},{"id":"F07-22","c":"F07","r":"FCOM 7.20","q":"Starter cutout occurs at approximately:","o":["63% N2","56% N2","50% N2","25% N2"],"e":"The start switch returns to OFF and the start valve closes."},{"id":"F07-23","c":"F07","r":"FCOM 7.20","q":"A wet start is detected when EGT does not rise; the EEC cuts fuel and ignition after:","o":["15 seconds","10 seconds","30 seconds","60 seconds"],"e":"Ground start protection only."},{"id":"F07-24","c":"F07","r":"FCOM 7.20","q":"Do the abnormal start protections work during inflight starts?","o":["No, ground starts only","Yes, all of them","Only hot start protection","Only wet start protection"],"e":"In flight the EEC only interrupts fuel briefly when EGT is within 10°C of the start limit."},{"id":"F07-25","c":"F07","r":"FCOM 7.20","q":"Igniter power: left igniter from ___, right igniter from ___.","o":["Associated AC transfer bus; AC standby bus","AC standby bus; DC bus","Battery bus; AC transfer bus","DC bus 1; DC bus 2"],"e":"Each engine has two igniters."},{"id":"F07-26","c":"F07","r":"FCOM 7.10","q":"Ignition select switch BOTH:","o":["Selects both igniters for both engines","Selects one igniter per engine","Starts both engines","Arms continuous ignition"],"e":"IGN L and IGN R select one igniter for both engines."},{"id":"F07-27","c":"F07","r":"FCOM 7.10","q":"Engine start switch FLT:","o":["Provides both igniters when the start lever is in IDLE","Provides ignition only on the ground","Is used for engine start on the ground","Arms auto-relight only"],"e":"CONT gives selected igniters while operating."},{"id":"F07-28","c":"F07","r":"FCOM 7.20","q":"Auto-relight activates both igniters when:","o":["An uncommanded rapid N2 decrease or N2 below idle is detected","Engine anti-ice is ON","Flaps are extended","In heavy rain only"],"e":"It provides flameout protection."},{"id":"F07-29","c":"F07","r":"FCOM 7.20","q":"The X-BLD indication means:","o":["Crossbleed air is recommended for an inflight start","Crossbleed valve open","Bleed duct leak","APU bleed in use"],"e":"Shown when airspeed is too low for a windmill start."},{"id":"F07-30","c":"F07","r":"FCOM 7.20","q":"Engine No. 1 thrust reverser is powered by:","o":["System A (standby as alternate)","System B","Standby only","Electric actuators"],"e":"Engine 2 reverser by system B."},{"id":"F07-31","c":"F07","r":"FCOM 7.20","q":"Thrust reverser deployment requires:","o":["Either RA below 10 ft plus air/ground sensor in ground mode","Both main gear compressed","Wheel spin-up above 60 kt","Speed brake lever UP"],"e":"Forward thrust levers must be at idle."},{"id":"F07-32","c":"F07","r":"FCOM 7.10","q":"Amber REV indication means:","o":["Reverser has moved from stowed but is not fully deployed","Reverser fully deployed","Reverser fault","Reverse idle selected"],"e":"Green = deployed."},{"id":"F07-33","c":"F07","r":"FCOM 7.10","q":"Reverse thrust lever is blocked at reverse idle until the reverser is more than:","o":["60% deployed","90% deployed","30% deployed","Fully deployed"],"e":"Detent No. 2 is adequate for normal operations."},{"id":"F07-34","c":"F07","r":"FCOM 7.20","q":"Pausing the reverse thrust lever past detent 1 toward stow for about how long may lock the sleeves?","o":["8 seconds","2 seconds","15 seconds","30 seconds"],"e":"Cycling the reversers may clear the fault."},{"id":"F07-35","c":"F07","r":"FCOM 7.10","q":"REVERSER LIMITED light in flight means:","o":["A fault limits reverse thrust: no deploy or idle reverse only","Reverser deployed in flight","Reverser isolation valve open","Normal; it is a test"],"e":"MASTER CAUTION and ENG also illuminate."},{"id":"F07-36","c":"F07","r":"FCOM 7.20","q":"The APU starts and operates up to:","o":["Maximum certified altitude","25,000 ft","17,000 ft","35,000 ft"],"e":"Bleed for two packs on the ground or one in flight."},{"id":"F07-37","c":"F07","r":"FCOM 7.30","q":"APU air inlet door positions:","o":["Closed, flight open (~17°) and ground open (~45°)","Closed and open only","Closed, 10°, 30°","Ground 17°, flight 45°"],"e":"It is on the right side of the fuselage."},{"id":"F07-38","c":"F07","r":"FCOM 7.30","q":"APU starter power comes from:","o":["Transfer bus 1, or the main battery if no AC","Battery only","Transfer bus 2","AC standby bus"],"e":"Battery switch OFF shuts the APU down."},{"id":"F07-39","c":"F07","r":"FCOM 7.30","q":"Moving the battery switch OFF with the APU running:","o":["Shuts down the APU","Has no effect","Disconnects the APU generator only","Closes the APU bleed valve only"],"e":"The electronic control unit loses power."},{"id":"F07-40","c":"F07","r":"FCOM 7.30","q":"The APU start cycle may take as long as:","o":["120 seconds","60 seconds","90 seconds","3 minutes"],"e":"If GEN OFF BUS doesn't illuminate by then, FAULT illuminates."},{"id":"F07-41","c":"F07","r":"FCOM 7.30","q":"Recommended APU run time before using it as a bleed source:","o":["Two minutes","One minute","Five minutes","30 seconds"],"e":"Extends APU service life."},{"id":"F07-42","c":"F07","r":"FCOM 7.30","q":"APU switch to OFF: shutdown occurs after a cooling period of:","o":["60 seconds","120 seconds","30 seconds","5 minutes"],"e":"Generator trips and bleed valve closes immediately."},{"id":"F07-43","c":"F07","r":"FCOM 7.20","q":"The Load Reduction Device (LRD) activates after a fan blade out and may cause:","o":["Oil in the bleed air system with smoke/fumes in flight deck or cabin","Automatic engine restart","Loss of hydraulic system B","APU shutdown"],"e":"Pulling the fire switch or start lever CUTOFF isolates the bleed."},{"id":"F08-01","c":"F08","r":"FCOM 8.20","q":"Engine overheat/fire detection is powered by the ___, and extinguishing by the ___.","o":["Battery bus; hot battery bus","Hot battery bus; battery bus","DC bus 1; DC bus 2","AC transfer bus 1; battery bus"],"e":"Same arrangement for the APU."},{"id":"F08-02","c":"F08","r":"FCOM 8.20","q":"How many detector loops per engine, and what do they sense?","o":["Two loops, each sensing both overheat and fire","One loop for fire, one for overheat","One combined loop","Three loops"],"e":"Normally both loops must sense the condition to alert."},{"id":"F08-03","c":"F08","r":"FCOM 8.20","q":"With OVHT DET in NORMAL and one loop fails:","o":["It is deselected automatically with no flight deck indication; the other loop works alone","FAULT light illuminates","MASTER CAUTION and OVHT/DET illuminate","Detection becomes inoperative"],"e":"FAULT appears only when both loops fail."},{"id":"F08-04","c":"F08","r":"FCOM 8.20","q":"With OVHT DET switch in A, if loop A fails:","o":["FAULT light illuminates and detection is inoperative","Loop B takes over automatically","No indication","Fire bell sounds"],"e":"The non-selected loop is not monitored."},{"id":"F08-05","c":"F08","r":"FCOM 8.20","q":"Indications of an engine overheat:","o":["MASTER CAUTION, OVHT/DET annunciator, related ENG OVERHEAT light","Fire bell and FIRE WARN lights","Engine fire switch illuminated only","Start lever illuminated"],"e":"No bell for an overheat."},{"id":"F08-06","c":"F08","r":"FCOM 8.20","q":"Indications of an engine fire include all EXCEPT:","o":["APU automatic shutdown","Fire warning bell","Master FIRE WARN lights","Related start lever illuminated"],"e":"Plus fire switch illuminated and all overheat indications."},{"id":"F08-07","c":"F08","r":"FCOM 8.20","q":"Pulling an engine fire switch does all of the following EXCEPT:","o":["Discharges a fire bottle","Closes engine and spar fuel shutoff valves","Closes engine bleed and hydraulic shutoff valves","Disables the thrust reverser and trips the generator"],"e":"Rotating the switch discharges the bottle."},{"id":"F08-08","c":"F08","r":"FCOM 8.20","q":"Can either engine bottle be discharged into either engine?","o":["Yes, either or both","No, each bottle serves one engine","Only bottle 1 into either engine","Only on the ground"],"e":"Rotate one way for one bottle, the other way for the second."},{"id":"F08-09","c":"F08","r":"FCOM 8.20","q":"Engine fire switches are unlocked by:","o":["An engine fire or ENG OVERHEAT indication, or manual override","Battery switch ON","Start lever CUTOUT","Only a fire indication"],"e":"Manual unlock uses the override button under the handle."},{"id":"F08-10","c":"F08","r":"FCOM 8.10","q":"Fire warning BELL CUTOUT does all of the following EXCEPT:","o":["Extinguishes the engine fire switch light","Silences the bell","Extinguishes master FIRE WARN lights","Resets the system for further warnings"],"e":"On the ground it also silences the remote APU horn."},{"id":"F08-11","c":"F08","r":"FCOM 8.10","q":"EXT TEST switch position 1 tests squib continuity for:","o":["Engine 1 bottle and APU bottle","Engine 1 bottle only","Both engine bottles","Cargo bottles"],"e":"Position 2 tests engine 2 and APU."},{"id":"F08-12","c":"F08","r":"FCOM 8.20","q":"OVHT/FIRE test indications include all EXCEPT:","o":["Cargo fire warning lights","Both engine fire switches and start levers illuminated","Both ENG OVERHEAT lights","WHEEL WELL light (if AC power available)"],"e":"Cargo fire has its own TEST switch."},{"id":"F08-13","c":"F08","r":"FCOM 8.20","q":"How many fire detection loops on the APU?","o":["One","Two","Three","None; only overheat"],"e":"If it fails, APU DET INOP illuminates."},{"id":"F08-14","c":"F08","r":"FCOM 8.20","q":"Indications of an APU fire include:","o":["APU fire switch illuminated and APU automatic shutdown","APU continues running until switch pulled","Only a wheel well horn","APU DET INOP light"],"e":"On the ground the wheel well horn sounds and light flashes."},{"id":"F08-15","c":"F08","r":"FCOM 8.20","q":"Where is the APU ground control panel?","o":["Right main wheel well","Left main wheel well","Nose wheel well","Aft cargo door"],"e":"It has an APU fire light, horn cutout, fire handle and discharge switch."},{"id":"F08-16","c":"F08","r":"FCOM 8.20","q":"Pulling the APU fire switch:","o":["Closes APU fuel valve, bleed valve and inlet door, trips the generator, arms the bottle","Discharges the APU bottle","Starts the APU fire horn","Only silences the bell"],"e":"It backs up the automatic shutdown."},{"id":"F08-17","c":"F08","r":"FCOM 8.20","q":"Main wheel well fire protection consists of:","o":["Detection only (no extinguishing)","Detection and extinguishing","Extinguishing only","Overheat detection only"],"e":"The nose wheel well has no fire detection."},{"id":"F08-18","c":"F08","r":"FCOM 8.20","q":"Main wheel well fire detection is powered by:","o":["AC transfer bus","Battery bus","Hot battery bus","DC bus 2"],"e":"That is why the WHEEL WELL test light needs AC power."},{"id":"F08-19","c":"F08","r":"FCOM 8.20","q":"Cargo smoke detection normally requires:","o":["Both loops to sense smoke","Any one detector","Either loop","Three detectors"],"e":"Power failure in one loop converts automatically to single loop."},{"id":"F08-20","c":"F08","r":"FCOM 8.20","q":"Cargo fire suppression bottles:","o":["One 25 lb HRD and one 33 lb LRD Halon bottle shared by both compartments","One bottle per compartment","Two equal bottles per compartment","One 33 lb bottle"],"e":"Select the compartment with the ARMED switch."},{"id":"F08-21","c":"F08","r":"FCOM 8.20","q":"After pushing cargo DISCH, the LRD bottle discharges after:","o":["15 minutes","5 minutes","30 minutes","Immediately"],"e":"Total suppression time 195 minutes (180-minute flight plus 15 reserve)."},{"id":"F08-22","c":"F08","r":"FCOM 8.20","q":"Total cargo fire suppression time provided:","o":["195 minutes","180 minutes","60 minutes","120 minutes"],"e":"Supports a 180-minute flight plus 15-minute reserve."},{"id":"F08-23","c":"F08","r":"FCOM 8.20","q":"If the LRD bottle has not discharged before landing:","o":["It will not discharge after landing","It discharges at touchdown","It discharges at engine shutdown","It must be disarmed manually"],"e":"If already discharging, it continues until empty."},{"id":"F08-24","c":"F08","r":"FCOM 8.20","q":"After cargo agent discharge, cargo fire warning lights may stay on because:","o":["Optical sensors can't tell smoke from suppression agent","The bottle failed","The detectors are damaged","The ARMED switch is still in"],"e":"Smoke may persist until the fire is put out after landing."},{"id":"F08-25","c":"F08","r":"FCOM 8.20","q":"Cargo DISCH light may take up to how long to illuminate?","o":["30 seconds","5 seconds","2 minutes","15 minutes"],"e":"It shows the bottle has discharged."},{"id":"F08-26","c":"F08","r":"FCOM 8.20","q":"Lavatory smoke detection gives what indication in the flight deck?","o":["None","Master caution","Fire bell","ND message"],"e":"The alarm is silenced at the lavatory; it resets after 30 s with no smoke."},{"id":"F08-27","c":"F08","r":"FCOM 8.20","q":"Lavatory waste bin fire extinguisher operation is:","o":["Automatic (heat activated), with no flight deck indication","Manual from the flight deck","Manual by flight attendant only","Triggered by the smoke detector"],"e":"Its temperature placard turns black when exposed to high heat."},{"id":"F08-28","c":"F08","r":"FCOM 8.10","q":"DETECTOR FAULT light during a cargo fire test indicates:","o":["One or more detectors in the selected loop(s) failed","Bottle discharged","Loop powered down","Normal test"],"e":"Individual detector faults are found only by manual test; no master caution."},{"id":"F08-29","c":"F08","r":"FCOM 8.10","q":"Engine BOTTLE DISCHARGED light illuminates when:","o":["The bottle has discharged or its pressure is low","The fire switch is pulled","EXT TEST is selected","The fire is out"],"e":"It comes on a few seconds after rotating the switch."},{"id":"F08-30","c":"F08","r":"FCOM 8.10","q":"APU fire light in the wheel well, red steady (not flashing), means:","o":["HORN CUTOUT was pushed after an APU fire indication","Fire is out","APU is running","Bottle discharged"],"e":"Flashing = APU fire."},{"id":"F09-01","c":"F09","r":"FCOM 9.20","q":"During takeoff, the rudder becomes aerodynamically effective between:","o":["40 and 60 kt","60 and 80 kt","30 and 40 kt","80 and 100 kt"],"e":"A single rudder provides yaw control."},{"id":"F09-02","c":"F09","r":"FCOM 9.20","q":"With total loss of hydraulic systems A and B, which surfaces can still be moved manually?","o":["Ailerons and elevators (rudder via standby system)","Rudder only","All surfaces including spoilers","Elevators only"],"e":"Manual reversion forces are higher due to friction and air loads."},{"id":"F09-03","c":"F09","r":"FCOM 9.20","q":"If the aileron control system is jammed, roll control is available from:","o":["The spoilers, using the First Officer's control wheel","The ailerons, using the Captain's wheel","Rudder only","Neither wheel"],"e":"If the F/O wheel jams, the Captain's wheel moves the ailerons."},{"id":"F09-04","c":"F09","r":"FCOM 9.20","q":"Aileron trim requires:","o":["Both aileron trim switches pushed together","One switch only","The autopilot to be engaged","Flaps extended"],"e":"Trim applied with the A/P engaged can cause a roll when it disconnects."},{"id":"F09-05","c":"F09","r":"FCOM 9.20","q":"Flight spoilers begin deflecting for roll when the control wheel is displaced more than about:","o":["10 degrees","5 degrees","20 degrees","2 degrees"],"e":"They rise on the up-aileron wing only."},{"id":"F09-06","c":"F09","r":"FCOM 9.20","q":"How many flight spoilers are on each wing?","o":["Four","Two","Six","Three"],"e":"Systems A and B each power a different symmetric set."},{"id":"F09-07","c":"F09","r":"FCOM 9.20","q":"In a control column jam, how is pitch control recovered?","o":["Apply force to break out the columns; the free column controls the elevator","Use stab trim only","Select STBY RUD","Use the elevator jam assist switch only"],"e":"Travel is reduced but sufficient to flare."},{"id":"F09-08","c":"F09","r":"FCOM 9.20","q":"Elevator Jam Landing Assist activation requires:","o":["Switch ON, flaps 1 or greater, autopilot disengaged","Switch ON and gear down","Autopilot engaged in CWS","Flaps 30 or 40 only"],"e":"It uses flight spoilers for small flight path changes."},{"id":"F09-09","c":"F09","r":"FCOM 9.20","q":"The elevator feel computer uses:","o":["Elevator pitot airspeed and stabilizer position, powered by the higher of system A or B","ADIRU airspeed and flap position","System B only","Standby hydraulics"],"e":"FEEL DIFF PRESS shows excessive differential pressure."},{"id":"F09-10","c":"F09","r":"FCOM 9.20","q":"Mach trim operates automatically above:","o":["Mach 0.615","Mach 0.68","Mach 0.74","Mach 0.82"],"e":"It adjusts elevators relative to stabilizer for speed stability."},{"id":"F09-11","c":"F09","r":"FCOM 9.20","q":"Main electric stabilizer trim authority with flaps RETRACTED:","o":["3.85 to 14.0 units","-0.45 to 14.0 units","-0.70 to 16.4 units","0 to 17 units"],"e":"Flaps extended: -0.45 to 14.0; manual trim: -0.70 to 16.4."},{"id":"F09-12","c":"F09","r":"FCOM 9.20","q":"Manual stabilizer trim (wheel) authority:","o":["-0.70 to 16.4 units","-0.45 to 14.0 units","3.85 to 14.0 units","0 to 15 units"],"e":"Manual trim has more authority than electric or autopilot trim."},{"id":"F09-13","c":"F09","r":"FCOM 9.20","q":"With flaps extended, autopilot nose-up trim stops when airspeed is:","o":["3 kt or more into the amber minimum maneuver bar","At stick shaker","5 kt below VREF","At the top of the amber bar"],"e":"Main electric and A/P trim have high speed (flaps ext) and low speed (flaps up) modes."},{"id":"F09-14","c":"F09","r":"FCOM 9.20","q":"Placing either STAB TRIM cutout switch to CUTOUT disconnects:","o":["Autopilot, main electric and Speed Trim System (incl. MCAS) inputs","Manual trim wheel","Only autopilot trim","Only MCAS"],"e":"Manual wheel trim remains available."},{"id":"F09-15","c":"F09","r":"FCOM 9.20","q":"Aft control column movement interrupts which trim?","o":["Main electric, autopilot and Speed Trim (but not MCAS nose-down)","MCAS nose-down","All trim including MCAS","None"],"e":"Forward column interrupts MCAS nose-up commands."},{"id":"F09-16","c":"F09","r":"FCOM 9.20","q":"STAB TRIM override switch in OVRD:","o":["Allows main electric trim regardless of column position","Disables manual trim","Disables MCAS","Engages the autopilot trim"],"e":"It bypasses the column-actuated cutout switches."},{"id":"F09-17","c":"F09","r":"FCOM 9.20","q":"If AOAs disagree by 5.5° or more with flaps up:","o":["SPEED TRIM FAIL illuminates and STS (incl. MCAS) is inhibited for the rest of the flight","Only MCAS is inhibited for 5 minutes","Autopilot disconnects","Stick shaker activates"],"e":"Requires flaps retracted."},{"id":"F09-18","c":"F09","r":"FCOM 9.20","q":"The Speed Trim System operates only when:","o":["The autopilot is not engaged","The autopilot is engaged","Flaps are up","Above 10,000 ft"],"e":"Main electric trim can override STS inputs."},{"id":"F09-19","c":"F09","r":"FCOM 9.20","q":"Speed Trim function operates up to:","o":["Mach 0.68","Mach 0.84","Mach 0.615","Mach 0.74"],"e":"It operates most in takeoff, climb and go-around."},{"id":"F09-20","c":"F09","r":"FCOM 9.20","q":"MCAS operating conditions:","o":["AOA above threshold, flaps up, up to Mach 0.84, autopilot not engaged","Flaps extended, any Mach","Autopilot engaged, flaps up","Any AOA, flaps up"],"e":"Commands are based on AOA and Mach."},{"id":"F09-21","c":"F09","r":"FCOM 9.20","q":"MCAS uses AOA from:","o":["Both AOA vanes, filtered into a single corrected value","Left vane only","Right vane only","The vane on the flying pilot's side"],"e":"Small differences are filtered out."},{"id":"F09-22","c":"F09","r":"FCOM 9.20","q":"If the MCAS command limit is reached within 5 minutes of activation:","o":["SPEED TRIM FAIL illuminates and STS is inhibited for the rest of the flight","MCAS resets automatically","Autopilot engages","Stab trim cutout is automatic"],"e":"Limit preserves elevator authority."},{"id":"F09-23","c":"F09","r":"FCOM 9.20","q":"The Elevator Feel Shift (EFS) module during a stall:","o":["Roughly doubles column forces using system A pressure","Adds nose-down trim","Reduces rudder authority","Shakes the column"],"e":"Inhibited on the ground, below 100 ft RA, or with A/P engaged; no flight deck indication."},{"id":"F09-24","c":"F09","r":"FCOM 9.20","q":"Main rudder PCU pressure reduction (both engines above about 137 kt):","o":["A and B pressures each reduced about 25%","System B shut off","Standby PCU activated","Rudder travel limited to 5°"],"e":"Disengages if an engine speed difference is detected."},{"id":"F09-25","c":"F09","r":"FCOM 9.20","q":"The rudder PCU Force Fight Monitor (FFM) trip:","o":["Turns on the standby pump and pressurizes the standby rudder PCU","Disconnects the yaw damper","Shuts off system A","Disengages the autopilot"],"e":"STBY RUD ON, MASTER CAUTION and FLT CONT illuminate."},{"id":"F09-26","c":"F09","r":"FCOM 9.20","q":"Normally, the main yaw damper uses:","o":["Hydraulic system B","System A","Standby system","Both A and B"],"e":"B FLT CONTROL switch OFF or STBY RUD trips the yaw damper OFF."},{"id":"F09-27","c":"F09","r":"FCOM 9.20","q":"Yaw damper operation moves the rudder pedals?","o":["No","Yes, always","Only in turns","Only with standby yaw damper"],"e":"Pilots can override with pedals or trim."},{"id":"F09-28","c":"F09","r":"FCOM 9.20","q":"Ground spoilers are powered by:","o":["System A","System B","Standby","Electric motors"],"e":"All four ground spoilers; there are two per wing upper surface."},{"id":"F09-29","c":"F09","r":"FCOM 9.20","q":"SPEEDBRAKES EXTENDED light in flight illuminates with speedbrakes extended and all EXCEPT:","o":["Above 10,000 ft","Landing configuration","Below 800 ft AGL","Thrust lever above idle for 15 s"],"e":"Also with a thrust lever above about 40° for 3 s."},{"id":"F09-30","c":"F09","r":"FCOM 9.20","q":"Landing Attitude Modifier (LAM) with flaps 30 or 40 deploys spoilers starting at about:","o":["VREF + 10 kt","VREF + 5 kt","VREF + 20 kt","VREF"],"e":"Forces a higher AOA to protect the nose gear."},{"id":"F09-31","c":"F09","r":"FCOM 9.20","q":"Emergency Descent Speedbrakes (EDS) arm when:","o":["Above 30,000 ft with cabin altitude warning active","Above 25,000 ft with PASS OXY on","Any time the speedbrake is used above FL250","Below 10,000 ft"],"e":"Spoilers go higher than normal in the flight detent."},{"id":"F09-32","c":"F09","r":"FCOM 9.20","q":"Auto speedbrakes (lever ARMED) deploy on landing when:","o":["RA below 6 ft, gear strut compresses, thrust levers idle","Wheel spin-up only","Reversers deploy","Main gear compresses only"],"e":"Wheel spin-up above 60 kt also deploys them."},{"id":"F09-33","c":"F09","r":"FCOM 9.20","q":"With SPEED BRAKE lever DOWN on landing or RTO, spoilers deploy automatically when:","o":["Reverse thrust levers are positioned for reverse","Wheel spin-up occurs","Brakes are applied","Never"],"e":"Advancing a thrust lever after landing stows them."},{"id":"F09-34","c":"F09","r":"FCOM 9.20","q":"Normal landing flap positions are:","o":["15, 30 and 40","25, 30 and 40","30 and 40 only","15, 25 and 30"],"e":"Flaps 15 normally where approach climb is limiting."},{"id":"F09-35","c":"F09","r":"FCOM 9.20","q":"Flap lever moved beyond 25: LE slats go to:","o":["Full extended","Extend","Retracted","Sealed only"],"e":"At flaps 1–25 the slats are in the extend position."},{"id":"F09-36","c":"F09","r":"FCOM 9.20","q":"Flap gates are at:","o":["Flaps 1 and flaps 15","Flaps 5 and flaps 25","Flaps 1 and 25","Flaps 10 and 30"],"e":"For engine-out and normal go-around flap selection."},{"id":"F09-37","c":"F09","r":"FCOM 9.20","q":"Flap load relief with flaps 40 retracts to 30 above:","o":["167 kt","162 kt","176 kt","158 kt"],"e":"Re-extends below 162 kt."},{"id":"F09-38","c":"F09","r":"FCOM 9.20","q":"Flap load relief with flaps 30 retracts to 25 above:","o":["176 kt","171 kt","167 kt","191 kt"],"e":"Re-extends below 171 kt."},{"id":"F09-39","c":"F09","r":"FCOM 9.20","q":"Flap load relief uses airspeed from:","o":["Left ADIRU (Captain's airspeed)","Right ADIRU","Standby airspeed","Elevator pitot"],"e":"If Captain's airspeed is erroneously high, select the next higher detent."},{"id":"F09-40","c":"F09","r":"FCOM 9.20","q":"Is flap load relief available during alternate flap extension?","o":["No","Yes","Only for flaps 40","Only on approach"],"e":"Available at flaps 10, 15, 25, 30, 40 in normal operation."},{"id":"F09-41","c":"F09","r":"FCOM 9.20","q":"Autoslat function moves the slats to full extend near stall at flap positions:","o":["1 through 25","Any position","30 and 40","Up only"],"e":"Powered by system B, or system A through the PTU."},{"id":"F09-42","c":"F09","r":"FCOM 9.20","q":"Alternate flap (electric) TE operation provides asymmetry/skew protection?","o":["No","Yes","Only asymmetry","Only skew"],"e":"Hold the switch DOWN until the desired position."},{"id":"F09-43","c":"F09","r":"FCOM 9.20","q":"TE uncommanded motion shutdown: can the crew reset it?","o":["No; use the alternate flap system","Yes, by cycling the flap lever","Yes, with TRIP RESET","Yes, by turning off system B"],"e":"Flap indicator disagrees with lever; no needle split."},{"id":"F09-44","c":"F09","r":"FCOM 9.20","q":"A flap asymmetry or skew detected by the FSEU shows as:","o":["A needle split on the flap position indicator","LE FLAPS TRANSIT only","Master warning","No indication"],"e":"The FSEU closes the TE bypass valve."},{"id":"F09-45","c":"F09","r":"FCOM 9.10","q":"SPEED TRIM FAIL light that appears only on MASTER CAUTION recall indicates:","o":["A single FCC channel failure","Both channels failed","MCAS active","Stab trim cutout"],"e":"The light clears when the master caution system is reset."},{"id":"F10-01","c":"F10","r":"FCOM 10.20","q":"How many display units (DUs) are in the MAX flight deck?","o":["Four identical LCDs","Six","Five","Two large plus two small"],"e":"Outboard and inboard DU on each side."},{"id":"F10-02","c":"F10","r":"FCOM 10.20","q":"The Captain's outboard and inboard DUs are powered by:","o":["28 V DC standby bus","DC bus 1","Battery bus","AC transfer bus 1"],"e":"The First Officer's DUs are on DC bus 2."},{"id":"F10-03","c":"F10","r":"FCOM 10.20","q":"Normally, which DPC drives the Captain's displays?","o":["DPC 1","DPC 2","Both together","The master FCC"],"e":"DPC 2 drives the F/O's displays; one DPC can drive all four after a failure."},{"id":"F10-04","c":"F10","r":"FCOM 10.20","q":"When displays are switched to a single DPC, the PFDs show:","o":["DSPLY SOURCE 1 or 2","DPC FAIL","SINGLE CH","EFIS FAIL"],"e":"Switching can be automatic or manual via DISPLAYS SOURCE."},{"id":"F10-05","c":"F10","r":"FCOM 10.20","q":"CONTROL PANEL switch in BOTH ON 1:","o":["Captain's EFIS control panel controls both pilots' displays","F/O's panel controls both","Each pilot controls own displays","Both panels disabled"],"e":"Useful if one EFIS control panel fails."},{"id":"F10-06","c":"F10","r":"FCOM 10.20","q":"Display Select switch in INBD:","o":["Outboard DU blanks; inboard DU shows cropped PFD (plus engine display if it was there)","Inboard DU blanks","Both DUs show the ND","Swaps Captain and F/O displays"],"e":"Used for undetected DU failures."},{"id":"F10-07","c":"F10","r":"FCOM 10.20","q":"If an inboard DU showing the engine display fails:","o":["The engine display transfers to the other inboard DU","Engine display is lost","It moves to the outboard DU automatically","The standby engine display appears"],"e":"If both inboard DUs fail, use display select switches to show it on an outboard DU."},{"id":"F10-08","c":"F10","r":"FCOM 10.20","q":"ADIRS components include how many pitot probes and static ports?","o":["Three pitot probes and six static ports","Two pitot probes and four static ports","Three pitot probes and four static ports","Two pitot and six static"],"e":"Plus two ADIRUs, four ADMs, two alpha vanes and one TAT probe."},{"id":"F10-09","c":"F10","r":"FCOM 10.20","q":"The auxiliary pitot probe (standby instruments) is on:","o":["The First Officer's side","The Captain's side","The vertical fin","The nose centerline"],"e":"Alternate static ports also feed the standby instruments."},{"id":"F10-10","c":"F10","r":"FCOM 10.20","q":"Is there any cross connection between pitot probes and air data modules?","o":["No; each pitot ADM connects to its on-side probe","Yes, they are cross-fed","Only on standby power","Only for the ISFD"],"e":"Captain's ADM → left ADIRU; F/O's ADM → right ADIRU."},{"id":"F10-11","c":"F10","r":"FCOM 10.20","q":"The ISFD gets magnetic heading from:","o":["ADIRU-L","Its own magnetometer","ADIRU-R","The standby compass"],"e":"In polar regions it switches to true heading."},{"id":"F10-12","c":"F10","r":"FCOM 10.20","q":"ISFD localizer/glideslope deviation comes from:","o":["MMR #1","MMR #2","The FMC","ADIRU-L"],"e":"Airspeed/altitude come from the aux pitot and alternate static."},{"id":"F10-13","c":"F10","r":"FCOM 10.20","q":"ISFD is powered by the ___ and initialization takes:","o":["Battery bus; 90 seconds (after a 10 s delay)","DC standby; 30 seconds","Hot battery bus; 3 minutes","AC standby; 60 seconds"],"e":"It activates with the battery switch ON."},{"id":"F10-14","c":"F10","r":"FCOM 10.20","q":"ATT:RST on the ISFD requires the attitude reset switch to be used:","o":["Stationary on the ground, or wings level unaccelerated in flight for 10 s","Only on the ground","During a turn","Only above 10,000 ft"],"e":"Failure to stay level may bring the message back."},{"id":"F10-15","c":"F10","r":"FCOM 10.20","q":"Elapsed time on the AUX clock starts automatically at:","o":["Weight off wheels","Engine start","Pushback","Thrust lever advance"],"e":"It stops at weight on wheels plus 30 seconds."},{"id":"F10-16","c":"F10","r":"FCOM 10.20","q":"The DFDR records the most recent:","o":["25 hours","2 hours","50 hours","120 minutes"],"e":"Locator beacon life depends on configuration (30 or 90 days)."},{"id":"F10-17","c":"F10","r":"FCOM 10.30","q":"Current Mach is displayed below the airspeed tape at or above:","o":["Mach 0.40","Mach 0.60","Mach 0.30","Mach 0.50"],"e":"Groundspeed shows in the compass/mini-map area."},{"id":"F10-18","c":"F10","r":"FCOM 10.30","q":"The airspeed trend vector predicts airspeed in:","o":["10 seconds","5 seconds","30 seconds","15 seconds"],"e":"Shown on the speed tape."},{"id":"F10-19","c":"F10","r":"FCOM 10.30","q":"The pitch limit indication is shown when:","o":["Flaps are not up, or flaps up approaching stick shaker","Always","Only with A/P engaged","Only on approach"],"e":"It shows the margin to stick shaker."},{"id":"F10-20","c":"F10","r":"FCOM 10.30","q":"The FPV symbol is dim when:","o":["The F/D or a TCAS RA is displayed","The A/P is engaged","On approach","Below 1,000 ft"],"e":"Bright when F/D off and no RA."},{"id":"F10-21","c":"F10","r":"FCOM 10.30","q":"The localizer scale expands when deviation is slightly more than 1/2 dot with LOC engaged and track within:","o":["5° of the MCP course","10°","2°","15°"],"e":"Amber flashing scale warns of excessive deviation at low RA with A/P engaged."},{"id":"F10-22","c":"F10","r":"FCOM 10.30","q":"Below 1,000 ft AGL with LNAV engaged and LOC armed but not captured:","o":["The localizer scale turns amber and pointer flashes","The A/P disconnects","LNAV disengages","GPWS alerts"],"e":"Prompts the crew to check capture."},{"id":"F10-23","c":"F10","r":"FCOM 10.30","q":"The deviation alerting system self-tests when armed at:","o":["1,500 ft RA","2,500 ft RA","1,000 ft RA","500 ft RA"],"e":"Produces a 2-second LOC and G/S alert display."},{"id":"F10-24","c":"F10","r":"FCOM 10.30","q":"The rising runway symbol appears below ___ and rises toward the airplane symbol at ___.","o":["2,500 ft RA; 200 ft RA","1,500 ft; 100 ft","1,000 ft; 50 ft","2,000 ft; 500 ft"],"e":"It shows when the localizer pointer is in view."},{"id":"F10-25","c":"F10","r":"FCOM 10.30","q":"Radio altitude is shown as a round dial when below:","o":["1,000 ft AGL","2,500 ft AGL","500 ft AGL","200 ft AGL"],"e":"Between 1,000 and 2,500 ft it is digital."},{"id":"F10-26","c":"F10","r":"FCOM 10.30","q":"The landing altitude reference bar is white from ___ and amber from ___ above landing altitude.","o":["1,000 to 500 ft; 500 ft to touchdown","2,500 to 1,000 ft; 1,000 to 0","500 to 200 ft; 200 to 0","1,500 to 1,000 ft; 1,000 to 0"],"e":"It's on the inner edge of the altitude tape."},{"id":"F10-27","c":"F10","r":"FCOM 10.30","q":"Vertical speed is shown digitally when greater than:","o":["400 fpm","200 fpm","1,000 fpm","100 fpm"],"e":"Shown above for climb, below for descent."},{"id":"F10-28","c":"F10","r":"FCOM 10.30","q":"The part-time mini-MAP range is fixed at:","o":["20 NM","10 NM","40 NM","5 NM"],"e":"Available when the ND isn't shown due to a failure."},{"id":"F10-29","c":"F10","r":"FCOM 10.40","q":"Which ND mode is presented true north up?","o":["PLN","MAP","VOR","APP"],"e":"Use STEP on the CDU LEGS page to step through the route."},{"id":"F10-30","c":"F10","r":"FCOM 10.40","q":"On the ND, magenta indicates:","o":["Command information, fly-to points and pointers","Cautions","Inactive information","Present status"],"e":"Cyan = background/inactive; amber = cautions/faults."},{"id":"F10-31","c":"F10","r":"FCOM 10.40","q":"EXCESS DATA on the ND is cleared by:","o":["Reducing map information or deselecting map switches","Changing DPC","Resetting the FMC","Selecting PLN mode"],"e":"Too much information to display."},{"id":"F10-32","c":"F10","r":"FCOM 10.20","q":"Static air temperature on the CDU PROGRESS page comes from:","o":["ADIRUs using the TAT probe","The FMC weather data","An OAT probe","The EEC"],"e":"TAT on the display should not be used as OAT for takeoff."},{"id":"F11-01","c":"F11","r":"FCOM 11.20","q":"GPS sensors are located in:","o":["The two Multi-Mode Receivers (MMRs)","The ADIRUs","The FMCs","A separate GPS unit in the E/E bay"],"e":"Each MMR also includes ILS, GLS, VOR and marker beacon."},{"id":"F11-02","c":"F11","r":"FCOM 11.20","q":"The amber GPS light illuminates immediately when:","o":["Both GPS sensors fail","One GPS sensor fails","GPS is deselected","RAIM is lost"],"e":"A single failure shows only on MASTER CAUTION recall."},{"id":"F11-03","c":"F11","r":"FCOM 11.20","q":"If all GPS data is lost, FMC position comes from:","o":["Radio updating or IRS","The last GPS position only","Pilot entry every 10 minutes","The ISFD"],"e":"GPS can be deselected on NAV OPTIONS page 2/2."},{"id":"F11-04","c":"F11","r":"FCOM 11.20","q":"Each IRS uses:","o":["Three laser ring gyros and accelerometers","Mechanical gyros","GPS-aided gyros only","Fiber optic gyros"],"e":"IRSs are the sole source of attitude/heading except ISFD and compass."},{"id":"F11-05","c":"F11","r":"FCOM 11.20","q":"Normal IRS alignment is available up to latitude:","o":["78° 15' N/S","70.2° N/S","60° N/S","82° N/S"],"e":"Initiated by rotating the MSU from OFF to NAV."},{"id":"F11-06","c":"F11","r":"FCOM 11.20","q":"IRS alignment time ranges from:","o":["5 to 17 minutes depending on latitude","3 to 10 minutes","10 minutes always","15 to 30 minutes"],"e":"Up to 60°: 5–10 min; 60–70.2°: 10 min; above 70.2°: about 17 min."},{"id":"F11-07","c":"F11","r":"FCOM 11.20","q":"If the airplane moves during IRS alignment:","o":["Alignment stops and restarts automatically 30 s after motion stops","Alignment continues","FAULT light illuminates permanently","IRS goes to ATT mode"],"e":"CDU shows Excessive Motion; ISDU shows code 03."},{"id":"F11-08","c":"F11","r":"FCOM 11.20","q":"VERIFY POSITION appears if the entered position is not within:","o":["4 NM of the origin airport","1 NM","10 NM","Within 1° latitude"],"e":"ENTER IRS POSITION appears if internal comparison tests fail."},{"id":"F11-09","c":"F11","r":"FCOM 11.20","q":"A flashing ALIGN light during alignment means:","o":["The entered position failed an internal comparison test","Alignment is complete","IRS is on DC power","Motion detected"],"e":"Two consecutive identical failing entries of the latitude test bring the FAULT light."},{"id":"F11-10","c":"F11","r":"FCOM 11.20","q":"Fast realignment (about 30 s) is done by:","o":["Rotating MSU from NAV to ALIGN and back to NAV without passing OFF","Rotating OFF then NAV","Pressing the ISDU reset","Entering position twice"],"e":"Update present position at the same time."},{"id":"F11-11","c":"F11","r":"FCOM 11.20","q":"Automatic Navigation Realignment (ANR) first reset requires no motion for:","o":["7.5 to 15 minutes","1 minute","30 seconds","5 minutes"],"e":"Then resets every minute until motion."},{"id":"F11-12","c":"F11","r":"FCOM 11.20","q":"Align In Motion (AIM) after an in-flight power interruption requires:","o":["About 30 s straight and level; full nav restored in about 10–30 min; needs GPS","A landing","ATT mode selection","Manual heading entry"],"e":"Heading changes shorten alignment."},{"id":"F11-13","c":"F11","r":"FCOM 11.20","q":"If an IRS loses alignment in flight (without AIM), you can:","o":["Select ATT for attitude after about 30 s of straight, level flight","Realign in NAV","Use fast realignment","Nothing; it is lost"],"e":"Then enter magnetic heading on the CDU or ISDU."},{"id":"F11-14","c":"F11","r":"FCOM 11.20","q":"In ATT mode, IRS heading can drift up to:","o":["15° per hour","5° per hour","1° per hour","30° per hour"],"e":"Cross-check and update heading periodically."},{"id":"F11-15","c":"F11","r":"FCOM 11.20","q":"The left IRS is normally powered from ___ and the right from ___.","o":["AC standby bus; AC transfer bus 2","AC transfer bus 1; AC transfer bus 2","DC standby; DC bus 2","Battery bus; battery bus"],"e":"Backup DC comes from the switched hot battery bus."},{"id":"F11-16","c":"F11","r":"FCOM 11.20","q":"Backup DC power to the RIGHT IRS terminates if AC is not restored within:","o":["5 minutes","30 seconds","10 minutes","It never terminates"],"e":"On the ground, the nose wheel well horn alerts maintenance."},{"id":"F11-17","c":"F11","r":"FCOM 11.20","q":"After IRS mode selector is turned OFF, the IRS stays powered about:","o":["30 seconds to store position","5 minutes","No time; immediately off","2 minutes"],"e":"ALIGN light stays on until shutdown is complete."},{"id":"F11-18","c":"F11","r":"FCOM 11.20","q":"The ISDU displays heading as:","o":["True heading","Magnetic heading","Track","Grid heading"],"e":"Remember when comparing to the compass."},{"id":"F11-19","c":"F11","r":"FCOM 11.20","q":"The IRS transfer switch moves which systems to the operating IRS?","o":["Flight control (A/P, A/T), displays, weather radar and DFDAU","All airplane systems","Only the displays","FMC only"],"e":"Other systems are not affected."},{"id":"F11-20","c":"F11","r":"FCOM 11.20","q":"The decoded navaid identifier on the PFD/ND:","o":["Is not compared with the FMC database and may decode incorrectly","Is verified by the FMC","Is always correct","Replaces the Morse audio check"],"e":"Verify with the audio Morse code."},{"id":"F11-21","c":"F11","r":"FCOM 11.20","q":"FMC LOC updating occurs only:","o":["After the ILS is manually tuned","Automatically on approach","When APP is armed","Below 2,000 ft"],"e":"ILS receivers are tuned manually."},{"id":"F11-22","c":"F11","r":"FCOM 11.20","q":"Transponder ADS-B position: Transponder 1 receives data from:","o":["Left GPS","Right GPS","FMC","Left IRS"],"e":"Right GPS feeds Transponder 2."},{"id":"F11-23","c":"F11","r":"FCOM 11.20","q":"Weather radar turbulence (magenta) is shown for precipitation moving at ___ and limited to ___ range.","o":["5 m/s or more; 40 NM","10 m/s; 80 NM","2 m/s; 20 NM","5 m/s; 160 NM"],"e":"Detection is automatically limited regardless of selected range."},{"id":"F11-24","c":"F11","r":"FCOM 11.20","q":"Weather radar colors from heaviest to least rainfall:","o":["Red, amber, green","Magenta, red, amber","Amber, red, green","Red, green, amber"],"e":"Magenta is turbulence."},{"id":"F11-25","c":"F11","r":"FCOM 11.20","q":"MultiScan OverFlight protection operates above:","o":["22,000 ft MSL","10,000 ft","30,000 ft","FL250"],"e":"Keeps storms below the beam on display."},{"id":"F11-26","c":"F11","r":"FCOM 11.20","q":"The PAC Alert (yellow arc) warns of:","o":["Attenuated areas behind heavy rain, within 80 NM of a thunderstorm","Predictive windshear","Radar failure","Ground clutter"],"e":"Operative in CAL gain."},{"id":"F11-27","c":"F11","r":"FCOM 11.30","q":"The dual FMC installation is certified as:","o":["A sole-source navigation system","Supplemental only","Primary only with GPS","VFR only"],"e":"The second FMC is a full backup."},{"id":"F11-28","c":"F11","r":"FCOM 11.30","q":"FMC Source Select in NORMAL: the primary FMC is:","o":["Left FMC by default","Right FMC","Whichever is first powered","Alternates each flight"],"e":"BOTH ON L or BOTH ON R isolates to one FMC."},{"id":"F11-29","c":"F11","r":"FCOM 11.30","q":"When only IRS position is available, the FMC:","o":["Applies a correction learned from IRS error during updating","Uses raw IRS position with no correction","Stops LNAV","Uses the last GPS position"],"e":"Accuracy may be less than required; monitor closely."},{"id":"F11-30","c":"F11","r":"FCOM 11.30","q":"The TCDU touchscreen alphanumeric keypad registers inputs:","o":["Immediately on touch","On release","After a double tap","Only with a stylus"],"e":"Other keys are enter-on-release to reduce turbulence errors."},{"id":"F11-31","c":"F11","r":"FCOM 11.10","q":"TCAS mode TA ONLY:","o":["Displays traffic advisories only, no RAs","Displays RAs only","Disables TCAS","Displays all traffic without alerts"],"e":"TA/RA enables both."},{"id":"F12-01","c":"F12","r":"FCOM 12.20","q":"Usable fuel capacity of each main tank (level attitude):","o":["3,869 kg (4,819 L)","4,819 kg","6,490 kg","2,980 kg"],"e":"Center tank 12,990 kg; total about 20,728 kg (density 0.8029 kg/L)."},{"id":"F12-02","c":"F12","r":"FCOM 12.20","q":"Usable fuel capacity of the center tank:","o":["12,990 kg (16,179 L)","8,630 kg","16,179 kg","10,500 kg"],"e":"Total usable is about 20,728 kg."},{"id":"F12-03","c":"F12","r":"FCOM 12.20","q":"Total usable fuel (level attitude):","o":["About 20,728 kg (25,817 L)","About 25,817 kg","About 18,500 kg","About 23,000 kg"],"e":"Based on a fuel density of 0.8029 kg/L."},{"id":"F12-04","c":"F12","r":"FCOM 12.20","q":"Why is center tank fuel used before main tank fuel with all pumps ON?","o":["Center tank pumps produce higher pressure than main tank pumps","Check valves block main tank flow","The crossfeed valve opens automatically","Main pumps run at reduced speed"],"e":"Higher center pump pressure makes the center tank feed first."},{"id":"F12-05","c":"F12","r":"FCOM 12.20","q":"Each center tank pump automatically shuts off when:","o":["Its pressure sensor detects low output pressure, after a short delay","The center tank reads zero","Main tank 1 is half empty","The CONFIG alert appears"],"e":"Selecting the switch OFF then ON resets the auto shutoff logic."},{"id":"F12-06","c":"F12","r":"FCOM 12.10","q":"With center tank pumps ON, continuous illumination of one center LOW PRESSURE light for how long triggers MASTER CAUTION and FUEL?","o":["10 seconds","5 seconds","30 seconds","60 seconds"],"e":"Note: flickering at low quantity in cruise can continue up to 5 minutes before the caution."},{"id":"F12-07","c":"F12","r":"FCOM 12.10","q":"One main tank LOW PRESSURE light illuminated causes:","o":["MASTER CAUTION and FUEL only on MASTER CAUTION recall","Immediate MASTER CAUTION and FUEL","No indication","An EICAS-style message only"],"e":"Two lights in the same tank trigger MASTER CAUTION and FUEL immediately."},{"id":"F12-08","c":"F12","r":"FCOM 12.20","q":"With main tank pump pressure low, how can each engine still get fuel?","o":["Suction feed from its main tank through a line that bypasses the pumps","Gravity crossfeed from the center tank","APU fuel pump","Only with crossfeed open"],"e":"At high altitude, released dissolved air may cause thrust loss or flameout until it depletes."},{"id":"F12-09","c":"F12","r":"FCOM 12.20","q":"The crossfeed valve is powered by:","o":["DC motor from the battery bus","AC motor from transfer bus 1","Fuel pressure","Hot battery bus"],"e":"Continued crossfeed use creates a progressive imbalance."},{"id":"F12-10","c":"F12","r":"FCOM 12.20","q":"The spar fuel shutoff valves are powered from:","o":["Hot battery bus (DC motor)","Battery bus","AC transfer bus","DC bus 2"],"e":"The engine high-pressure shutoff valves are fuel actuated, solenoid controlled, from the battery bus."},{"id":"F12-11","c":"F12","r":"FCOM 12.20","q":"The spar valve and engine HP shutoff valve both close when:","o":["The engine fire switch is pulled or the start lever is placed to CUTOFF","The fuel pumps are switched OFF","Crossfeed is opened","The ENG VALVE CLOSED light is pressed"],"e":"Both valves respond to either input."},{"id":"F12-12","c":"F12","r":"FCOM 12.10","q":"A bright blue ENG VALVE CLOSED or SPAR VALVE CLOSED light means:","o":["Valve in transit, or valve position disagrees with start lever/fire switch","Valve is closed normally","Valve is open","Fuel filter bypass"],"e":"Dim = closed; extinguished = open."},{"id":"F12-13","c":"F12","r":"FCOM 12.10","q":"A dim blue crossfeed VALVE OPEN light means:","o":["Crossfeed valve is open","Valve is in transit","Valve disagrees with selector","Crossfeed valve is closed"],"e":"Bright = transit or disagreement; extinguished = closed."},{"id":"F12-14","c":"F12","r":"FCOM 12.10","q":"If both FILTER BYPASS lights illuminate, they remain on:","o":["Until engine shutdown on the ground","Until the filters clear","For 5 minutes","Until crossfeed is opened"],"e":"They indicate impending or actual bypass due to contamination."},{"id":"F12-15","c":"F12","r":"FCOM 12.20","q":"The center tank scavenge jet pump transfers remaining center fuel to main tank 1 when:","o":["Main tank 1 is about half full, with main tank 1 FWD pump ON","Center tank reaches zero","Center pumps are OFF","Only on the ground"],"e":"Once started, scavenge continues for the rest of the flight."},{"id":"F12-16","c":"F12","r":"FCOM 12.10","q":"The FUEL TEMP indicator shows the temperature in:","o":["Main tank No. 1","Main tank No. 2","Center tank","Engine fuel manifold"],"e":"The sensor is in main tank No. 1; the indicator uses AC power."},{"id":"F12-17","c":"F12","r":"FCOM 12.10","q":"Fuel LOW alert is displayed when a main tank is below:","o":["907 kg","453 kg","1,134 kg","726 kg"],"e":"It remains until quantity is increased to 1,134 kg."},{"id":"F12-18","c":"F12","r":"FCOM 12.10","q":"Fuel IMBAL alert appears when main tanks differ by more than:","o":["453 kg","91 kg","726 kg","907 kg"],"e":"It stays until imbalance is reduced to 91 kg; inhibited by a LOW alert."},{"id":"F12-19","c":"F12","r":"FCOM 12.10","q":"Fuel CONFIG alert conditions:","o":["Either engine running, center tank more than 726 kg, both center pumps OFF","Both engines running, center tank more than 453 kg","Center tank more than 907 kg with one pump OFF","Main tank imbalance with center pumps ON"],"e":"It clears below 363 kg in the center, one center pump ON, or both engines stopped."},{"id":"F12-20","c":"F12","r":"FCOM 12.10","q":"INSUFFICIENT FUEL alert means FMC destination fuel is predicted to be less than:","o":["900 kg","Entered reserves","1,134 kg","2,000 kg"],"e":"USING RSV FUEL = predicted below entered RESERVES."},{"id":"F12-21","c":"F12","r":"FCOM 12.10","q":"The FUEL FLOW alert appears when actual vs. FMCS expected fuel flow exceeds the threshold for:","o":["Five continuous minutes","One minute","30 seconds","Ten minutes"],"e":"It is displayed independently for each engine."},{"id":"F12-22","c":"F12","r":"FCOM 12.20","q":"Accuracy of each tank fuel quantity indication:","o":["Up to 2.5% higher or lower","Exact","Up to 5%","Up to 1%"],"e":"Due to system tolerances."},{"id":"F12-23","c":"F12","r":"FCOM 12.20","q":"When AC fuel pumps are operating, the APU is fed from:","o":["The left side of the fuel manifold","The right main tank","The center tank directly","A dedicated APU pump in tank 2"],"e":"Without AC pumps, APU fuel is suction fed from main tank 1."},{"id":"F12-24","c":"F12","r":"FCOM 12.20","q":"The single-point pressure fueling station is in the:","o":["Right wing","Left wing","Nose gear well","Aft fuselage"],"e":"The manual defueling valve is outboard of engine No. 2."},{"id":"F12-25","c":"F12","r":"FCOM 12.20","q":"The Nitrogen Generation System (NGS) delivers nitrogen-enriched air to:","o":["The center fuel tank","All three tanks","Main tanks only","The cargo compartments"],"e":"It reduces flammability; no crew action or flight deck indication."},{"id":"F12-26","c":"F12","r":"FCOM 12.20","q":"NGS automatically shuts down for all of the following EXCEPT:","o":["Wing anti-ice ON","Either engine not running in flight","Cargo fire or smoke detection","Left pack overheat"],"e":"Also shuts down on the ground (not in test) and with the center tank refuel valve open."},{"id":"F12-27","c":"F12","r":"FCOM 12.20","q":"Where is the NGS operability indicator located?","o":["Main wheel well, next to the APU fire control panel","Forward overhead panel","Aft overhead panel","Right wing fueling panel"],"e":"Green OPERATIONAL, blue DEGRADED, amber INOPERATIVE (no lights also = inoperative)."},{"id":"F12-28","c":"F12","r":"FCOM 12.20","q":"Each fuel pump is cooled and lubricated by:","o":["The fuel passing through it","Hydraulic fluid","Ram air","Its own oil system"],"e":"All pumps are AC powered."},{"id":"F13-01","c":"F13","r":"FCOM 13.20","q":"How many hydraulic systems does the 737 MAX have?","o":["Three: A, B and standby","Two: A and B","Four: A, B, C and standby","Three: left, right and center"],"e":"Standby backs up A and/or B."},{"id":"F13-02","c":"F13","r":"FCOM 13.20","q":"Can either system A or B alone power all flight controls?","o":["Yes, with no decrease in controllability","No, both are required for the rudder","Only with the standby system","Only below 250 kt"],"e":"Either system can power all flight controls."},{"id":"F13-03","c":"F13","r":"FCOM 13.20","q":"Systems A and B reservoirs are pressurized by:","o":["Bleed air","Nitrogen","The PTU","Electric pumps"],"e":"The standby reservoir is connected to system B's reservoir for pressurization and servicing."},{"id":"F13-04","c":"F13","r":"FCOM 13.20","q":"System A engine-driven pump is driven by:","o":["Engine No. 1","Engine No. 2","The APU","Either engine through the PTU"],"e":"System B EDP is on engine No. 2."},{"id":"F13-05","c":"F13","r":"FCOM 13.20","q":"Which electric pump belongs to system A?","o":["ELEC 2","ELEC 1","STBY","ELEC A"],"e":"Panel order: ENG 1 / ELEC 2 (system A), ELEC 1 / ENG 2 (system B)."},{"id":"F13-06","c":"F13","r":"FCOM 13.20","q":"An engine-driven pump supplies approximately how much fluid volume compared to an electric pump?","o":["About 6 times","About 2 times","About the same","About 10 times"],"e":"This is why the PTU and gear transfer valve exist."},{"id":"F13-07","c":"F13","r":"FCOM 13.10","q":"ENGINE HYDRAULIC PUMPS switch OFF:","o":["Energizes a blocking valve to block pump output; the pump keeps turning","Stops the pump from rotating","Depressurizes the reservoir","Closes the fire shutoff valve"],"e":"Switches should stay ON at shutdown to prolong solenoid life."},{"id":"F13-08","c":"F13","r":"FCOM 13.20","q":"Hydraulic pump cooling fluid passes through heat exchangers located in:","o":["Main fuel tanks No. 1 (A) and No. 2 (B)","The center tank","Ram air ducts","The main wheel well"],"e":"Hence a minimum fuel requirement for ground operation of electric pumps."},{"id":"F13-09","c":"F13","r":"FCOM 13.20","q":"Minimum fuel in the related main tank for ground operation of electric hydraulic pumps:","o":["760 kg","453 kg","907 kg","1,000 kg"],"e":"The heat exchanger must be covered by fuel."},{"id":"F13-10","c":"F13","r":"FCOM 13.10","q":"Normal and maximum hydraulic system pressure:","o":["3,000 psi normal, 3,500 psi maximum","2,800 psi normal, 3,000 psi maximum","3,000 psi normal, 3,200 psi maximum","2,500 psi normal, 3,500 psi maximum"],"e":"With both pumps OFF the reading may show reservoir pressure (normally under 100 psi)."},{"id":"F13-11","c":"F13","r":"FCOM 13.10","q":"The white RF (refill) indication appears when hydraulic quantity is below:","o":["76%","50%","88%","20%"],"e":"Valid only on the ground with engines shut down, or after landing with flaps up during taxi-in."},{"id":"F13-12","c":"F13","r":"FCOM 13.20","q":"System A leak in the engine-driven pump or its lines: what remains?","o":["Standpipe retains fluid (about 20% on MDS); the electric pump maintains pressure","Total loss of system A","Standby system takes over automatically","PTU supplies system A"],"e":"A leak in the electric pump side or common components drains the reservoir to zero."},{"id":"F13-13","c":"F13","r":"FCOM 13.20","q":"After a system B leak, the fluid remaining at the top of the standpipe is sufficient for:","o":["PTU operation","The electric pump","Landing gear retraction","Normal brakes"],"e":"System B quantity goes to about zero and pressure is lost; standby is unaffected."},{"id":"F13-14","c":"F13","r":"FCOM 13.20","q":"The PTU uses system A pressure to:","o":["Power a motor-driven pump that pressurizes system B fluid for autoslats and LE devices","Back up the system A EDP","Raise the landing gear","Pressurize the standby reservoir"],"e":"It supplies volume when the system B EDP is inoperative."},{"id":"F13-15","c":"F13","r":"FCOM 13.20","q":"The PTU operates automatically when:","o":["System B EDP pressure is low, airborne, and flaps not up","System A pressure is low on the ground","Gear lever is UP and engine 1 RPM low","Either engine fails"],"e":"All three conditions must exist."},{"id":"F13-16","c":"F13","r":"FCOM 13.20","q":"The landing gear transfer valve allows system B to raise the gear when:","o":["Engine No. 1 RPM drops below a limit, gear lever UP, and a main gear not up and locked","System B EDP fails","Standby pump is ON","Both engines are running"],"e":"It replaces lost system A EDP volume for normal retraction rate."},{"id":"F13-17","c":"F13","r":"FCOM 13.20","q":"The standby hydraulic system powers:","o":["Thrust reversers, rudder, LE flaps/slats (extend only) and standby yaw damper","Ailerons, elevators and rudder","Landing gear and brakes","Spoilers and trailing edge flaps"],"e":"It uses a single electric motor-driven pump."},{"id":"F13-18","c":"F13","r":"FCOM 13.20","q":"Leading edge devices powered by the standby system can:","o":["Extend only","Extend and retract","Retract only","Not be moved"],"e":"Standby system supplies LE flaps and slats for extension only."},{"id":"F13-19","c":"F13","r":"FCOM 13.20","q":"Selecting a FLT CONTROL switch to STBY RUD does all of the following EXCEPT:","o":["Powers the ailerons from the standby system","Activates the standby pump","Closes that system's flight control shutoff valve","Opens the standby rudder shutoff valve"],"e":"Standby powers the rudder (and reversers) only; ailerons and elevators stay on the other system."},{"id":"F13-20","c":"F13","r":"FCOM 13.20","q":"Automatic standby operation requires loss of system A or B and:","o":["Airborne or wheel speed above 60 kt, with FLT CONTROL A or B ON","Flaps extended","Both engines running","Gear down"],"e":"Also activated if the main PCU Force Fight Monitor trips."},{"id":"F13-21","c":"F13","r":"FCOM 13.10","q":"The STBY RUD ON light indicates:","o":["The standby pump is commanded on to pressurize the standby rudder PCU","Standby system pressure is low","Standby reservoir is low","Rudder trim is inoperative"],"e":"Also illuminates MASTER CAUTION and FLT CONT."},{"id":"F13-22","c":"F13","r":"FCOM 13.10","q":"The STANDBY HYD LOW QUANTITY light is:","o":["Always armed","Armed only when the standby pump is commanded","Armed only in flight","Armed only with ALTERNATE FLAPS ARM"],"e":"LOW PRESSURE is armed only when standby operation is selected or automatic."},{"id":"F13-23","c":"F13","r":"FCOM 13.20","q":"With a standby system leak, system B quantity indication:","o":["Decreases and stabilizes at about 70%","Goes to zero","Is unaffected","Increases"],"e":"The standby LOW QUANTITY light comes on when the standby reservoir is about half empty."},{"id":"F13-24","c":"F13","r":"FCOM 13.10","q":"ALTERNATE FLAPS master switch to ARM:","o":["Closes the TE flap bypass valve, activates the standby pump, arms the position switch","Opens the PTU","Powers TE flaps from system A","Selects STBY RUD"],"e":"Standby can then drive the LE devices; TE flaps move electrically."},{"id":"F13-25","c":"F13","r":"FCOM 13.20","q":"Which system powers the normal brakes?","o":["System B","System A","Standby","Both A and B together"],"e":"System A powers the alternate brakes."},{"id":"F13-26","c":"F13","r":"FCOM 13.20","q":"Which system powers normal nose wheel steering?","o":["System A","System B","Standby","System B via PTU"],"e":"System B provides alternate nose wheel steering."},{"id":"F13-27","c":"F13","r":"FCOM 13.20","q":"Ground spoilers are powered by:","o":["System A","System B","Standby","Both A and B"],"e":"Flight spoilers: A powers 2,4,9,11; B powers 3,5,8,10."},{"id":"F13-28","c":"F13","r":"FCOM 13.20","q":"Leading edge flaps/slats and trailing edge flaps are normally powered by:","o":["System B","System A","Standby","Both A and B"],"e":"System B also powers autopilot B and the No. 2 thrust reverser."},{"id":"F13-29","c":"F13","r":"FCOM 13.20","q":"Hydraulic foaming at high altitude is recognized by:","o":["Pressure fluctuations and blinking LOW PRESSURE lights","Steady low quantity","OVERHEAT lights","RF indication"],"e":"MASTER CAUTION and HYD may flash momentarily."},{"id":"F13-30","c":"F13","r":"FCOM 13.10","q":"Pulling an engine fire switch affects the hydraulic system by:","o":["Shutting off fluid to that EDP and deactivating its LOW PRESSURE light","Stopping the electric pump","Activating the standby pump","Opening the PTU"],"e":"This prevents feeding fluid to a fire."},{"id":"F14-01","c":"F14","r":"FCOM 14.20","q":"Landing gear retraction, extension and normal nose wheel steering are powered by:","o":["Hydraulic system A","Hydraulic system B","Standby system","System A and B together"],"e":"Manual extension and alternate (system B) steering are backups."},{"id":"F14-02","c":"F14","r":"FCOM 14.10","q":"Red landing gear light with the gear not down and locked illuminates when:","o":["A thrust lever is at about 44° or less and below 800 ft AGL","Gear lever is UP","Flaps are 15 or more","Below 1,000 ft RA"],"e":"Red also shows when gear disagrees with lever position."},{"id":"F14-03","c":"F14","r":"FCOM 14.10","q":"Gear is considered down and locked as long as:","o":["One green light (center or overhead panel) is illuminated for each gear","All six green lights are on","Center panel greens only","No red lights are on"],"e":"The overhead set is a separate redundant circuit."},{"id":"F14-04","c":"F14","r":"FCOM 14.20","q":"How long after all gear are up and locked is hydraulic pressure removed from the gear system?","o":["10 seconds","5 seconds","30 seconds","Immediately"],"e":"Removed by the PSEU."},{"id":"F14-05","c":"F14","r":"FCOM 14.20","q":"During retraction, main wheel rotation is stopped by:","o":["The brakes automatically","Snubbers","Rubber seals","Nothing; they spin down"],"e":"Nose wheels are stopped by snubbers."},{"id":"F14-06","c":"F14","r":"FCOM 14.20","q":"A spinning main tire with loose tread hitting the wheel well fitting causes:","o":["That gear to stop retracting and free-fall back down","Gear to retract with damage","Hydraulic system A to fail","The gear lever to lock"],"e":"It cannot be retracted until the fitting is replaced."},{"id":"F14-07","c":"F14","r":"FCOM 14.10","q":"Manual gear extension handles must be pulled about:","o":["24 inches (61 cm)","12 inches","6 inches","36 inches"],"e":"Order: right main, nose, left main."},{"id":"F14-08","c":"F14","r":"FCOM 14.20","q":"Manual gear extension relies on:","o":["Gravity and air loads after the uplocks release","Standby hydraulics","System B via transfer valve","Electric motor"],"e":"Gear free-falls to down and locked."},{"id":"F14-09","c":"F14","r":"FCOM 14.20","q":"With the manual extension access door open:","o":["Retraction is disabled; normal extension still works if system A is available","Normal extension is disabled","Gear can be retracted","Nose wheel steering is lost"],"e":"Close the door to restore normal retraction."},{"id":"F14-10","c":"F14","r":"FCOM 14.20","q":"Alternate nose wheel steering (system B) requires:","o":["NOSE WHEEL STEER switch ALT, normal system B reservoir quantity, on the ground","Gear lever UP","System A failure only","Standby pump ON"],"e":"A leak downstream of the transfer valve closes it and alternate steering is lost."},{"id":"F14-11","c":"F14","r":"FCOM 14.10","q":"Nose wheel steering tiller turns the nose wheel up to:","o":["78° each side","60° each side","5.9° each side","90° each side"],"e":"Rudder pedals give up to 5.9° each side."},{"id":"F14-12","c":"F14","r":"FCOM 14.20","q":"Rudder pedal nose wheel steering is deactivated when:","o":["The nose gear strut extends","Above 30 kt","Tiller is used","Gear lever is UP"],"e":"Pedal steering is limited compared to the tiller."},{"id":"F14-13","c":"F14","r":"FCOM 14.20","q":"Normal brakes are powered by ___, alternate brakes by ___.","o":["System B; system A","System A; system B","System A; standby","Standby; system B"],"e":"System A automatically takes over if system B is low or fails."},{"id":"F14-14","c":"F14","r":"FCOM 14.20","q":"The brake accumulator is pressurized by:","o":["System B","System A","Standby","Both A and B"],"e":"It allows limited braking or parking brake if both systems are lost."},{"id":"F14-15","c":"F14","r":"FCOM 14.10","q":"Normal brake accumulator pressure range:","o":["2,900–3,600 psi","2,000–3,000 psi","3,000–3,500 psi","1,000–3,000 psi"],"e":"Maximum pressure is 3,600–4,000 psi."},{"id":"F14-16","c":"F14","r":"FCOM 14.20","q":"Antiskid on the alternate brake system works on:","o":["Main wheel pairs rather than individual wheels","Individual wheels","Not available","Inboard wheels only"],"e":"Normal system protects each wheel individually."},{"id":"F14-17","c":"F14","r":"FCOM 14.20","q":"Is antiskid protection available with loss of both hydraulic systems?","o":["Yes","No","Only on the normal system","Only with the parking brake"],"e":"It still provides skid, locked wheel, touchdown and hydroplane protection."},{"id":"F14-18","c":"F14","r":"FCOM 14.20","q":"Autobrake works only when:","o":["The normal brake system is functioning","System A is available","Antiskid is off","Reversers are deployed"],"e":"It uses system B pressure."},{"id":"F14-19","c":"F14","r":"FCOM 14.20","q":"RTO autobrake arming conditions:","o":["Antiskid and autobrake operational, RTO selected, wheel speed below 60 kt, thrust levers idle","Wheel speed above 60 kt","Airborne","Speedbrake armed"],"e":"It can be selected only on the ground."},{"id":"F14-20","c":"F14","r":"FCOM 14.20","q":"RTO max braking is applied when thrust levers are retarded at or above a wheel speed of:","o":["88 kt","60 kt","80 kt","V1"],"e":"Below 88 kt no autobraking; RTO stays armed."},{"id":"F14-21","c":"F14","r":"FCOM 14.20","q":"Landing with RTO still selected:","o":["No autobraking; AUTO BRAKE DISARM illuminates 2 s after touchdown","Max braking applied","Autobrake 3 applied","RTO converts to MAX"],"e":"The selector must be cycled through OFF."},{"id":"F14-22","c":"F14","r":"FCOM 14.20","q":"Landing autobrake settings can be selected after touchdown until groundspeed decreases through:","o":["30 kt","60 kt","80 k ables the gear horn","Bypasses the manual extension door"],"e":"On the ground a lock prevents moving the lever UP."},{"id":"F15-01","c":"F15","r":"FCOM 15.20","q":"Which aural is used for a Vmo/Mmo overspeed?","o":["Clacker","Intermittent horn","Steady horn","Bell"],"e":"It can only be silenced by reducing speed below Vmo/Mmo."},{"id":"F15-02","c":"F15","r":"FCOM 15.20","q":"Takeoff configuration and cabin altitude warnings use:","o":["The same intermittent horn","A steady horn","A clacker","A siren"],"e":"Crew must identify which condition is present."},{"id":"F15-03","c":"F15","r":"FCOM 15.20","q":"The landing gear warning uses:","o":["A steady horn","An intermittent horn","A clacker","A bell"],"e":"Fire uses the bell; A/P disconnect uses a warning tone."},{"id":"F15-04","c":"F15","r":"FCOM 15.20","q":"Blue lights indicate:","o":["Information (power, valve position, status, communications)","Conditions needing timely attention","Immediate action","Fully extended configuration"],"e":"Bright blue can mean a component is in transit."},{"id":"F15-05","c":"F15","r":"FCOM 15.20","q":"A 'simple fault' in a redundant system:","o":["Does not light MASTER CAUTION but is stored and shown on recall","Lights MASTER CAUTION immediately","Is not recorded","Lights the MAINT light only"],"e":"Pushing the annunciator panel recalls it."},{"id":"F15-06","c":"F15","r":"FCOM 15.20","q":"During MASTER CAUTION recall press-to-test, how many system annunciator lights should illuminate?","o":["All twelve","Six","Only those with faults","Ten"],"e":"If one doesn't light, refer to the DDG."},{"id":"F15-07","c":"F15","r":"FCOM 15.20","q":"Takeoff configuration warning activates for all EXCEPT:","o":["Autobrake not set to RTO","Flaps outside 1–25","Speed brake lever not DOWN","Stabilizer trim outside the takeoff range"],"e":"Also LE devices, parking brake, ground spoiler valve open, overwing door not secure."},{"id":"F15-08","c":"F15","r":"FCOM 15.20","q":"Cabin altitude warning activates when ive windshear detection relies on:","o":["Moisture or particulate matter in the windshear","Temperature change","Airspeed fluctuation","GPS groundspeed"],"e":"It does not detect all windshear types."},{"id":"F15-33","c":"F15","r":"FCOM 15.20","q":"The MAINT light (with MASTER CAUTION recall) is enabled:","o":["After GRD start on the first engine start, and for 30 s after landing","Only in cruise","Only on the ground with engines off","During takeoff"],"e":"Indicates designated faults for maintenance."},{"id":"L1-01","c":"L1","r":"FCOM L.10.2","q":"Maximum runway slope:","o":["±2%","±1%","±3%","±1.5%"],"e":"FCOM Limitations."},{"id":"L1-02","c":"L1","r":"FCOM L.10.2","q":"Maximum takeoff and landing tailwind component (AFM):","o":["10 kt","15 kt","5 kt","20 kt"],"e":"Capability was demonstrated up to 15 kt.(# memory limitation)"},{"id":"L1-03","c":"L1","r":"FCOM L.10.2","q":"Company note: 15 kt tailwind for takeoff and landing is approved only for:","o":["Khasab operations","All Oman Air B737s","Muscat only","Never"],"e":"Company limitation is otherwise 10 kt."},{"id":"L1-04","c":"L1","r":"FCOM L.10.2","q":"Maximum operating altitude:","o":["41,000 ft pressure altitude","39,000 ft","42,000 ft","37,000 ft"],"e":"FCOM Limitations."},{"id":"L1-05","c":"L1","r":"FCOM L.10.2","q":"Maximum takeoff and landing altitude:","o":["8,400 ft pressure altitude","10,000 ft","8,000 ft","9,500 ft"],"e":"FCOM Limitations."},{"id":"L1-06","c":"L1","r":"FCOM L.10.2","q":"Ground wind: for crosswinds greater than ___, limit thrust to a normal taxi setting.","o":["43 kt","35 kt","50 kt","58 kt"],"e":"Above 58 kt winds, limit thrust to idle except when setting takeoff thrust on the runway."},{"id":"L1-07","c":"L1","r":"FCOM L.10.2","q":"Except when setting takeoff thrust on the runway, limit thrust to idle for winds greater than:","o":["58 kt","43 kt","50 kt","65 kt"],"e":"FCOM Limitations."},{"id":"L1-08","c":"L1","r":"FCOM L.10.2","q":"Maximum flight operating latitude (general, per MagVa ntial pressure (relief valves):","o":["9.1 psi","8.35 psi","8.75 psi","9.5 psi"],"e":"FCOM Limitations."},{"id":"L2-02","c":"L2","r":"FCOM L.10.4","q":"With one or both engine BLEED switches ON, packs in HIGH are not used for:","o":["Takeoff, approach or landing","Cruise","Taxi","Climb above 10,000 ft"],"e":"Except when fire/smoke NNCs (CARGO FIRE, SMOKE/FUMES REMOVAL) require HIGH."},{"id":"L2-03","c":"L2","r":"FCOM L.10.4","q":"Use of aileron trim with the autopilot engaged:","o":["Prohibited","Allowed in cruise","Allowed below 10,000 ft","Allowed with CWS"],"e":"(# memory limitation)"},{"id":"L2-04","c":"L2","r":"FCOM L.10.4","q":"Do not engage the autopilot for takeoff below:","o":["400 ft AGL","1,000 ft AGL","200 ft AGL","800 ft AGL"],"e":"(# memory limitation)"},{"id":"L2-05","c":"L2","r":"FCOM L.10.4","q":"FAA rules: single channel autopilot on approach must not remain engaged below:","o":["50 ft AGL","100 ft AGL","200 ft AGL","DA"],"e":"(# memory limitation)"},{"id":"L2-06","c":"L2","r":"FCOM L.10.5","q":"Autoland maximum winds (FAA rules): headwind / crosswind / tailwind:","o":["25 / 25 / 15 kt","25 / 20 / 10 kt","30 / 25 / 15 kt","25 / 15 / 10 kt"],"e":"(# memory limitation)"},{"id":"L2-07","c":"L2","r":"FCOM L.10.5","q":"Autoland glideslope angle limits:","o":["2.5° to 3.25°","2.5° to 3.5°","3.0° to 3.5°","2.0° to 3.25°"],"e":"(# memory limitation)"},{"id":"L2-08","c":"L2","r":"FCOM L.10.5","q":"Autoland with both engines operative may be used with flaps:","o":["30 or 40","30 only","15, 30 or 40","40 only"],"e":"With one engine inoperative (FAA rules): flaps 30 only.(# memory limitation)"},{"id":"L2-09","c":"L2","r":"FCOM L.10.5","q":"Autoland with one engine inoperative (FAA rules) is permitted with:","o":["Flaps 30","Flaps 40","Flaps 15","Not permitted"],"e":"(# memory limitation)"},{"id":"L2-10","c":"L2","r":"FCOM L.10.5","q":"Do not use LVL CHG on final approach below:","o":["1,000 ft AFE","500 ft AFE","1,500 ft AFE","2,000 ft AFE"],"e":"Non-AFM.(# memory limitation)"},{"id":"L2-11","c":"L2","r":"FCOM L.10.5","q":"Flights predicated on which HF frequencies are prohibited?","o":["29.489 and 29.490 MHz","21.924 MHz","8.364 MHz","2.182 MHz"],"e":"FCOM Limitations."},{"id":"L2-12","c":"L2","r":"FCOM L.10.5","q":"PM-CPDLC is intended for use:","o":["In cruise and for non-critical messaging","All phases","Takeoff and approach","Ground only"],"e":"FCOM Limitations."},{"id":"L2-13","c":"L2","r":"FCOM L.10.5","q":"For primary ATC communication on the ground, use:","o":["The VHF connected to the top fuselage antenna","VHF-2","VHF-3","HF-1"],"e":"VHF-1 is the upper antenna."},{"id":"L2-14","c":"L2","r":"FCOM L.10.6","q":"Use of flight deck auxiliary power outlets requires:","o":["Operational regulatory approval","Nothing special","Captain's approval only","APU running"],"e":"FCOM Limitations."},{"id":"L3-01","c":"L3","r":"FCOM L.10.6","q":"Assumed temperature reduced thrust takeoff is not permitted with:","o":["Antiskid inoperative","Autobrake inoperative","APU inoperative","One pack inoperative"],"e":"FCOM Limitations."},{"id":"L3-02","c":"L3","r":"FCOM L.10.6","q":"Engine ignition must be ON for all EXCEPT:","o":["Climb in clear air","Takeoff","Landing","Heavy rain or anti-ice operation"],"e":"FCOM Limitations."},{"id":"L3-03","c":"L3","r":"FCOM L.10.6","q":"Intentional selection of reverse thrust in flight:","o":["Prohibited","Allowed below 10,000 ft","Allowed at idle","Allowed for emergency descent"],"e":"(# memory limitation)"},{"id":"L3-04","c":"L3","r":"FCOM L.10.6","q":"After thrust reverser deployment on landing, a go-around:","o":["Must not be attempted","May be attempted if reversers stow","Is allowed above 80 kt","Is allowed with TO/GA"],"e":"FCOM Limitations."},{"id":"L3-05","c":"L3","r":"FCOM L.10.6","q":"Backing the airplane with reverse thrust:","o":["Prohibited","Allowed with ground marshaller","Allowed at idle reverse","Allowed on dry runways"],"e":"FCOM Limitations."},{"id":"L3-06","c":"L3","r":"FCOM L.1
