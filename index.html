r stuck due to ice on the jackscrew suspected:","o":["Descend to a warmer temperature and try again","Use full electric trim","Land immediately","Use autopilot trim"],"e":"Airplane can be flown and landed with stab trim inoperative."},{"id":"8-38","c":"8","r":"FCTM 8.26","q":"Runaway stabilizer: before disengaging the autopilot:","o":["Hold the control column firmly","Set CUTOUT switches","Retard thrust","Extend flaps"],"e":"Then use column, main electric trim and thrust; if it continues, both STAB TRIM CUTOUT."},{"id":"8-39","c":"8","r":"FCTM 8.27","q":"Before extending the manual trim wheel handles:","o":["Both STAB TRIM cutout switches must be in CUTOUT","Use autopilot trim","Disconnect the A/T","Lower the gear"],"e":"Use main electric trim first to get in trim; manual trim is for small corrections."},{"id":"8-40","c":"8","r":"FCTM 8.27","q":"One unit of stabilizer trim requires about ___ turns of the manual trim wheel:","o":["15","5","30","50"],"e":"Reducing airspeed is the most effective way to lower manual trim forces."},{"id":"8-41","c":"8","r":"FCTM 8.28","q":"STANDBY RUDDER ON light without crew action, most probably from a force fight monitor fault:","o":["Avoid full rudder inputs (three PCU valves power the rudder)","Use full rudder to test","Turn off both hydraulic systems","Land immediately"],"e":"If due to a main PCU jam, no NNC is required."},{"id":"8-42","c":"8","r":"FCTM 8.28","q":"If the pitot ram air inlet is blocked but drain holes are open, airspeed:","o":["Slowly drops to zero","Increases in climb","Freezes at current value","Fluctuates randomly"],"e":"If inlet and drains are both blocked, the trapped pressure reacts unpredictably."},{"id":"8-43","c":"8","r":"FCTM 8.30","q":"Airspeed unreliable memory: flaps extended pitch and thrust:","o":["10° and 80% N1","4° and 75% N1","15° and 85% N1","8° and 70% N1"],"e":"Flaps up: 4° and 75% N1. Biased toward higher airspeed."},{"id":"8-44","c":"8","r":"FCTM 8.30","q":"Airspeed unreliable memory: flaps up pitch and thrust:","o":["4° and 75% N1","10° and 80% N1","2° and 70% N1","6° and 80% N1"],"e":"May give slight climb at light weight/low altitude, slight descent heavy/high."},{"id":"8-45","c":"8","r":"FCTM 8.30","q":"Comparing only two airspeed indicators that agree:","o":["Is not conclusive; both can still be unreliable","Confirms a reliable source","Means the standby is wrong","Ends the checklist"],"e":"Use stick shaker side, airspeed low, PLI side, AOA DISAGREE, ISFD and GS."},{"id":"8-46","c":"8","r":"FCTM 8.31","q":"Using an AOA indicator during pitot/static unreliable airspeed, hold the needle at about:","o":["The 3 o'clock position","12 o'clock","6 o'clock","9 o'clock"],"e":"Approximates a safe maneuver or approach speed for any flap position."},{"id":"8-47","c":"8","r":"FCTM 8.31","q":"Unreliable airspeed at or after V1 on takeoff:","o":["Keep takeoff thrust, rotate toward 15° normal pitch, gear up, keep flaps, climb to acceleration height","Reduce thrust to 80% N1","Retract flaps immediately","Reject the takeoff"],"e":"Then do the Airspeed Unreliable NNC."},{"id":"8-48","c":"8","r":"FCTM 8.32","q":"Unreliable airspeed descent: at 2,000 ft above level-off, reduce rate of descent to:","o":["1,000 fpm","500 fpm","1,500 fpm","300 fpm"],"e":"Touch down about 1,000–1,500 ft beyond the threshold; don't float."},{"id":"8-49","c":"8","r":"FCTM 8.32","q":"If only the standby airspeed indication is reliable, on a go-around:","o":["Do not use TO/GA","Use TO/GA normally","Use TO/GA twice","Engage the A/P"],"e":"Review the go-around pitch table before the approach."},{"id":"8-50","c":"8","r":"FCTM 8.33","q":"With unreliable altitude, ATC transponder altitude:","o":["Is not an independent source and cannot verify barometric altitude","Is the most reliable source","Should replace the altimeters","Is GPS-based"],"e":"GPWS DA/MDA callouts come from the Captain's minimums selector."},{"id":"8-51","c":"8","r":"FCTM 8.33","q":"SPEED TRIM FAIL from erroneous AOA appears only when AOA vane difference is:","o":["5.5° or greater","2°","10°","1°"],"e":"FEEL DIFF PRESS if EFS active for 30 continuous seconds."},{"id":"8-52","c":"8","r":"FCTM 8.34","q":"Primary purpose of fuel balance limits:","o":["Structural life of airframe and landing gear, not controllability","Lateral controllability","Engine fuel supply","CG limits"],"e":"Imbalance alerts relate to trim drag and fuel consumption."},{"id":"8-53","c":"8","r":"FCTM 8.34","q":"Opening the crossfeed immediately after an in-flight engine shutdown:","o":["Is contrary to Boeing procedures and may pump fuel overboard if there is a leak","Is required","Prevents all imbalances","Is a memory item"],"e":"Pump pressure differences mean fuel may come from the lowest tank."},{"id":"8-54","c":"8","r":"FCTM 8.35","q":"The Engine Fuel Leak NNC assumes the leak is located:","o":["Between the front spar and the engine","Inside the center tank","In the crossfeed manifold","At the APU"],"e":"There is no specific fuel leak annunciation."},{"id":"8-55","c":"8","r":"FCTM 8.36","q":"Why is the engine shut down for a confirmed engine fuel leak?","o":["To close the spar valve stopping the leak, and reduce fire risk","To balance fuel","To save fuel only","To reset the FMC"],"e":"Reverse thrust can spread leaking fuel and increase fire risk."},{"id":"8-56","c":"8","r":"FCTM 8.37","q":"Low fuel landing: heavy braking and high reverse should be avoided to:","o":["Prevent uncovering fuel pumps and engine flameout","Protect the brakes","Avoid FOD","Reduce noise"],"e":"Keep clean configuration as long as possible; decelerate smoothly."},{"id":"8-57","c":"8","r":"FCTM 8.37","q":"After manual gear extension, the landing gear:","o":["Cannot be raised","Can be raised with system B","Retracts with alternate flaps","Can be raised by the PTU"],"e":"Alternate LE devices extend but cannot be retracted."},{"id":"8-58","c":"8","r":"FCTM 8.37","q":"With hydraulic system B lost (or A and B), the NNC recommends flaps 15 to:","o":["Improve go-around capability","Reduce landing distance","Allow autoland","Reduce float"],"e":"Do not allow the airplane to float."},{"id":"8-59","c":"8","r":"FCTM 8.38","q":"Manual reversion (A and B inoperative): trim technique:","o":["Trim slightly nose up and hold light forward pressure","Trim nose down","No trim allowed","Use only manual trim"],"e":"Rudder is powered by standby hydraulics; don't overcontrol."},{"id":"8-60","c":"8","r":"FCTM 8.38","q":"Manual reversion, after stopping on the runway:","o":["Do not taxi; accumulator pressure may be depleted","Taxi slowly with differential thrust","Taxi with nose wheel steering","Use reverse to back up"],"e":"Apply steady brake pressure; only accumulator pressure is available."},{"id":"8-61","c":"8","r":"FCTM 8.39","q":"Suspected tire failure on takeoff, no other damage:","o":["Retract gear normally, advise ATC, consider continuing to destination","Leave the gear down","Return immediately","Dump fuel"],"e":"Wheel well design and auto braking protect from a failed tire."},{"id":"8-62","c":"8","r":"FCTM 8.40","q":"Landing with a flat main gear tire:","o":["Maximum reverse thrust, no autobrakes","Autobrakes MAX","Idle reverse only","Hold the nose off"],"e":"Flat nose tire: gentle nose lowering, idle reverse, low autobrake allowed."},{"id":"8-63","c":"8","r":"FCTM 8.40","q":"Foaming the runway for a gear-up landing:","o":["Is not necessary; minimal benefit and ~30 min to replenish foam","Is mandatory","Is recommended","Is required for partial gear"],"e":"Land on all available gear; don't cycle the gear repeatedly."},{"id":"8-64","c":"8","r":"FCTM 8.41","q":"Partial gear landing: speedbrakes should be extended:","o":["Only when stopping distance is critical, after all areas have touched down","Immediately at touchdown","Before touchdown","Never"],"e":"Early extension causes earlier, faster touchdown of unsupported areas."},{"id":"8-65","c":"8","r":"FCTM 8.42","q":"One main gear and nose gear extended: land on:","o":["The side of the runway corresponding to the extended main gear","The center","The opposite side","The longest runway edge"],"e":"Keep wings level as long as possible."},{"id":"8-66","c":"8","r":"FCTM 8.43","q":"Overspeed correction in high altitude cruise:","o":["Leave A/P engaged, avoid idle thrust, deploy partial speedbrakes slowly","Disconnect A/P and pull up","Set idle thrust","Extend flaps"],"e":"Log the maximum airspeed whenever VMO/MMO is exceeded."},{"id":"8-67","c":"8","r":"FCTM 8.43","q":"Crews frequently climbing/descending in windshear may reduce climb/descent speeds by:","o":["5 to 10 kt","20 kt","30 kt","1 to 2 kt"],"e":"Delay speedbrake retraction until VNAV path or altitude capture."},{"id":"8-68","c":"8","r":"FCTM 8.45","q":"The biggest single cause of a landing tail strike:","o":["Unstabilized approach","Holding off in the flare","Crosswind","Late go-around"],"e":"Second most common: extended flare (holding off)."},{"id":"8-69","c":"8","r":"FCTM 8.45","q":"A takeoff tail strike risk factor is:","o":["Mistrimmed stabilizer from erroneous takeoff data","Rolling takeoff","Flaps 25 takeoff","Reduced thrust"],"e":"Also: early rotation, trimming during rotation, excessive rate, rotating into the F/D bar."},{"id":"8-70","c":"8","r":"FCTM 8.47","q":"During a late go-around over the runway, a brief gear touchdown:","o":["Is acceptable","Requires a full stop","Requires reverse thrust","Must be avoided by over-rotating"],"e":"Abrupt rotation to the F/D bar can cause a tail strike."},{"id":"8-71","c":"8","r":"FCTM 8.48","q":"Continued cargo fire warning after suppression activation:","o":["Does not alone indicate an uncontrolled fire","Means the fire is uncontrolled","Requires ditching","Requires a second discharge"],"e":"Increasing smoke may indicate an uncontrolled fire."},{"id":"8-72","c":"8","r":"FCTM 8.48","q":"Wheel well fire above 270 kt / M0.82: reduce speed quickly using:","o":["ALT HOLD with ~250 kt (A/T to SPD mode)","VNAV speed intervention","LVL CHG","Manual thrust only"],"e":"Keep the A/T engaged; observe gear speed limits."},{"id":"8-73","c":"8","r":"FCTM 8.48","q":"Window crack check with a pencil: if the crack does NOT move relative to the pencil point:","o":["The crack is in the inner pane","The crack is in the outer pane","The window is delaminated","No crack exists"],"e":"If uncertain on heated windows 1–3, assume inner pane."},{"id":"8-74","c":"8","r":"FCTM 8.49","q":"Both forward windows delaminated with unsatisfactory vision:","o":["Accomplish an ILS or GLS autoland, if available","Land manually through the side window","Divert to a VFR airport","Open the side window"],"e":"Per FCTM 8.49."},{"id":"8-75","c":"8","r":"FCTM 8.49","q":"An unlatched flight deck window opens during the takeoff roll at high speed:","o":["Continue the takeoff and close it once airborne and under control","Reject the takeoff","Continue and return immediately","Depressurize and continue"],"e":"If it will not close, return to the departure airport."},{"id":"8-76","c":"8","r":"FCTM 8.49","q":"Opening a side window in flight (after depressurizing): a good target speed is:","o":["Maneuver speed for the current flap setting","VMO","250 kt","VREF"],"e":"There is a relatively calm air area over the open window."},{"id":"8-77","c":"8","r":"FCTM 8.50","q":"With elevator control affected, pitch can be controlled with:","o":["Stabilizer trim, bank angle and thrust","Rudder only","Speedbrakes","Flaps only"],"e":"Thrust increase pitches up; thrust decrease pitches down."},{"id":"8-78","c":"8","r":"FCTM 8.51","q":"If maneuver capability is in question, limit bank angle to:","o":["15°","25°","30°","10°"],"e":"All Boeing airplanes can land at any flap position, including flaps up."},{"id":"8-79","c":"8","r":"FCTM 8.51","q":"During flap transition, an increasing rolling moment indicates an asymmetry. Action:","o":["Return the flap handle to the previous position","Continue to the selected position","Select alternate flaps","Retract to UP"],"e":"Do not change flap position if operation is in doubt, unless performance requires it."},{"id":"8-80","c":"8","r":"FCTM 8.52","q":"Unable to establish radio contact with ATC in an emergency:","o":["Squawk 7700 and proceed as circumstances dictate","Squawk 7600 only","Squawk 7500","Hold until contact"],"e":"Declare an emergency and request a discrete frequency if possible."},{"id":"8-81","c":"8","r":"FCTM 8.53","q":"Handling evaluation: stick shaker or buffet before the NNC flap speed means:","o":["Increase to a safe speed and treat it as minimum approach speed for that configuration","Continue to the NNC speed","Extend more flaps","Land immediately"],"e":"Lower gear only if thrust allows; evaluate at a safe altitude."},{"id":"8-82","c":"8","r":"FCTM 8.53","q":"If asymmetric thrust is being used for roll control:","o":["Plan to leave thrust on until touchdown","Reduce to idle at 50 ft","Use reverse before touchdown","Shut down one engine"],"e":"Landing airport: VMC, longest runway, emergency services, familiarity."},{"id":"F01-01","c":"F01","r":"FCOM 1.10","q":"Turning near obstacles: do not attempt a turn away from an obstacle within how far of the wing tip?","o":["15 ft (4.57 m)","23 ft (7.1 m)","10 ft (3 m)","30 ft (9 m)"],"e":"The other limit is 23 ft (7.1 m) of the nose."},{"id":"F01-02","c":"F01","r":"FCOM 1.10","q":"Do not attempt a turn away from an obstacle within how far of the nose?","o":["23 ft (7.1 m)","15 ft (4.57 m)","30 ft (9.1 m)","10 ft (3 m)"],"e":"Wing tip clearance limit is 15 ft (4.57 m)."},{"id":"F01-03","c":"F01","r":"FCOM 1.30","q":"Master LIGHTS TEST switch in TEST also causes:","o":["A master caution recall; stored faults keep their lights on after release","All annunciators to reset","A fire warning test","The GPWS self-test"],"e":"Any stored fault remains illuminated when the switch is released."},{"id":"F01-04","c":"F01","r":"FCOM 1.30","q":"TAXI light switch in AUTO: the wing strakelet taxi lights illuminate when:","o":["The nose gear is fully extended","The airplane is on the ground","Thrust levers are advanced","The landing lights are ON"],"e":"They extinguish when the nose gear retracts."},{"id":"F01-05","c":"F01","r":"FCOM 1.40","q":"When both landing and taxi lights are ON:","o":["The taxi function is overridden by the landing light function","Both functions operate together","Taxi lights take priority","Landing lights go to half brightness"],"e":"All three functions come from the LED units in the wing strakelets."},{"id":"F01-06","c":"F01","r":"FCOM 1.40","q":"Where are the landing, taxi and runway turnoff lights located?","o":["Wing root strakelets","Nose gear strut","Wing leading edge outboard","Under the fuselage"],"e":"LED units in each wing root strakelet."},{"id":"F01-07","c":"F01","r":"FCOM 1.30","q":"POSITION switch in STROBE & STEADY illuminates:","o":["Position lights, winglet aft markers, tailcone lights and the white anti-collision strobes","Only the red beacons","Only wingtip position lights","Logo and wing lights"],"e":"STEADY gives position lights only, without the white strobes."},{"id":"F01-08","c":"F01","r":"FCOM 1.40","q":"The red anti-collision (beacon) lights are located:","o":["On the top and bottom of the fuselage","On each winglet","On the tailcone","On the vertical fin"],"e":"White strobes are on the tailcone sides and the bottom of each winglet."},{"id":"F01-09","c":"F01","r":"FCOM 1.30","q":"EMER EXIT LIGHTS switch in ARMED: emergency lights illuminate automatically if:","o":["DC bus No. 1 fails or AC power is turned off","Cabin altitude exceeds 10,000 ft","Either engine fails","Battery switch is turned OFF"],"e":"ARMED is the guarded position."},{"id":"F01-10","c":"F01","r":"FCOM 1.30","q":"The amber NOT ARMED light means:","o":["The EMER EXIT LIGHTS switch is not in ARMED","Emergency lights have failed","The battery is low","The aft attendant switch is ON"],"e":"It illuminates in OFF or ON."},{"id":"F01-11","c":"F01","r":"FCOM 1.40","q":"The aft attendant panel emergency lights switch:","o":["Overrides flight deck control and illuminates all emergency lights","Only tests the lights","Works only if the flight deck switch is ON","Arms the slides"],"e":"It is available if automatic control fails."},{"id":"F01-12","c":"F01","r":"FCOM 1.40","q":"FASTEN BELTS signs in AUTO illuminate when:","o":["Flaps or gear are extended","Gear only is extended","Below 10,000 ft","Cabin altitude above 10,000 ft"],"e":"They extinguish when both flaps and gear are retracted."},{"id":"F01-13","c":"F01","r":"FCOM 1.40","q":"NO ELECTRONIC DEVICES signs in AUTO illuminate when:","o":["Gear is extended","Flaps are extended","Flaps or gear extended","On the ground only"],"e":"They extinguish when gear is retracted."},{"id":"F01-14","c":"F01","r":"FCOM 1.30","q":"ELT switch ARM (guarded): the ELT transmits automatically when:","o":["It reaches its preset g-force","Cabin altitude exceeds 14,000 ft","Both engines fail","Battery power is lost"],"e":"ON activates it manually."},{"id":"F01-15","c":"F01","r":"FCOM 1.30","q":"How is the ELT reset?","o":["From ARM, move to ON for about 1 second, then back to ARM","Hold RESET for 5 seconds","Cycle the battery switch","Move to OFF then ARM"],"e":"This is the FCOM reset procedure."},{"id":"F01-16","c":"F01","r":"FCOM 1.40","q":"Flight crew oxygen system pressure may be as high as:","o":["1,850 psi","1,800 psi","2,000 psi","1,500 psi"],"e":"It is shown on the aft overhead panel with the battery switch ON."},{"id":"F01-17","c":"F01","r":"FCOM 1.40","q":"Crew oxygen regulator NORMAL setting provides:","o":["An air/oxygen mixture on demand","100% oxygen on demand","100% oxygen under positive pressure","Continuous flow"],"e":"100% = pure oxygen on demand; EMER = 100% at positive pressure."},{"id":"F01-18","c":"F01","r":"FCOM 1.40","q":"Crew oxygen EMERGENCY setting provides:","o":["100% oxygen at slight positive pressure to keep smoke/fumes out","100% oxygen on demand","Air/oxygen mix","Continuous flow at 4 L/min"],"e":"It depletes oxygen faster and may make communication harder."},{"id":"F01-19","c":"F01","r":"FCOM 1.40","q":"When stowing the crew oxygen mask, the regulator should be set to:","o":["100%","NORMAL","EMER","OFF"],"e":"Then press TEST AND RESET; the OXY ON flag should disappear."},{"id":"F01-20","c":"F01","r":"FCOM 1.40","q":"Portable PBE (smoke hood) provides oxygen for approximately:","o":["15 to over 20 minutes","5 minutes","45 minutes","2 hours"],"e":"Depends on the device used."},{"id":"F01-21","c":"F01","r":"FCOM 1.40","q":"Passenger oxygen deploys automatically at a cabin altitude of:","o":["14,000 ft","10,000 ft","12,000 ft","15,800 ft"],"e":"It can also be activated with the PASS OXYGEN switch ON."},{"id":"F01-22","c":"F01","r":"FCOM 1.40","q":"Once activated, passenger chemical oxygen flows for approximately:","o":["22 minutes and cannot be shut off","12 minutes","15 minutes, can be stopped by restowing","30 minutes"],"e":"Pulling one mask down starts the flow to all masks in that unit."},{"id":"F01-23","c":"F01","r":"FCOM 1.40","q":"How many masks per PSU oxygen source?","o":["Four","Two","Three","Six"],"e":"Attendant stations and lavatories have sources with two masks."},{"id":"F01-24","c":"F01","r":"FCOM 1.40","q":"Why should passenger oxygen not be used below 14,000 ft cabin with smoke present?","o":["Masks deliver a mix of oxygen and cabin air, so they do not prevent smoke inhalation","It may cause a fire","It is not available below 14,000 ft","It depletes crew oxygen"],"e":"The FCOM warns against it."},{"id":"F01-25","c":"F01","r":"FCOM 1.40","q":"First aid portable oxygen cylinder outlets provide:","o":["2 L/min (walk-around) and 4 L/min (first aid)","4 and 8 L/min","1 and 2 L/min","Only 4 L/min"],"e":"Cylinders are at 1,800 psi, about 311 L capacity."},{"id":"F01-26","c":"F01","r":"FCOM 1.40","q":"Water fire extinguishers should NOT be used on:","o":["Electrical or grease fires","Paper fires","Fabric fires","Wood fires"],"e":"They contain water with antifreeze, pressurized by a CO2 cartridge."},{"id":"F01-27","c":"F01","r":"FCOM 1.40","q":"Halon (BCF) extinguishers are primarily effective on:","o":["Electrical, fuel and grease fires","Paper and wood only","Metal fires","Only class A fires"],"e":"Effective on all types, but mainly B and C (E in Europe)."},{"id":"F01-28","c":"F01","r":"FCOM 1.40","q":"If a Halon extinguisher is used in the flight deck, crew should:","o":["Wear oxygen masks on 100%","Open the No. 2 windows","Turn the packs OFF","Depressurize"],"e":"Agent and by-products are toxic."},{"id":"F01-29","c":"F01","r":"FCOM 1.40","q":"Do not operate entry or service doors with winds at the door above:","o":["40 knots","65 knots","30 knots","50 knots"],"e":"Don't keep them open with gusts above 65 knots."},{"id":"F01-30","c":"F01","r":"FCOM 1.40","q":"Do not keep entry or service doors open when wind gusts exceed:","o":["65 knots","40 knots","50 knots","75 knots"],"e":"Strong wind can damage the airplane structure."},{"id":"F01-31","c":"F01","r":"FCOM 1.40","q":"The flight deck door, when electrical power is removed:","o":["Unlocks","Locks","Stays in last position","Locks only in flight"],"e":"It locks when power is available."},{"id":"F01-32","c":"F01","r":"FCOM 1.40","q":"Rotating BOTH flight deck door deadbolt levers to horizontal:","o":["Prevents the cabin-side key from unlocking the door","Unlocks the door","Disables the keypad","Opens the decompression panels"],"e":"Locking only the forward lever still lets the key work."},{"id":"F01-33","c":"F01","r":"FCOM 1.30","q":"FLT DK DOOR lock selector in DENY:","o":["Rejects the keypad request and prevents further code entry for several minutes","Unlocks the door","Locks the door permanently","Silences the chime"],"e":"It must not be pushed in to rotate to DENY."},{"id":"F01-34","c":"F01","r":"FCOM 1.40","q":"If the emergency access code is entered and the crew takes no action:","o":["The door unlocks after the time delay","The door stays locked","The request is denied automatically","Only the chime sounds"],"e":"AUTO UNLK flashes and a continuous chime sounds before it unlocks."},{"id":"F01-35","c":"F01","r":"FCOM 1.30","q":"Amber LOCK FAIL light means:","o":["Door lock failed or the access system switch is OFF","Door is unlocked","Wrong code entered","Door is open"],"e":"Selector must be in AUTO."},{"id":"F01-36","c":"F01","r":"FCOM 1.40","q":"During a flight deck decompression, air vents from the cabin to the flight deck through:","o":["Decompression panels in the flight deck door","The outflow valve","The No. 2 windows","The overboard exhaust valve"],"e":"In a cabin decompression the whole door may open instead."},{"id":"F01-37","c":"F01","r":"FCOM 1.40","q":"Which flight deck window can be opened from outside the airplane?","o":["First Officer's No. 2 window","Captain's No. 2 window","Either No. 2 window","Neither"],"e":"Both No. 2 windows open from inside and can be used for evacuation."},{"id":"F01-38","c":"F01","r":"FCOM 1.40","q":"The lower cargo compartments are certified as:","o":["Class C","Class D","Class B","Class E"],"e":"Designed to contain a fire; sealed and pressurized but without fresh air or temp control."},{"id":"F01-39","c":"F01","r":"FCOM 1.40","q":"Cargo doors are:","o":["Plug type, inward opening, hinged at the top, on the lower right side","Outward opening, on the left side","Electrically operated","Hinged at the bottom"],"e":"They are operated manually from inside or outside."},{"id":"F01-40","c":"F01","r":"FCOM 1.40","q":"Emergency evacuation exits available to passengers:","o":["Four entry/service doors and four overwing hatches","Four doors and two overwing hatches","Two doors and four hatches","Six doors"],"e":"The flight crew can also use the two No. 2 windows."},{"id":"F01-41","c":"F01","r":"FCOM 1.30","q":"PASS OXYGEN light (amber) illuminates when:","o":["The passenger oxygen system is operating and masks have deployed","Passenger oxygen pressure is low","Switch is in NORMAL","Crew oxygen is ON"],"e":"OVERHEAD also illuminates on the master caution system."},{"id":"F01-42","c":"F01","r":"FCOM 1.40","q":"On loss of normal electrical power, standby power is supplied to all EXCEPT:","o":["Landing lights","Standby compass light","Dome lights","Instrument flood lights"],"e":"Selected warning lights also stay powered."},{"id":"F02-01","c":"F02","r":"FCOM 2.10","q":"With the ISOLATION VALVE switch in AUTO, when does the isolation valve open automatically?","o":["If either engine BLEED switch or either PACK switch is OFF","Whenever the APU BLEED switch is ON","Only when both PACK switches are in HIGH","Only on the ground with engines running"],"e":"In AUTO the valve stays closed with both engine bleeds ON and both packs AUTO/HIGH; selecting any engine bleed or pack OFF opens it. The APU bleed switch has no effect on it."},{"id":"F02-02","c":"F02","r":"FCOM 2.10","q":"The DUAL BLEED light (amber) indicates:","o":["APU bleed valve open while an engine bleed configuration could backpressure the APU","Both engine bleed valves have failed closed","Bleed duct pressure is too high on both sides","Both packs are operating from a single engine"],"e":"It comes on when the APU bleed valve is open together with engine 1 BLEED ON, or engine 2 BLEED ON with the isolation valve open."},{"id":"F02-03","c":"F02","r":"FCOM 2.20","q":"With the DUAL BLEED light illuminated, thrust must be:","o":["Limited to idle","Limited to climb thrust","Set to at least 40% N1","Reduced only if the BLEED light also illuminates"],"e":"The engines could backpressure the APU, so thrust is kept at idle while the light is on."},{"id":"F02-04","c":"F02","r":"FCOM 2.20","q":"Engine bleed air is taken from which compressor stages?","o":["4th and 10th","5th and 9th","3rd and 11th","Fan and 4th"],"e":"Low pressure air comes from the 4th stage; the high stage (10th) valve modulates open when 4th-stage pressure is insufficient."},{"id":"F02-05","c":"F02","r":"FCOM 2.20","q":"During takeoff, climb and most of cruise, the high stage valve is normally:","o":["Closed, because 4th stage air is adequate","Fully open","Modulating to limit temperature","Open only with wing anti-ice ON"],"e":"Low pressure 4th-stage air is normally sufficient, so the high stage valve stays closed."},{"id":"F02-06","c":"F02","r":"FCOM 2.10","q":"The left WING-BODY OVERHEAT light covers which areas that the right light does not?","o":["Keel beam and the APU bleed duct","Right inboard leading edge","Both engine struts","Aft cargo compartment"],"e":"Left light: left strut, left inboard leading edge, left A/C bay, keel beam and APU bleed duct. Right light: right strut, right inboard leading edge, right A/C bay."},{"id":"F02-07","c":"F02","r":"FCOM 2.10","q":"Pushing the wing-body OVHT TEST switch illuminates:","o":["Both WING-BODY OVERHEAT lights, both MASTER CAUTION lights and the AIR COND annunciator","Both BLEED lights and both PACK lights","Only the left WING-BODY OVERHEAT light","The DUAL BLEED light and MASTER CAUTION"],"e":"The test checks the overheat detector circuits and lights both overheat lights, master caution and AIR COND."},{"id":"F02-08","c":"F02","r":"FCOM 2.20","q":"A BLEED light caused by an incorrect configuration after takeoff illuminates how long after flaps up?","o":["45 seconds","10 seconds","2 minutes","10 minutes"],"e":"Configuration-type BLEED lights come on 45 s after flaps up and go out when either BLEED switch is selected ON."},{"id":"F02-09","c":"F02","r":"FCOM 2.20","q":"How long after flaps up can the airplane be configured with both engine bleeds OFF without the BLEED lights illuminating?","o":["10 minutes","45 seconds","5 minutes","30 minutes"],"e":"After 10 minutes with flaps up the configuration alert is inhibited; the timer resets when flaps are extended."},{"id":"F02-10","c":"F02","r":"FCOM 2.10","q":"Pressing TRIP RESET (with the fault corrected) resets which lights?","o":["BLEED, PACK and ZONE TEMP","BLEED, DUAL BLEED and WING-BODY OVERHEAT","PACK, AUTO FAIL and OFF SCHED DESCENT","ZONE TEMP and EQUIP SMOKE"],"e":"TRIP RESET reopens the related bleed, pack or trim air valve once the fault is cleared."},{"id":"F02-11","c":"F02","r":"FCOM 2.20","q":"The bleed air DUCT PRESSURE indicator is powered by:","o":["AC","DC","Battery bus only","It is pneumatic, not electrical"],"e":"The indicator is AC operated; L/R differences are normal if pressurization is adequate."},{"id":"F02-12","c":"F02","r":"FCOM 2.20","q":"The isolation valve is:","o":["AC operated","DC controlled and pressure operated","Pneumatically operated only","Hydraulically operated"],"e":"The isolation valve is AC operated; engine and APU bleed valves are DC controlled and pressure operated."},{"id":"F02-13","c":"F02","r":"FCOM 2.20","q":"The precooler's cooling air comes from:","o":["The engine fan-air duct, controlled by the FAMV","Ram air inlet doors","The 10th stage compressor","The air cycle machine"],"e":"Fan air, regulated by the Fan Air Modulating Valve (spring-loaded open), cools the hot bleed air."},{"id":"F02-14","c":"F02","r":"FCOM 2.20","q":"The ACAU will automatically disable (close) the engine bleed air valve in all of these cases EXCEPT:","o":["Wing anti-ice switched ON","DUAL BLEED condition","Engine fire switch pulled","Bleed overtemperature or overpressure"],"e":"Reverse flow protection closes the valve for DUAL BLEED, engine not running, fire switch pulled, or BLEED overtemp/overpressure."},{"id":"F02-15","c":"F02","r":"FCOM 2.30","q":"Which systems rely on the bleed air system?","o":["Packs/pressurization, thermal anti-ice, engine start, hydraulic reservoir, water tank and nitrogen generation","Packs, thermal anti-ice and standby hydraulics only","Engine start and packs only","Packs, window heat and probe heat"],"e":"All six are supplied by bleed air."},{"id":"F02-16","c":"F02","r":"FCOM 2.30","q":"The APU can supply bleed air for:","o":["Two packs on the ground, or one pack in flight","One pack on the ground, two in flight","Two packs at all times","Engine start only"],"e":"APU bleed supports two packs on the ground but only one in flight."},{"id":"F02-17","c":"F02","r":"FCOM 2.30","q":"On the ground, how many packs may be operated from one engine?","o":["No more than one","Two, with the isolation valve open","Two, only with APU running","Any number if TRIM AIR is ON"],"e":"In flight one engine can feed two packs, but on the ground do not run more than one pack from one engine."},{"id":"F02-18","c":"F02","r":"FCOM 2.10","q":"PACK switch in AUTO with only one pack operating, in flight with flaps up: the pack regulates to:","o":["High flow","Low flow","No flow until HIGH selected","APU high flow"],"e":"With one pack operating in flight with flaps up, the operating pack goes to high flow automatically."},{"id":"F02-19","c":"F02","r":"FCOM 2.30","q":"Why is automatic transfer to high flow inhibited on the ground or with flaps extended (engine bleeds ON)?","o":["To keep adequate engine power available for single-engine operation","To prevent pack overheat","To protect the APU from backpressure","To limit cabin pressurization rate"],"e":"The inhibit preserves engine performance for single-engine operations."},{"id":"F02-20","c":"F02","r":"FCOM 2.10","q":"RECIRC FAN switches in AUTO, in flight: the RIGHT recirculation fan operates if both packs are operating unless:","o":["Both PACK switches are in HIGH","Either PACK switch is in HIGH","TRIM AIR is OFF","The isolation valve is open"],"e":"Right fan stops only when both packs are HIGH; the left fan stops if either pack is HIGH."},{"id":"F02-21","c":"F02","r":"FCOM 2.10","q":"On the ground with both PACK switches in HIGH, which recirculation fan runs (switches AUTO)?","o":["Right fan only","Left fan only","Both fans","Neither fan"],"e":"On the ground the left fan stops if both packs are HIGH, while the right fan runs even with both in HIGH."},{"id":"F02-22","c":"F02","r":"FCOM 2.30","q":"Conditioned air from which pack flows directly to the flight deck?","o":["Left pack","Right pack","Both packs via the mix manifold only","Whichever pack is in HIGH"],"e":"Left pack air goes upstream of the mix manifold straight to the flight deck; the excess goes to the mix manifold."},{"id":"F02-23","c":"F02","r":"FCOM 2.30","q":"What is the approximate range of the zone temperature selectors?","o":["18°C to 30°C (65°F to 85°F)","10°C to 25°C","15°C to 35°C","20°C to 28°C"],"e":"Selector range is about 65–85°F (18–30°C)."},{"id":"F02-24","c":"F02","r":"FCOM 2.30","q":"If air in a zone supply duct overheats:","o":["ZONE TEMP light illuminates and that zone's trim air modulating valve closes","The pack trips off and PACK light illuminates","The isolation valve opens","The recirculation fans stop"],"e":"The trim air valve can be reopened with TRIP RESET once the duct cools."},{"id":"F02-25","c":"F02","r":"FCOM 2.30","q":"If all temperature selectors are positioned OFF, the packs maintain:","o":["Left pack 24°C (75°F), right pack 18°C (65°F)","Both packs 24°C","Both packs 18°C","Left 18°C, right 24°C"],"e":"This fixed cabin temperature mode is commanded by the IASCs."},{"id":"F02-26","c":"F02","r":"FCOM 2.30","q":"Which IASC provides primary control of the flight deck and forward cabin zones?","o":["Right IASC","Left IASC","Both share equally","The ACAU"],"e":"Right IASC: CONT CAB and FWD CAB. Left IASC: AFT CAB and standby for the flight deck."},{"id":"F02-27","c":"F02","r":"FCOM 2.30","q":"Failure of both IASCs illuminates:","o":["MASTER CAUTION, AIR COND and all three ZONE TEMP lights","Both PACK lights only","AUTO FAIL and ALTN","Both BLEED lights"],"e":"Dual IASC failure: master caution, AIR COND annunciator and all three ZONE TEMP lights."},{"id":"F02-28","c":"F02","r":"FCOM 2.30","q":"Both PACK lights illuminate if both PACK switches are OFF:","o":["45 seconds after flaps up following takeoff","Immediately after liftoff","10 minutes after takeoff","Only when passing 10,000 ft"],"e":"They extinguish when either pack switch is placed to AUTO or HIGH."},{"id":"F02-29","c":"F02","r":"FCOM 2.30","q":"Failure of a primary or standby pack control (not both) is indicated by:","o":["MAINT, MASTER CAUTION and OVERHEAD annunciator after landing","PACK light immediately","AIR COND annunciator in flight","No indication at all"],"e":"A single control failure is a maintenance item shown after landing."},{"id":"F02-30","c":"F02","r":"FCOM 2.30","q":"Deflector doors forward of the ram air inlets are extended to:","o":["Prevent slush ingestion before liftoff and after touchdown","Increase cooling in cruise","Reduce drag during climb","Protect the precooler from ice"],"e":"They are activated electrically by the air-ground safety sensor."},{"id":"F02-31","c":"F02","r":"FCOM 2.30","q":"Selecting the alternate E/E cooling fan after an OFF light restores airflow within about:","o":["5 seconds","30 seconds","1 minute","5 minutes"],"e":"The OFF light extinguishes within approximately 5 seconds of selecting ALTN."},{"id":"F02-32","c":"F02","r":"FCOM 2.30","q":"On the ground, an E/E equipment overtemperature is alerted by:","o":["The crew call horn in the nose wheel well","The EQUIP SMOKE light","A master warning","The cabin altitude horn"],"e":"Ground alerting is via the crew call horn in the nose wheel well."},{"id":"F02-33","c":"F02","r":"FCOM 2.10","q":"The EQUIP SMOKE light extinguishes how long after smoke is no longer detected?","o":["30 seconds","5 seconds","2 minutes","5 minutes"],"e":"Note on the equipment cooling panel: light goes out 30 s after smoke clears."},{"id":"F02-34","c":"F02","r":"FCOM 2.30","q":"During the EQUIP SMOKE NNC (recirc fans OFF, packs HIGH), the smoke control relay automatically:","o":["Turns off the E/E supply and exhaust fans for 5 minutes and opens the overboard exhaust valve to smoke mode","Closes the outflow valve","Turns off both packs","Opens the isolation valve"],"e":"The OFF lights do not illuminate in this case."},{"id":"F02-35","c":"F02","r":"FCOM 2.30","q":"During a forward cargo fire (CARGO FIRE NNC configuration), the E/E EXHAUST fans:","o":["Shut off for the remainder of the flight","Shut off for 5 minutes then restart","Continue running normally","Switch to alternate automatically"],"e":"Supply fans stop for 5 minutes then restart; exhaust fans stay off for the rest of the flight."},{"id":"F02-36","c":"F02","r":"FCOM 2.40","q":"The pressure relief valves limit differential pressure to a maximum of:","o":["9.1 psi","8.35 psi","8.75 psi","7.8 psi"],"e":"Two relief valves limit Δp to 9.1 psi; a negative relief valve prevents outside pressure exceeding cabin pressure."},{"id":"F02-37","c":"F02","r":"FCOM 2.40","q":"At the maximum certified ceiling of 41,000 ft, cabin altitude is normally controlled to:","o":["8,000 ft","10,000 ft","6,000 ft","7,450 ft"],"e":"Cabin is rate-controlled up to 8,000 ft cabin at FL410."},{"id":"F02-38","c":"F02","r":"FCOM 2.40","q":"Differential pressure limit with a selected FLT ALT above 37,000 ft:","o":["8.35 psid","7.80 psid","7.45 psid","9.1 psid"],"e":"≤28,000 ft: 7.45; 28,000–37,000 ft: 7.80; above 37,000 ft: 8.35 psid."},{"id":"F02-39","c":"F02","r":"FCOM 2.40","q":"Differential pressure limit with a selected FLT ALT at or below 28,000 ft:","o":["7.45 psid","7.80 psid","8.35 psid","6.50 psid"],"e":"Lowest schedule band is 7.45 psid."},{"id":"F02-40","c":"F02","r":"FCOM 2.40","q":"Cruise mode activates when the airplane climbs to within:","o":["0.25 psi of the selected FLT ALT","1,000 ft of FLT ALT","0.5 psi of FLT ALT","500 ft of FLT ALT"],"e":"Descent mode similarly starts when the airplane descends 0.25 psi below FLT ALT."},{"id":"F02-41","c":"F02","r":"FCOM 2.10","q":"The OFF SCHED DESCENT light means:","o":["The airplane descended before reaching the planned cruise altitude set in FLT ALT","Cabin rate of descent exceeds the schedule","LAND ALT was not set","The outflow valve failed during descent"],"e":"The controller then programs the cabin to land at takeoff field elevation."},{"id":"F02-42","c":"F02","r":"FCOM 2.20","q":"After OFF SCHED DESCENT, what cancels the automatic return to the original takeoff field elevation?","o":["Changing the FLT ALT indicator","Changing the LAND ALT","Selecting ALTN","Pressing TRIP RESET"],"e":"Resetting FLT ALT loses the automatic abort capability."},{"id":"F02-43","c":"F02","r":"FCOM 2.40","q":"AUTO FAIL illuminates for a high cabin altitude above (controller not responding properly):","o":["15,800 ft","10,000 ft","14,000 ft","12,500 ft"],"e":"Other triggers: DC power loss, controller or outflow valve fault, Δp > 8.75 psi, rate ±2,000 sl ft/min."},{"id":"F02-44","c":"F02","r":"FCOM 2.40","q":"AUTO FAIL triggers include excessive differential pressure greater than:","o":["8.75 psi","9.1 psi","8.35 psi","7.8 psi"],"e":"Δp > 8.75 psi (if the controller is not responding properly)."},{"id":"F02-45","c":"F02","r":"FCOM 2.10","q":"AUTO FAIL illuminated alone (without ALTN) indicates:","o":["Dual controller failure","Single controller failure","Manual mode selected","Loss of AC power"],"e":"AUTO FAIL + ALTN = single failure with auto transfer; AUTO FAIL alone = both controllers failed."},{"id":"F02-46","c":"F02","r":"FCOM 2.40","q":"How are the two auto pressurization controllers used?","o":["They alternate as primary each new flight; the other is immediate backup","Left is always primary, right is backup","Both control the outflow valve together","ALTN is used only on the ground"],"e":"One controller is sequenced as primary for each flight."},{"id":"F02-47","c":"F02","r":"FCOM 2.40","q":"In MAN mode, the outflow valve is driven by:","o":["A separate DC motor powered from DC standby, faster than AUTO","The same AC motor at a slower rate","Pneumatic pressure from the packs","Hydraulic system A"],"e":"Full travel takes up to 20 s, allowing quick depressurization."},{"id":"F02-48","c":"F02","r":"FCOM 2.40","q":"In flight at higher differential pressures, the overboard exhaust valve is normally:","o":["Closed, with exhaust air diffused to the forward cargo lining","Open to dump E/E air","Modulating with the outflow valve","In smoke mode"],"e":"It is driven open if either pack is HIGH and the right recirc fan is off (smoke removal)."},{"id":"F02-49","c":"F02","r":"FCOM 2.10","q":"The cabin altitude warning horn sounds when cabin altitude exceeds:","o":["10,000 ft","8,000 ft","12,000 ft","14,000 ft"],"e":"The ALT HORN CUTOUT switch silences the intermittent horn."},{"id":"F02-50","c":"F02","r":"FCOM 2.10","q":"Flight altitude selector range and increment:","o":["-1,000 to 42,000 ft in 500 ft steps","0 to 41,000 ft in 1,000 ft steps","-1,000 to 41,000 ft in 100 ft steps","0 to 42,000 ft in 500 ft steps"],"e":"LAND ALT selector: -1,000 to 14,000 ft in 50 ft steps."},{"id":"F02-51","c":"F02","r":"FCOM 2.10","q":"Landing altitude selector range and increment:","o":["-1,000 to 14,000 ft in 50 ft steps","0 to 14,000 ft in 100 ft steps","-1,000 to 10,000 ft in 50 ft steps","-1,000 to 14,000 ft in 500 ft steps"],"e":"Set the intended landing field altitude before takeoff."},{"id":"F02-52","c":"F02","r":"FCOM 2.10","q":"FLT ALT shows '88888' or dashes after a DC power interruption, while cabin altitude and rate are normal. Effect?","o":["Automatic pressure control is not affected","The system reverts to MAN mode","AUTO FAIL will illuminate","Pressurization schedule is lost; descend"],"e":"If cabin altitude and rate are normal, automatic control continues."},{"id":"F03-01","c":"F03","r":"FCOM 3.20","q":"Which flight deck windows are electrically heated?","o":["Windows No. 1 and No. 2","Windows No. 1, 2 and 3","Window No. 1 only","Window No. 2 and 3"],"e":"Windows 1 and 2 have a conductive coating; window 3 (two acrylic panes) is not heated."},{"id":"F03-02","c":"F03","r":"FCOM 3.20","q":"The FWD WINDOW HEAT switches control heat to:","o":["Window No. 1","Window No. 2","Windows 1 and 2","Window No. 3"],"e":"FWD = window 1, SIDE = window 2."},{"id":"F03-03","c":"F03","r":"FCOM 3.20","q":"Why are windows 1 and 2 kept at the correct temperature by the controllers?","o":["To ensure maximum strength in case of bird impact","To prevent wiper scratching","To protect the vinyl core from UV","To reduce cockpit noise"],"e":"Heat keeps the panes at the temperature giving best impact strength, plus anti-ice and anti-fog."},{"id":"F03-04","c":"F03","r":"FCOM 3.10","q":"The green window heat ON light is extinguished when:","o":["Switch OFF, overheat, system failure, or the window is at correct temperature","Only when the switch is OFF","Only when an overheat is detected","Whenever the airplane is on the ground"],"e":"The ON light cycles off when the window reaches temperature."},{"id":"F03-05","c":"F03","r":"FCOM 3.10","q":"WINDOW HEAT test switch positions are:","o":["OVHT and PWR TEST","TEST and RESET","OVHT and RESET","PWR TEST and HOT"],"e":"OVHT simulates an overheat; PWR TEST is a confidence test."},{"id":"F03-06","c":"F03","r":"FCOM 3.10","q":"In the INT position, the windshield wipers operate:","o":["Intermittently every seven seconds","Intermittently every three seconds","At low speed continuously","Once per push"],"e":"Positions: PARK, INT (7-second), LOW, HIGH."},{"id":"F03-07","c":"F03","r":"FCOM 3.20","q":"What happens if the windshield wipers are operated on a dry windshield?","o":["The windshield will be scratched","The wiper motor will overheat and trip","Nothing; the rain repellent protects it","The wipers automatically park"],"e":"The FCOM cautions that dry operation scratches the windshield."},{"id":"F03-08","c":"F03","r":"FCOM 3.20","q":"Which of the following is NOT heated?","o":["Static ports","Pitot probes","Alpha vanes","TAT probe"],"e":"Pitot probes, TAT probe and alpha vanes are electrically heated; static ports are not."},{"id":"F03-09","c":"F03","r":"FCOM 3.20","q":"On standby power, which probe is heated?","o":["Only the Captain's pitot probe","Both pitot probes","Captain's pitot and left alpha vane","None"],"e":"Only the Captain's pitot is heated and the CAPT PITOT light will not show a failure."},{"id":"F03-10","c":"F03","r":"FCOM 3.10","q":"PROBE HEAT switches in AUTO supply power to probe heat systems A and B when:","o":["Either engine is running","Both engines are running","The airplane is airborne","OAT is below 10°C"],"e":"AUTO powers both systems when either engine is running."},{"id":"F03-11","c":"F03","r":"FCOM 3.20","q":"Which part of the engine anti-ice is controlled by the crew switches?","o":["Cowl anti-ice (cowl lip)","Core anti-ice","Both cowl and core","Fan blade anti-ice"],"e":"Core anti-ice is automatic via the EEC with no crew input or normal indication."},{"id":"F03-12","c":"F03","r":"FCOM 3.10","q":"The amber ENG ANTI-ICE light indicates:","o":["Cowl TAI inhibited by a system failure, or an engine core anti-ice valve failed closed","Cowl valve in transit","Overpressure downstream of the cowl valve","Switch ON in warm conditions"],"e":"COWL ANTI-ICE light = overpressure; COWL VALVE light = transit/disagree."},{"id":"F03-13","c":"F03","r":"FCOM 3.10","q":"The amber COWL ANTI-ICE light indicates:","o":["Overpressure in the duct downstream of the cowl anti-ice valve","Cowl valve disagrees with switch","Engine core anti-ice failure","Cowl lip overheat"],"e":"Excess pressure between the cowl valve and the cowl lip."},{"id":"F03-14","c":"F03","r":"FCOM 3.10","q":"A steady COWL VALVE light means:","o":["Cowl valve position disagrees with the ENG ANTI-ICE switch","Valve is in transit","Valve is open with switch ON","Duct overpressure"],"e":"Momentary = in transit; steady = disagreement."},{"id":"F03-15","c":"F03","r":"FCOM 3.10","q":"A green TAI indication on the engine display means:","o":["Cowl anti-ice valve is open and the ENG ANTI-ICE switch is ON","Wing anti-ice is ON","Core anti-ice is operating","Ice is detected"],"e":"Amber TAI = valve not in the position commanded by the switch."},{"id":"F03-16","c":"F03","r":"FCOM 3.20","q":"Setting ENG ANTI-ICE ON does all of the following EXCEPT:","o":["Adjust the FMC-displayed VREF","Set stall warning logic for icing","Allow bleed air to the cowl lip","Set engine idle to approach idle"],"e":"Stick shaker and minimum maneuver bars adjust, but FMC VREF is not adjusted."},{"id":"F03-17","c":"F03","r":"FCOM 3.20","q":"With ENG ANTI-ICE OFF, the EEC selects flight idle when flaps are:","o":["Less than 15","15 or greater","Up only","40"],"e":"With switches OFF: flight idle below flaps 15, approach idle at flaps 15 or more."},{"id":"F03-18","c":"F03","r":"FCOM 3.20","q":"Stall warning logic returns to normal when ENG ANTI-ICE is switched OFF provided that:","o":["Wing anti-ice has not been used in flight","The airplane is below 10,000 ft","Flaps are up","TAT is above 10°C"],"e":"Once wing anti-ice is used in flight, icing logic stays set for the rest of the flight."},{"id":"F03-19","c":"F03","r":"FCOM 3.20","q":"The wing anti-ice system protects:","o":["The three inboard leading edge slats","All leading edge slats","Leading edge flaps and inboard slats","Outboard slats only"],"e":"Leading edge flaps and outboard slats are not protected."},{"id":"F03-20","c":"F03","r":"FCOM 3.20","q":"Wing anti-ice control valves are:","o":["AC motor-operated","DC controlled, pressure operated","Pneumatic only","Hydraulically operated"],"e":"Engine cowl valves are electrically controlled/pressure actuated; wing valves are AC motor-operated."},{"id":"F03-21","c":"F03","r":"FCOM 3.20","q":"Is wing anti-ice effective with slats retracted?","o":["Yes, with the slats in any position","No, only with slats extended","Only with slats full extend","Only on the ground"],"e":"The FCOM states it is effective with slats in any position."},{"id":"F03-22","c":"F03","r":"FCOM 3.20","q":"On the ground with WING ANTI-ICE ON, the valves close if:","o":["Either engine's thrust exceeds the takeoff warning setting or a duct overtemperature is sensed","Both engines are above idle","OAT is above 10°C","Parking brake is released"],"e":"They reopen when thrust is reduced on both engines and both sensors are cool."},{"id":"F03-23","c":"F03","r":"FCOM 3.20","q":"The WING ANTI-ICE switch automatically trips OFF:","o":["At lift-off","At thrust reduction altitude","When flaps retract","At 10,000 ft"],"e":"It trips OFF when the air/ground sensor goes to air mode."},{"id":"F03-24","c":"F03","r":"FCOM 3.20","q":"Once WING ANTI-ICE is selected ON in flight, stall warning icing logic:","o":["Remains set for the rest of the flight","Resets when the switch is OFF","Resets on descent below 10,000 ft","Resets after 10 minutes"],"e":"The icing logic stays set regardless of subsequent switch position."},{"id":"F03-25","c":"F03","r":"FCOM 3.20","q":"In flight, wing anti-ice valve operation is affected by duct temperature and thrust logic:","o":["No, that logic is disabled in flight","Yes, both limit valve opening","Only thrust logic applies","Only duct temperature applies"],"e":"Duct temp and thrust logic work on the ground only."},{"id":"F03-26","c":"F03","r":"FCOM 3.20","q":"On the ground with WING ANTI-ICE ON and an engine above the takeoff warning setting, the L/R VALVE lights:","o":["Are inhibited","Illuminate steady","Flash","Illuminate with MASTER CAUTION"],"e":"Valve lights are inhibited in this condition; the switch stays ON."},{"id":"F03-27","c":"F03","r":"FCOM 3.10","q":"WINDSHIELD AIR controls (pulled) supply conditioned air to:","o":["Number 1 windows for defogging","Pilots' feet","Number 2 windows","The overhead diffusers"],"e":"FOOT AIR supplies the leg positions; WINDSHIELD AIR defogs window 1."},{"id":"F04-01","c":"F04","r":"FCOM 4.20","q":"Autopilot engagement in CMD or CWS is inhibited unless:","o":["No force is on the control wheel and both STAB TRIM cutout switches are NORMAL","Both F/Ds are ON","The A/T is armed","The airplane is above 400 ft"],"e":"These are the two pilot-controlled conditions."},{"id":"F04-02","c":"F04","r":"FCOM 4.20","q":"When can both autopilots be engaged at the same time?","o":["Only with APP mode engaged","Any time above 1,500 ft RA","With LNAV and VNAV engaged","Never"],"e":"Dual A/P is for approach, flare, touchdown/rollout or auto go-around."},{"id":"F04-03","c":"F04","r":"FCOM 4.20","q":"With a single A/P engaged, pushing TO/GA disengages the A/P when:","o":["Below 2,000 ft RA, or at/above 2,000 ft RA with flaps not up","Only on the ground","Only above 2,000 ft","Never; TO/GA is ignored"],"e":"Single A/P go-around is not available."},{"id":"F04-04","c":"F04","r":"FCOM 4.20","q":"After stick shaker activation in ALT HOLD, the autopilot disengages after:","o":["One second","Five seconds","Five minutes","Immediately"],"e":"Applies also to VNAV ALT, level VNAV PTH, V/S or VNAV PTH flaps 15+, G/P and single-channel G/S."},{"id":"F04-05","c":"F04","r":"FCOM 4.20","q":"Moving either STAB TRIM cutout switch to CUTOUT:","o":["Disengages the autopilot","Disengages only the A/T","Has no autopilot effect","Switches A/P to CWS"],"e":"It also inhibits engagement."},{"id":"F04-06","c":"F04","r":"FCOM 4.20","q":"Dual channel A/P operation requires:","o":["Two generators powering the buses","APU running","Both FMCs operating","Both EECs in ALTN"],"e":"With an RA inoperative the autopilot disengages two seconds after the failure."},{"id":"F04-07","c":"F04","r":"FCOM 4.20","q":"Loss of the system A engine-driven pump with heavy demand on system A may cause:","o":["A/P A to disengage","A/P B to disengage","A/T disengagement","Loss of both F/Ds"],"e":"A/P A uses system A hydraulics."},{"id":"F04-08","c":"F04","r":"FCOM 4.20","q":"Which mode is flight director only?","o":["Takeoff (TO/GA for takeoff)","Go-around","APP","LVL CHG"],"e":"The A/P cannot be engaged for the takeoff roll."},{"id":"F04-09","c":"F04","r":"FCOM 4.20","q":"On an ILS without autoland, the F/D command bars retract at approximately:","o":["50 ft RA","200 ft RA","100 ft RA","Touchdown"],"e":"The F/D has no flare capability (except bars centering in LAND 3 flare)."},{"id":"F04-10","c":"F04","r":"FCOM 4.20","q":"Normally, which FCC drives the Captain's command bars?","o":["FCC A","FCC B","The master FCC only","Whichever A/P is engaged"],"e":"FCC B drives the First Officer's bars."},{"id":"F04-11","c":"F04","r":"FCOM 4.20","q":"With one or both A/Ps in CMD, the master FCC is:","o":["The FCC of the first A/P engaged in CMD","The FCC of the first F/D turned ON","Always FCC A","Always FCC B"],"e":"With no A/P in CMD, it is the FCC of the first F/D switched ON."},{"id":"F04-12","c":"F04","r":"FCOM 4.20","q":"Both MA lights illuminated indicates:","o":["Independent F/D operation","F/D failure","Dual A/P engaged","A/T disconnect"],"e":"E.g. APP with LOC and G/S captured, or TO/GA below 400 ft RA, with no A/P in CMD."},{"id":"F04-13","c":"F04","r":"FCOM 4.20","q":"SINGLE CH on a dual A/P ILS approach annunciates after LOC capture and extinguishes:","o":["After the pitch monitor confidence test is complete","At 1,500 ft RA","At FLARE engagement","At touchdown"],"e":"On a single A/P approach it stays on for the whole approach."},{"id":"F04-14","c":"F04","r":"FCOM 4.20","q":"LAND 3 means:","o":["Two A/Ps, three inertial sources and associated sensors are operating normally (fail-operational)","Three autopilots engaged","Autoland with one failure","Category 3 minima approved"],"e":"A single fault cannot prevent an automatic landing."},{"id":"F04-15","c":"F04","r":"FCOM 4.20","q":"LAND 2 means:","o":["Fail-passive: a single fault cannot cause a significant flight path deviation","Two A/Ps with full redundancy","Autoland not available","Rollout not available"],"e":"A failure occurred above Alert Height and redundancy is reduced."},{"id":"F04-16","c":"F04","r":"FCOM 4.20","q":"If a single failure occurs below Alert Height and autoland can continue:","o":["LAND 3 stays displayed; failure messages appear below 40 kt after A/P disengagement","LAND 2 replaces LAND 3 immediately","Both A/Ps disengage","NO AUTOLAND is displayed"],"e":"No distracting annunciation during landing."},{"id":"F04-17","c":"F04","r":"FCOM 4.10","q":"A/T mode ARM means:","o":["No A/T mode engaged; pilot can set thrust; minimum speed protection provided","A/T is fully engaged","A/T disconnected","Thrust levers are frozen"],"e":"THR HLD: servos inhibited, pilot can move thrust levers."},{"id":"F04-18","c":"F04","r":"FCOM 4.20","q":"During takeoff with TO/GA, F/D pitch before 60 kt IAS is:","o":["10° nose down","15° nose up","Level","5° nose up"],"e":"At 60 kt it commands 15° nose up."},{"id":"F04-19","c":"F04","r":"FCOM 4.20","q":"During the takeoff roll, the A/T annunciates THR HLD at:","o":["84 kt","60 kt","80 kt","V1"],"e":"It stays in THR HLD until 800 ft above field elevation, then ARM."},{"id":"F04-20","c":"F04","r":"FCOM 4.20","q":"After liftoff with sufficient climb rate (both engines), F/D pitch commands:","o":["MCP speed (normally V2) + 20 kt","V2","V2 + 10 kt","VREF + 20"],"e":"With an engine failure targets depend on speed relative to V2."},{"id":"F04-21","c":"F04","r":"FCOM 4.20","q":"Engine failure after liftoff with airspeed between V2 and V2+20: the F/D target speed is:","o":["Existing speed","V2","V2 + 20","V2 + 15"],"e":"Below V2 → V2; above V2+20 → V2+20."},{"id":"F04-22","c":"F04","r":"FCOM 4.20","q":"TO/GA can be engaged for takeoff with F/D switches OFF if pushed:","o":["After 80 kt, below 2,000 ft AGL and within 150 s of lift-off","Only before 60 kt","At any time below 400 ft","Never"],"e":"The command bars then appear for both pilots."},{"id":"F04-23","c":"F04","r":"FCOM 4.20","q":"Allowable pilot entries for thrust reduction altitude:","o":["800 to 9,999 ft","400 to 3,000 ft","1,000 to 5,000 ft","500 to 10,000 ft"],"e":"Shown on TAKEOFF REF page 2/2."},{"id":"F04-24","c":"F04","r":"FCOM 4.20","q":"How is the takeoff mode terminated below 400 ft AGL?","o":["Turn both F/D switches OFF","Select LVL CHG","Engage the A/P","Push TO/GA again"],"e":"At 400 ft another pitch mode or A/P engagement ends it."},{"id":"F04-25","c":"F04","r":"FCOM 4.20","q":"VNAV armed before takeoff engages automatically at:","o":["400 ft AGL","1,000 ft AGL","800 ft AFE","Thrust reduction altitude"],"e":"VNAV armed shows before takeoff; after takeoff it engages automatically at 400 ft AGL."},{"id":"F04-26","c":"F04","r":"FCOM 4.20","q":"LNAV capture criteria if more than 3 NM from the active route segment:","o":["Intercept course of 90° or less and intercept before the active waypoint","Any heading","Within 30° of track","Must be on heading select"],"e":"Within 3 NM it captures on any heading."},{"id":"F04-27","c":"F04","r":"FCOM 4.20","q":"CWS: if aileron pressure is released with bank of 6° or less, the A/P:","o":["Rolls wings level and holds heading","Holds the bank angle","Disengages","Reverts to HDG SEL"],"e":"Inhibited below 1,500 ft RA gear down, after VOR capture ≤250 kt TAS, or after LOC capture in APP."},{"id":"F04-28","c":"F04","r":"FCOM 4.20","q":"LOC capture occurs no later than:","o":["1/2 dot","1 dot","2/5 dot","1/4 dot"],"e":"G/S captures at 2/5 dot, from above or below."},{"id":"F04-29","c":"F04","r":"FCOM 4.20","q":"G/S capture can occur:","o":["From above or below, and only after LOC capture","Only from below","Before LOC capture","Only with dual A/P"],"e":"G/S capture is inhibited before LOC capture."},{"id":"F04-30","c":"F04","r":"FCOM 4.20","q":"After LOC and G/S capture, APP mode can be exited by:","o":["Disengaging the A/P and turning off both F/Ds, or retuning a VHF NAV receiver","Pushing APP again","Selecting HDG SEL","Selecting LVL CHG"],"e":"Pushing APP no longer deselects once both are captured."},{"id":"F04-31","c":"F04","r":"FCOM 4.20","q":"The second A/P must be engaged in CMD by what height for a dual approach?","o":["800 ft RA","1,500 ft RA","500 ft RA","200 ft RA"],"e":"Otherwise CMD engagement of the second A/P is inhibited."},{"id":"F04-32","c":"F04","r":"FCOM 4.20","q":"If FLARE is not armed by approximately what height, both A/Ps disengage?","o":["350 ft RA","500 ft RA","200 ft RA","100 ft RA"],"e":"Flare arms below 1,500 ft RA after LOC and G/S capture."},{"id":"F04-33","c":"F04","r":"FCOM 4.20","q":"Autoland flare begins at approximately:","o":["50 ft RA","27 ft RA","100 ft RA","30 ft RA"],"e":"The A/T starts retarding at about 27 ft RA to reach idle at touchdown."},{"id":"F04-34","c":"F04","r":"FCOM 4.20","q":"During autoland, the A/T retards at approximately:","o":["27 ft RA","50 ft RA","10 ft RA","2 ft RA"],"e":"RETARD is annunciated; A/T disengages about 2 s after touchdown."},{"id":"F04-35","c":"F04","r":"FCOM 4.20","q":"Runway alignment sideslip during autoland is limited to:","o":["5 degrees","10 degrees","3 degrees","8 degrees"],"e":"In strong crosswind the airplane lands in a slight crab."},{"id":"F04-36","c":"F04","r":"FCOM 4.20","q":"ROLLOUT activates at approximately:","o":["2 ft RA","50 ft RA","Touchdown plus 2 s","10 ft RA"],"e":"The A/P then uses rudder and nose wheel steering to track the localizer."},{"id":"F04-37","c":"F04","r":"FCOM 4.20","q":"A/P go-around is available:","o":["Only with dual A/P, after FLARE armed and before touchdown","With single A/P below 2,000 ft","Any time APP is selected","After touchdown"],"e":"Otherwise a manual F/D go-around is used."},{"id":"F04-38","c":"F04","r":"FCOM 4.20","q":"First TO/GA push below 2,000 ft RA: the A/T advances toward:","o":["Reduced go-around N1 for 1,000 to 2,000 fpm climb","Full go-around N1","Climb N1","Takeoff N1"],"e":"Second push gives full go-around N1."},{"id":"F04-39","c":"F04","r":"FCOM 4.20","q":"A/T go-around mode is armed when descending below 2,000 ft RA, or if both RAs fail, below:","o":["15,500 ft pressure altitude","10,000 ft","2,500 ft pressure altitude","18,000 ft"],"e":"Above 2,000 ft RA a TO/GA push engages N1 (full) instead."},{"id":"F04-40","c":"F04","r":"FCOM 4.20","q":"A/P go-around: if the PITCH mode is changed first above 400 ft RA:","o":["The second A/P disengages and roll goes to CWS R","Both A/Ps stay engaged","Roll stays TO/GA with dual A/P","A/T disconnects"],"e":"Changing roll first keeps pitch in dual TO/GA."},{"id":"F04-41","c":"F04","r":"FCOM 4.20","q":"A/T disengages automatically after landing:","o":["Two seconds after touchdown","At 60 kt","At touchdown","When reversers deploy"],"e":"A/T disengage lights do not illuminate for this automatic disconnect."},{"id":"F04-42","c":"F04","r":"FCOM 4.20","q":"A/T in speed or N1 mode (not GA) disengages if thrust levers separate by more than:","o":["10 degrees","5 degrees","One knob width","15 degrees"],"e":"Also with significant thrust difference plus 10° or more wheel input."},{"id":"F04-43","c":"F04","r":"FCOM 4.20","q":"Alpha floor (A/T speed protection) is active:","o":["Only in non-VNAV modes","Only in VNAV","Only on approach","Only with A/P engaged"],"e":"It advances thrust to reach 5 kt above minimum speed; an 'A' shows in the MCP speed window."},{"id":"F04-44","c":"F04","r":"FCOM 4.20","q":"The A/T Arm switch:","o":["Is magnetically held at ARM and releases to OFF when the A/T disengages","Must be manually turned OFF","Is spring loaded to OFF","Stays at ARM after disconnect"],"e":"A/T disengage lights flash red."},{"id":"F04-45","c":"F04","r":"FCOM 4.20","q":"Engaging LVL CHG or VNAV descent engages the A/T in:","o":["RETARD, then ARM when at idle","FMC SPD","N1","MCP SPD"],"e":"Climb modes engage N1."},{"id":"F04-46","c":"F04","r":"FCOM 4.20","q":"F/D go-around (no A/P): roll holds ground track up to what height, then LNAV engages?","o":["50 ft AGL","400 ft RA","1,000 ft","200 ft"],"e":"For an A/P go-around, track is held to 400 ft RA, then LNAV."},{"id":"F05-01","c":"F05","r":"FCOM 5.20","q":"How many VHF communication radios are installed?","o":["Three","Two","Four","One plus SATCOM"],"e":"Each has an active and a preselected (standby) frequency."},{"id":"F05-02","c":"F05","r":"FCOM 5.20","q":"Which VHF antenna is on the upper fuselage?","o":["VHF-1","VHF-2","VHF-3","None; all are lower"],"e":"Lower antennas (VHF-2 and 3) are more prone to multipath interference from nearby structures or vehicles."},{"id":"F05-03","c":"F05","r":"FCOM 5.10","q":"VHF frequency selection uses what channel spacing for the inner knob?","o":["8.33 kHz","25 kHz","50 kHz","5 kHz"],"e":"The outer knob changes MHz in 1 MHz steps."},{"id":"F05-04","c":"F05","r":"FCOM 5.10","q":"With ACARS, tuning above max or below min frequency on a VHF:","o":["Displays DATA in the frequency indicator","Turns the radio off","Selects 121.5","Causes a failure flag"],"e":"DATA means the radio is in data mode."},{"id":"F05-05","c":"F05","r":"FCOM 5.20","q":"How many HF radios, and how many HF antennas?","o":["Two radios sharing one antenna in the vertical stabilizer","Two radios, two antennas","One radio, one antenna","Two radios, antennas in the wingtips"],"e":"When one HF transmits, the other can't transmit or receive."},{"id":"F05-06","c":"F05","r":"FCOM 5.20","q":"HF sensitivity can be set from:","o":["Only the on-side radio tuning panel","Any radio tuning panel","The ACP only","The FMC"],"e":"Any RTP can tune either HF."},{"id":"F05-07","c":"F05","r":"FCOM 5.20","q":"HF antenna tuning tone normally lasts up to how long; and if tuning fails?","o":["Up to 7 s; failure lasts more than 7 s up to 15 s","Up to 2 s; failure 5 s","Up to 15 s; failure 30 s","Up to 30 s; failure 60 s"],"e":"The last 100 tuned frequencies are stored for faster tuning."},{"id":"F05-08","c":"F05","r":"FCOM 5.10","q":"On the ACP, the I/C position of the PTT switch:","o":["Keys the mic directly on the flight interphone, bypassing the transmitter selector","Transmits on the selected radio","Makes a PA","Calls the flight attendants"],"e":"R/T keys the mic on the radio selected by the transmitter selector."},{"id":"F05-09","c":"F05","r":"FCOM 5.10","q":"ACP V/B/R filter: R position gives:","o":["Station identifier (range/code) audio only","Voice only","Both voice and identifier","Radio altimeter audio"],"e":"V = voice, B = both, R = range (ident)."},{"id":"F05-10","c":"F05","r":"FCOM 5.20","q":"ACP ALT-NORM switch in ALT (degraded mode):","o":["The crewmember can communicate on one radio only; interphones and speaker are not usable","ACP works normally on backup power","All radios are available at preset volume","Only the PA is available"],"e":"Aural warnings are not heard on the affected side in degraded mode."},{"id":"F05-11","c":"F05","r":"FCOM 5.20","q":"In ACP degraded mode, which audio warnings are not heard on that side?","o":["Altitude alert, GPWS and windshear","Fire bell only","TCAS only","None; all are heard"],"e":"They are still heard on the other side if that ACP is in NORM."},{"id":"F05-12","c":"F05","r":"FCOM 5.20","q":"The flight deck speakers are muted during:","o":["Push-to-talk using the boom/hand mic (not oxygen mask mic)","All transmissions","Oxygen mask mic transmissions","Never"],"e":"With the oxygen mask mic the speakers are not muted."},{"id":"F05-13","c":"F05","r":"FCOM 5.20","q":"Which aural alerts cannot be turned down or off at the ACP?","o":["Altitude alert, GPWS, TCAS and predictive windshear","ATC radio audio","VOR identifier","Flight interphone"],"e":"They are heard through speakers and headsets at preset volumes."},{"id":"F05-14","c":"F05","r":"FCOM 5.20","q":"The oxygen mask microphone becomes active when:","o":["Both oxygen mask panel doors are open","The mask is removed from the box","The PTT is set to I/C","The boom mic is unplugged"],"e":"Closing both doors and pressing RESET/TEST re-enables the boom mic."},{"id":"F05-15","c":"F05","r":"FCOM 5.20","q":"Where is the ground crew jack for the flight interphone?","o":["At the external power receptacle","In the main wheel well","At the APU panel","In the E/E bay only"],"e":"The flight interphone is a private flight deck network."},{"id":"F05-16","c":"F05","r":"FCOM 5.10","q":"SERVICE INTERPHONE switch ON:","o":["Adds the external jacks to the service interphone system","Connects the flight deck to the PA","Turns on cabin chimes","Disconnects the flight attendants"],"e":"Flight deck to attendant communication works with the switch OFF."},{"id":"F05-17","c":"F05","r":"FCOM 5.20","q":"Highest priority on the PA system is:","o":["Flight crew PA announcements","Flight attendant handsets","PRAM announcements","Boarding music"],"e":"Flight crew PA preempts all other inputs."},{"id":"F05-18","c":"F05","r":"FCOM 5.20","q":"A PRAM announcement is automatically initiated when:","o":["Fasten seat belt light illuminates or cabin depressurization drops the masks","Gear is retracted","The doors are closed","The engines are started"],"e":"Manual PRAM messages have priority over automatic ones."},{"id":"F05-19","c":"F05","r":"FCOM 5.10","q":"GRD CALL switch:","o":["Sounds a horn in the nose wheel well while pressed","Calls the flight attendants","Sounds a chime in the flight deck","Flashes the taxi light"],"e":"Ground crew can only be called from the flight deck."},{"id":"F05-20","c":"F05","r":"FCOM 5.10","q":"ATTEND call switch from the flight deck:","o":["Sounds a two-tone chime in the cabin and illuminates pink master call lights","Sounds a horn in the nose gear well","Illuminates blue lights","Sounds a single low chime"],"e":"Pink = flight deck or attendant call; blue = passenger seat; amber = lavatory."},{"id":"F05-21","c":"F05","r":"FCOM 5.10","q":"Blue CABIN READY light in the flight deck means:","o":["The flight attendant has signaled the cabin is ready","Cabin doors are armed","PA is in use","Cabin pressure is normal"],"e":"It comes with a single low chime."},{"id":"F05-22","c":"F05","r":"FCOM 5.10","q":"CVR ERASE operates only when:","o":["On the ground with the parking brake set","On the ground with engines running","Any time the switch is held","In flight with the CVR ON"],"e":"All four channels are erased."},{"id":"F05-23","c":"F05","r":"FCOM 5.10","q":"VOICE RECORDER switch in AUTO powers the CVR:","o":["From first engine start until 5 minutes after the last engine shutdown","Only when ON is selected","Continuously with battery ON","Only in flight"],"e":"ON powers it until first engine start, then trips to AUTO."},{"id":"F05-24","c":"F05","r":"FCOM 5.10","q":"CVR TEST: hold for 1 second; the STATUS light illuminates within:","o":["6 seconds","2 seconds","10 seconds","30 seconds"],"e":"Holding TEST more than 2 seconds should be avoided (caution)."},{"id":"F05-25","c":"F05","r":"FCOM 5.20","q":"How many channels does the CVR record?","o":["Four","Two","Three","Six"],"e":"One area mic plus pilots' and observer's ACP audio."},{"id":"F05-26","c":"F05","r":"FCOM 5.20","q":"The RIPS powers the CVR after aircraft power loss for:","o":["10 minutes","2 minutes","30 minutes","90 days"],"e":"The underwater locator beacon battery lasts 90 days."},{"id":"F05-27","c":"F05","r":"FCOM 5.20","q":"Which crew stations have an ACP?","o":["Captain, First Officer and First Observer","Captain and First Officer only","All four seats","Captain only plus a spare"],"e":"The second observer has a headphone jack and hears the first observer's audio."},{"id":"F05-28","c":"F05","r":"FCOM 5.20","q":"A SELCAL call is indicated by:","o":["The CALL light on the ACP and a chime","A master caution","An ND message only","The ATTEND light"],"e":"It resets when the mic is keyed."},{"id":"F06-01","c":"F06","r":"FCOM 6.20","q":"The engine IDGs supply:","o":["Three-phase 115 V AC at 400 Hz","Single-phase 115 V AC at 60 Hz","28 V DC","Three-phase 200 V AC at 400 Hz"],"e":"Each IDG feeds its own bus system and can carry the opposite side if one IDG fails."},{"id":"F06-02","c":"F06","r":"FCOM 6.20","q":"What are the two basic principles of the 737 electrical system?","o":["No paralleling of AC sources; connecting a new source to a transfer bus disconnects the existing one","AC sources are paralleled; the APU has priority","External power always has priority; generators are paralleled","DC buses are never tied; AC buses are always tied"],"e":"These two rules govern every source transfer."},{"id":"F06-03","c":"F06","r":"FCOM 6.20","q":"On the ground, can one transfer bus be powered by external power and the other by the APU?","o":["No, whichever is selected last powers both","Yes, through the BTBs","Yes, only with BUS TRANSFER OFF","Only if the APU GEN is selected first"],"e":"Ground power or APU each power both transfer buses; the last selected wins."},{"id":"F06-04","c":"F06","r":"FCOM 6.20","q":"If the airplane takes off with the APU powering both transfer buses and the APU then fails, the engine generators:","o":["Automatically connect to their transfer buses (once per flight)","Must be connected manually","Remain off until landing","Connect only if BUS TRANSFER is OFF"],"e":"Automatic generator on-line feature, available only once in flight."},{"id":"F06-05","c":"F06","r":"FCOM 6.10","q":"Where is the GROUND SERVICE switch located?","o":["Forward attendant's panel","Forward overhead panel","External power receptacle panel","Aft overhead panel"],"e":"It powers the ground service buses (outlets, cabin lights, battery charger) without powering the transfer buses."},{"id":"F06-06","c":"F06","r":"FCOM 6.20","q":"The ground service switch is overridden when:","o":["Both AC transfer buses are powered","The battery switch is OFF","The APU is running","External power is disconnected"],"e":"Once both transfer buses are powered, the ground service buses are fed normally."},{"id":"F06-07","c":"F06","r":"FCOM 6.20","q":"Single generator operation: which loads are shed FIRST?","o":["Galleys and main bus on transfer bus 2","Galleys and main bus on transfer bus 1","IFE buses","AC standby bus"],"e":"Order: TB2 galleys/main bus, then TB1 galleys/main bus, then IFE buses."},{"id":"F06-08","c":"F06","r":"FCOM 6.20","q":"In flight with the APU as the ONLY electrical source:","o":["All galley and main buses are automatically shed","Only IFE buses are shed","No load shedding occurs","Transfer bus 2 is shed"],"e":"If still overloaded, both IFE buses are shed as well."},{"id":"F06-09","c":"F06","r":"FCOM 6.20","q":"After returning to two-generator operation, how are galley and main bus power restored?","o":["By cycling the CAB/UTIL switch OFF then ON","Automatically, like the IFE buses","Only on the ground by maintenance","By pushing TRIP RESET"],"e":"IFE/PASS restores automatically; galley/main bus need a CAB/UTIL reset."},{"id":"F06-10","c":"F06","r":"FCOM 6.10","q":"The amber DRIVE light indicates IDG low oil pressure, caused by any of the following EXCEPT:","o":["Generator off bus","IDG failure","Automatic disconnect for high oil temperature","Manual disconnect with the DISCONNECT switch"],"e":"GEN OFF BUS is a separate blue light."},{"id":"F06-11","c":"F06","r":"FCOM 6.10","q":"The generator drive DISCONNECT switch works only if:","o":["Electrical power is available and the engine start lever is in IDLE","The engine is shut down","The airplane is on the ground","The GEN switch is OFF"],"e":"Once disconnected, the IDG cannot be reconnected in the air."},{"id":"F06-12","c":"F06","r":"FCOM 6.10","q":"Can a disconnected IDG be reconnected in flight?","o":["No, only on the ground by maintenance","Yes, by recycling the GEN switch","Yes, below 10,000 ft","Yes, with the APU running"],"e":"Reactivation is a ground-only maintenance action."},{"id":"F06-13","c":"F06","r":"FCOM 6.10","q":"The blue GEN OFF BUS light means:","o":["The IDG is not supplying power to its transfer bus","The IDG has failed","Oil pressure is low","The transfer bus is unpowered"],"e":"TRANSFER BUS OFF (amber) indicates the bus itself is unpowered."},{"id":"F06-14","c":"F06","r":"FCOM 6.10","q":"The blue GRD POWER AVAILABLE light means:","o":["Ground power is connected and meets power quality requirements","Ground power is powering the transfer buses","Ground power is connected but out of tolerance","The ground service bus is powered"],"e":"It does not mean the airplane is using ground power."},{"id":"F06-15","c":"F06","r":"FCOM 6.10","q":"BUS TRANSFER switch OFF results in all of the following EXCEPT:","o":["The APU is disconnected from both buses","Transfer bus 1 isolated from transfer bus 2","DC cross tie relay opens","TR3 is inhibited from connecting to transfer bus 1"],"e":"OFF isolates the AC and DC sides and inhibits TR3's backup feed."},{"id":"F06-16","c":"F06","r":"FCOM 6.20","q":"TR3 normally receives AC power from:","o":["Transfer bus 2, with transfer bus 1 as backup","Transfer bus 1 only","The AC standby bus","Ground service bus 2"],"e":"With BUS TRANSFER in AUTO; any two TRs can carry the total load."},{"id":"F06-17","c":"F06","r":"FCOM 6.20","q":"Under normal conditions, which TR powers the battery bus?","o":["TR3","TR1","TR2","The battery charger"],"e":"TR3 powers the battery bus and backs up TR1 and TR2."},{"id":"F06-18","c":"F06","r":"FCOM 6.20","q":"The DC cross bus tie relay opens automatically:","o":["At glide slope capture during an FD or autopilot ILS approach, or with BUS TRANSFER OFF","Whenever an engine is shut down","At 1,500 ft RA on every approach","When the APU starts"],"e":"Isolating DC buses prevents a single failure affecting both nav receivers and FCCs."},{"id":"F06-19","c":"F06","r":"FCOM 6.10","q":"In flight, the amber TR UNIT light illuminates if:","o":["TR1 fails, or TR2 and TR3 both fail","Any single TR fails","TR3 fails","Both TR1 and TR2 fail only"],"e":"On the ground, any TR failure illuminates it."},{"id":"F06-20","c":"F06","r":"FCOM 6.10","q":"The amber ELEC light:","o":["Indicates a DC or standby power fault and operates only on the ground","Indicates a generator failure in flight","Indicates battery discharge","Indicates both transfer buses unpowered"],"e":"It is inhibited in flight."},{"id":"F06-21","c":"F06","r":"FCOM 6.20","q":"Batteries installed:","o":["Two 24 V nickel-cadmium batteries (main and auxiliary)","One 28 V lead-acid battery","Two 28 V lithium batteries","One main and one APU battery"],"e":"Both are in the electronics compartment."},{"id":"F06-22","c":"F06","r":"FCOM 6.20","q":"Two fully charged batteries provide standby power for a minimum of:","o":["60 minutes","30 minutes","45 minutes","90 minutes"],"e":"Battery voltage range is 22–30 V."},{"id":"F06-23","c":"F06","r":"FCOM 6.20","q":"When does the auxiliary battery operate in parallel with the main battery?","o":["When the battery is powering the standby system","Always in flight","Only during APU start","Never; it powers only the APU"],"e":"At all other times the auxiliary battery is isolated."},{"id":"F06-24","c":"F06","r":"FCOM 6.20","q":"The main battery charger is powered from:","o":["AC ground service bus 2","AC ground service bus 1","AC standby bus","Transfer bus 1"],"e":"The auxiliary battery charger is powered from ground service bus 1."},{"id":"F06-25","c":"F06","r":"FCOM 6.20","q":"If TR3 fails, the battery bus is powered by:","o":["The main battery charger TR","TR1","The static inverter","The DC standby bus"],"e":"In TR mode, the main charger also powers the battery bus if TR3 fails."},{"id":"F06-26","c":"F06","r":"FCOM 6.20","q":"The hot battery bus is:","o":["Always connected to the battery, with no switch","Powered only when the BAT switch is ON","Powered by TR3","Powered only on the ground"],"e":"The switched hot battery bus is the one powered when the BAT switch is ON."},{"id":"F06-27","c":"F06","r":"FCOM 6.10","q":"BAT DISCHARGE light (amber) indicates:","o":["Excessive battery discharge detected with BAT switch ON","Battery charger failure","Battery temperature high","Battery switch OFF"],"e":"It shows the battery is discharging excessively."},{"id":"F06-28","c":"F06","r":"FCOM 6.20","q":"Normally (STANDBY POWER switch AUTO), the AC standby bus is powered from:","o":["AC transfer bus 1","AC transfer bus 2","The static inverter","The battery"],"e":"With loss of AC power it is fed by the battery through the static inverter."},{"id":"F06-29","c":"F06","r":"FCOM 6.20","q":"With the STANDBY POWER switch in AUTO, automatic switching to battery power occurs when power is lost from:","o":["Either AC transfer bus 1 or DC bus 1","AC transfer bus 2","Both transfer buses only","The battery bus"],"e":"Loss of TB1 or DC bus 1 transfers standby buses to the batteries."},{"id":"F06-30","c":"F06","r":"FCOM 6.10","q":"STANDBY POWER switch in BAT (unguarded):","o":["AC standby bus powered by battery through the static inverter; DC standby and battery bus by battery directly","Battery charging is inhibited","Standby buses are unpowered","AC standby powered by transfer bus 2"],"e":"BAT overrides automatic switching; the BAT switch can be ON or OFF."},{"id":"F06-31","c":"F06","r":"FCOM 6.10","q":"STANDBY POWER switch OFF results in:","o":["AC standby bus, static inverter and DC standby bus unpowered; STANDBY PWR OFF light on","Only the AC standby bus unpowered","The battery bus unpowered","No change in flight"],"e":"OFF is the center position."},{"id":"F06-32","c":"F06","r":"FCOM 6.20","q":"The static inverter converts:","o":["24 V DC battery power to 115 V AC for the AC standby bus","115 V AC to 28 V DC","28 V DC to 26 V AC","AC transfer bus power to DC standby"],"e":"It is controlled by the standby power and battery switches."},{"id":"F06-33","c":"F06","r":"FCOM 6.10","q":"Battery switch OFF with the battery as the only power source removes power from:","o":["Battery bus, switched hot battery bus, DC standby bus, static inverter and AC standby bus","Only the switched hot battery bus","Only the hot battery bus","Nothing; the standby system is protected"],"e":"With normal sources available, OFF only removes the battery bus and switched hot battery bus."},{"id":"F06-34","c":"F06","r":"FCOM 6.10","q":"The CAB/UTIL switch OFF removes power from all of these EXCEPT:","o":["Flight deck auxiliary power outlets","115 V AC galley buses","Left and right recirculation fans","Lavatory water heaters"],"e":"Flight deck aux outlets are on the IFE/PASS SEAT switch."},{"id":"F06-35","c":"F06","r":"FCOM 6.20","q":"With only batteries powering the airplane, APU start attempts are not recommended above:","o":["25
