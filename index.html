limits:","o":["Structural life of airframe and landing gear, not controllability","Lateral controllability","Engine fuel supply","CG limits"],"e":"Imbalance alerts relate to trim drag and fuel consumption."},{"id":"8-53","c":"8","r":"FCTM 8.34","q":"Opening the crossfeed immediately after an in-flight engine shutdown:","o":["Is contrary to Boeing procedures and may pump fuel overboard if there is a leak","Is required","Prevents all imbalances","Is a memory item"],"e":"Pump pressure differences mean fuel may come from the lowest tank."},{"id":"8-54","c":"8","r":"FCTM 8.35","q":"The Engine Fuel Leak NNC assumes the leak is located:","o":["Between the front spar and the engine","Inside the center tank","In the crossfeed manifold","At the APU"],"e":"There is no specific fuel leak annunciation."},{"id":"8-55","c":"8","r":"FCTM 8.36","q":"Why is the engine shut down for a confirmed engine fuel leak?","o":["To close the spar valve stopping the leak, and reduce fire risk","To balance fuel","To save fuel only","To reset the FMC"],"e":"Reverse thrust can spread leaking fuel and increase fire risk."},{"id":"8-56","c":"8","r":"FCTM 8.37","q":"Low fuel landing: heavy braking and high reverse should be avoided to:","o":["Prevent uncovering fuel pumps and engine flameout","Protect the brakes","Avoid FOD","Reduce noise"],"e":"Keep clean configuration as long as possible; decelerate smoothly."},{"id":"8-57","c":"8","r":"FCTM 8.37","q":"After manual gear extension, the landing gear:","o":["Cannot be raised","Can be raised with system B","Retracts with alternate flaps","Can be raised by the PTU"],"e":"Alternate LE devices extend but cannot be retracted."},{"id":"8-58","c":"8","r":"FCTM 8.37","q":"With hydraulic system B lost (or A and B), the NNC recommends flaps 15 to:","o":["Improve go-around capability","Reduce landing distance","Allow autoland","Reduce float"],"e":"Do not allow the airplane to float."},{"id":"8-59","c":"8","r":"FCTM 8.38","q":"Manual reversion (A and B inoperative): trim technique:","o":["Trim slightly nose up and hold light forward pressure","Trim nose down","No trim allowed","Use only manual trim"],"e":"Rudder is powered by standby hydraulics; don't overcontrol."},{"id":"8-60","c":"8","r":"FCTM 8.38","q":"Manual reversion, after stopping on the runway:","o":["Do not taxi; accumulator pressure may be depleted","Taxi slowly with differential thrust","Taxi with nose wheel steering","Use reverse to back up"],"e":"Apply steady brake pressure; only accumulator pressure is available."},{"id":"8-61","c":"8","r":"FCTM 8.39","q":"Suspected tire failure on takeoff, no other damage:","o":["Retract gear normally, advise ATC, consider continuing to destination","Leave the gear down","Return immediately","Dump fuel"],"e":"Wheel well design and auto braking protect from a failed tire."},{"id":"8-62","c":"8","r":"FCTM 8.40","q":"Landing with a flat main gear tire:","o":["Maximum reverse thrust, no autobrakes","Autobrakes MAX","Idle reverse only","Hold the nose off"],"e":"Flat nose tire: gentle nose lowering, idle reverse, low autobrake allowed."},{"id":"8-63","c":"8","r":"FCTM 8.40","q":"Foaming the runway for a gear-up landing:","o":["Is not necessary; minimal benefit and ~30 min to replenish foam","Is mandatory","Is recommended","Is required for partial gear"],"e":"Land on all available gear; don't cycle the gear repeatedly."},{"id":"8-64","c":"8","r":"FCTM 8.41","q":"Partial gear landing: speedbrakes should be extended:","o":["Only when stopping distance is critical, after all areas have touched down","Immediately at touchdown","Before touchdown","Never"],"e":"Early extension causes earlier, faster touchdown of unsupported areas."},{"id":"8-65","c":"8","r":"FCTM 8.42","q":"One main gear and nose gear extended: land on:","o":["The side of the runway corresponding to the extended main gear","The center","The opposite side","The longest runway edge"],"e":"Keep wings level as long as possible."},{"id":"8-66","c":"8","r":"FCTM 8.43","q":"Overspeed correction in high altitude cruise:","o":["Leave A/P engaged, avoid idle thrust, deploy partial speedbrakes slowly","Disconnect A/P and pull up","Set idle thrust","Extend flaps"],"e":"Log the maximum airspeed whenever VMO/MMO is exceeded."},{"id":"8-67","c":"8","r":"FCTM 8.43","q":"Crews frequently climbing/descending in windshear may reduce climb/descent speeds by:","o":["5 to 10 kt","20 kt","30 kt","1 to 2 kt"],"e":"Delay speedbrake retraction until VNAV path or altitude capture."},{"id":"8-68","c":"8","r":"FCTM 8.45","q":"The biggest single cause of a landing tail strike:","o":["Unstabilized approach","Holding off in the flare","Crosswind","Late go-around"],"e":"Second most common: extended flare (holding off)."},{"id":"8-69","c":"8","r":"FCTM 8.45","q":"A takeoff tail strike risk factor is:","o":["Mistrimmed stabilizer from erroneous takeoff data","Rolling takeoff","Flaps 25 takeoff","Reduced thrust"],"e":"Also: early rotation, trimming during rotation, excessive rate, rotating into the F/D bar."},{"id":"8-70","c":"8","r":"FCTM 8.47","q":"During a late go-around over the runway, a brief gear touchdown:","o":["Is acceptable","Requires a full stop","Requires reverse thrust","Must be avoided by over-rotating"],"e":"Abrupt rotation to the F/D bar can cause a tail strike."},{"id":"8-71","c":"8","r":"FCTM 8.48","q":"Continued cargo fire warning after suppression activation:","o":["Does not alone indicate an uncontrolled fire","Means the fire is uncontrolled","Requires ditching","Requires a second discharge"],"e":"Increasing smoke may indicate an uncontrolled fire."},{"id":"8-72","c":"8","r":"FCTM 8.48","q":"Wheel well fire above 270 kt / M0.82: reduce speed quickly using:","o":["ALT HOLD with ~250 kt (A/T to SPD mode)","VNAV speed intervention","LVL CHG","Manual thrust only"],"e":"Keep the A/T engaged; observe gear speed limits."},{"id":"8-73","c":"8","r":"FCTM 8.48","q":"Window crack check with a pencil: if the crack does NOT move relative to the pencil point:","o":["The crack is in the inner pane","The crack is in the outer pane","The window is delaminated","No crack exists"],"e":"If uncertain on heated windows 1–3, assume inner pane."},{"id":"8-74","c":"8","r":"FCTM 8.49","q":"Both forward windows delaminated with unsatisfactory vision:","o":["Accomplish an ILS or GLS autoland, if available","Land manually through the side window","Divert to a VFR airport","Open the side window"],"e":"Per FCTM 8.49."},{"id":"8-75","c":"8","r":"FCTM 8.49","q":"An unlatched flight deck window opens during the takeoff roll at high speed:","o":["Continue the takeoff and close it once airborne and under control","Reject the takeoff","Continue and return immediately","Depressurize and continue"],"e":"If it will not close, return to the departure airport."},{"id":"8-76","c":"8","r":"FCTM 8.49","q":"Opening a side window in flight (after depressurizing): a good target speed is:","o":["Maneuver speed for the current flap setting","VMO","250 kt","VREF"],"e":"There is a relatively calm air area over the open window."},{"id":"8-77","c":"8","r":"FCTM 8.50","q":"With elevator control affected, pitch can be controlled with:","o":["Stabilizer trim, bank angle and thrust","Rudder only","Speedbrakes","Flaps only"],"e":"Thrust increase pitches up; thrust decrease pitches down."},{"id":"8-78","c":"8","r":"FCTM 8.51","q":"If maneuver capability is in question, limit bank angle to:","o":["15°","25°","30°","10°"],"e":"All Boeing airplanes can land at any flap position, including flaps up."},{"id":"8-79","c":"8","r":"FCTM 8.51","q":"During flap transition, an increasing rolling moment indicates an asymmetry. Action:","o":["Return the flap handle to the previous position","Continue to the selected position","Select alternate flaps","Retract to UP"],"e":"Do not change flap position if operation is in doubt, unless performance requires it."},{"id":"8-80","c":"8","r":"FCTM 8.52","q":"Unable to establish radio contact with ATC in an emergency:","o":["Squawk 7700 and proceed as circumstances dictate","Squawk 7600 only","Squawk 7500","Hold until contact"],"e":"Declare an emergency and request a discrete frequency if possible."},{"id":"8-81","c":"8","r":"FCTM 8.53","q":"Handling evaluation: stick shaker or buffet before the NNC flap speed means:","o":["Increase to a safe speed and treat it as minimum approach speed for that configuration","Continue to the NNC speed","Extend more flaps","Land immediately"],"e":"Lower gear only if thrust allows; evaluate at a safe altitude."},{"id":"8-82","c":"8","r":"FCTM 8.53","q":"If asymmetric thrust is being used for roll control:","o":["Plan to leave thrust on until touchdown","Reduce to idle at 50 ft","Use reverse before touchdown","Shut down one engine"],"e":"Landing airport: VMC, longest runway, emergency services, familiarity."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app'), bar=$('#bar'), barIn=$('#barIn'), hdr=$('#hdrRight');
const KEY='maxqb.v1';
const DB=window.__QBANK__;
let mem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
let P=load();
let S=P._set||{chs:null,filter:'all',count:20,mode:'study'};
let Q=null, tick=null;

function load(){try{return JSON.parse(lsGet(KEY))||{}}catch(e){return{}}}
function save(){P._set=S;P._t=Date.now();lsSet(KEY,JSON.stringify(P))}
function rec(id){return P[id]||(P[id]={s:0,c:0,l:null,f:0})}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chName(id){const c=DB.chapters.find(x=>x.id===id);return c?c.name:id}

/* Backup: export / import progress as a small text file (for moving between devices) */
function exportProgress(){
  const blob=new Blob([JSON.stringify(P)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='maxqbank-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function importProgress(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&typeof d==='object'){P=d;S=P._set||S;save();home();$('#poolInfo').textContent='Progress imported.'}}catch(e){$('#poolInfo').textContent='That file is not a MAX QBank backup.'}};
    r.readAsText(f)};
  inp.click();
}

if(!S.chs)S.chs=DB.chapters.map(c=>c.id);
home();

function pool(){
  return DB.questions.filter(q=>{
    if(!S.chs.includes(q.c))return false;
    const r=P[q.id];
    if(S.filter==='unseen')return !r||!r.s;
    if(S.filter==='wrong')return r&&r.l===0;
    if(S.filter==='flag')return r&&r.f;
    return true});
}

function home(){
  stopTick(); Q=null; window.scrollTo(0,0);
  if(!S||!Array.isArray(S.chs))S={chs:DB.chapters.map(c=>c.id),filter:'all',count:20,mode:'study'};
  const all=DB.questions, seen=all.filter(q=>P[q.id]&&P[q.id].s);
  const corr=seen.reduce((a,q)=>a+P[q.id].c,0), tot=seen.reduce((a,q)=>a+P[q.id].s,0);
  const wrong=all.filter(q=>P[q.id]&&P[q.id].l===0).length, flag=all.filter(q=>P[q.id]&&P[q.id].f).length;
  hdr.innerHTML='<button class="iconbtn" id="thm" aria-label="Switch theme">◐</button>';
  $('#thm').onclick=toggleTheme;
  let h=`<div class="stats">
    <div class="stat"><b>${seen.length}<span style="font-size:15px;color:var(--muted)">/${all.length}</span></b><span>Questions seen</span></div>
    <div class="stat"><b>${tot?Math.round(corr/tot*100):0}%</b><span>Accuracy</span></div>
    <div class="stat"><b>${wrong}</b><span>To review</span></div></div>
  <h2>Chapters</h2><div class="chaps">`;
  DB.chapters.forEach(c=>{
    const qs=all.filter(q=>q.c===c.id), sn=qs.filter(q=>P[q.id]&&P[q.id].s);
    const ok=sn.filter(q=>P[q.id].l===1).length, no=sn.filter(q=>P[q.id].l===0).length;
    const on=S.chs.includes(c.id);
    h+=`<button class="chap" data-c="${c.id}" aria-pressed="${on}">
      <span class="box">${on?'✓':''}</span>
      <span class="t"><div class="n">${esc(c.name)}</div><div class="m">${esc(c.src)} ${esc(c.ref)} · ${qs.length} Q</div>
      <div class="bar"><i class="g" style="width:${qs.length?ok/qs.length*100:0}%"></i><i class="x" style="width:${qs.length?no/qs.length*100:0}%"></i></div></span>
      <span class="pct">${sn.length?Math.round(ok/sn.length*100)+'%':'—'}<small>${sn.length}/${qs.length}</small></span></button>`});
  h+=`</div><div class="row" style="margin-top:8px"><button class="linkbtn" id="selAll">Select all</button><span class="small">·</span><button class="linkbtn" id="selNone">Clear</button></div>
  <h2>Questions</h2>
  <div class="seg" id="fSeg">${[['all','All'],['unseen','Unseen'],['wrong','Wrong ('+wrong+')'],['flag','Flagged ('+flag+')']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div>
  <h2>Number of questions</h2>
  <div class="seg" id="nSeg">${[10,20,50,0].map(n=>`<button data-n="${n}" aria-pressed="${S.count===n}">${n||'All'}</button>`).join('')}</div>
  <h2>Mode</h2>
  <div class="seg" id="mSeg"><button data-m="study" aria-pressed="${S.mode==='study'}">Study · instant feedback</button><button data-m="exam" aria-pressed="${S.mode==='exam'}">Exam · timed, 75% pass</button></div>
  <p class="hint" id="poolInfo"></p>
  <h2>Progress</h2>
  <div class="row"><button class="linkbtn" id="exp">Back up progress</button><span class="small">·</span><button class="linkbtn" id="imp">Restore backup</button></div>
  <div id="resetBox" style="margin-top:10px"><button class="linkbtn" id="reset">Reset all progress on this device</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{const id=b.dataset.c;S.chs=S.chs.includes(id)?S.chs.filter(x=>x!==id):S.chs.concat(id);save();home()});
  $('#selAll').onclick=()=>{S.chs=DB.chapters.map(c=>c.id);save();home()};
  $('#selNone').onclick=()=>{S.chs=[];save();home()};
  $('#exp').onclick=exportProgress; $('#imp').onclick=importProgress;
  app.querySelectorAll('#fSeg button').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();home()});
  app.querySelectorAll('#nSeg button').forEach(b=>b.onclick=()=>{S.count=+b.dataset.n;save();home()});
  app.querySelectorAll('#mSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();home()});
  $('#reset').onclick=()=>{$('#resetBox').innerHTML='<div class="confirm">This clears seen, wrong and flagged questions on this device.<div class="row" style="margin-top:10px"><button class="btn" id="rNo">Keep progress</button><button class="btn primary" id="rYes">Reset</button></div></div>';
    $('#rNo').onclick=home;$('#rYes').onclick=()=>{P={};save();home()}};
  const n=pool().length, take=S.count?Math.min(S.count,n):n;
  $('#poolInfo').textContent=n?`${take} of ${n} matching questions, in random order.`:'No questions match. Choose more chapters or another filter.';
  bar.hidden=false;
  barIn.innerHTML=`<button class="btn primary" id="go" ${n?'':'disabled'}>Start ${S.mode==='exam'?'exam':'study'} · ${take}</button>`;
  $('#go').onclick=start;
}

function start(){
  const qs=shuffle(pool()).slice(0,S.count||undefined);
  if(!qs.length)return;
  Q={mode:S.mode,items:qs.map(q=>({q,order:shuffle([0,1,2,3]),pick:null})),i:0,t0:Date.now(),limit:S.mode==='exam'?qs.length*75:0,done:false};
  if(Q.mode==='exam')startTick();
  show();
}
function startTick(){stopTick();tick=setInterval(()=>{const el=$('#tmr');if(!el||!Q)return;const left=Q.limit-Math.floor((Date.now()-Q.t0)/1000);el.textContent=fmt(Math.max(0,left));if(left<=0){finish()}},1000)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function show(){
  window.scrollTo(0,0);
  const it=Q.items[Q.i], q=it.q, r=rec(q.id), n=Q.items.length, exam=Q.mode==='exam';
  const answered=it.pick!==null, reveal=!exam&&answered;
  hdr.innerHTML=(exam?`<span class="timer" id="tmr">${fmt(Math.max(0,Q.limit-Math.floor((Date.now()-Q.t0)/1000)))}</span> `:'')+
    `<button class="iconbtn flag" id="flg" aria-pressed="${!!r.f}" aria-label="Flag question">⚑</button> <button class="iconbtn" id="quit" aria-label="Exit session">✕</button>`;
  let h=`<div class="qhead"><div class="prog"><i style="width:${(Q.i+(answered?1:0))/n*100}%"></i></div><span class="count">${Q.i+1} / ${n}</span></div>
  <div id="quitBox"></div>
  <div class="qcard"><div class="meta"><span class="chip ref">${esc(q.r)}</span><span class="chip">${esc(chName(q.c))}</span></div>
  <p class="qtext">${esc(q.q)}</p><div class="opts">`;
  it.order.forEach((oi,k)=>{
    let cls='';
    if(reveal){ if(oi===0)cls='ok'; else if(oi===it.pick)cls='no'; }
    else if(exam&&it.pick===oi)cls='sel';
    h+=`<button class="opt ${cls}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span></button>`});
  h+='</div>';
  if(reveal){const ok=it.pick===0;h+=`<div class="expl ${ok?'':'bad'}"><b>${ok?'Correct.':'Incorrect. Correct answer: '+esc(q.o[0])}</b>${esc(q.e)}</div>`}
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  $('#flg').onclick=()=>{r.f=r.f?0:1;save();$('#flg').setAttribute('aria-pressed',!!r.f)};
  $('#quit').onclick=()=>{$('#quitBox').innerHTML=`<div class="confirm">${exam?'End the exam now? Unanswered questions count as wrong.':'Leave this session? Answers so far are saved.'}<div class="row" style="margin-top:10px"><button class="btn" id="qNo">Continue</button><button class="btn primary" id="qYes">${exam?'End exam':'Leave'}</button></div></div>`;
    $('#qNo').onclick=()=>{$('#quitBox').innerHTML=''};$('#qYes').onclick=()=>exam?finish():(Q.items.some(x=>x.pick!==null)?finish():home())};
  bar.hidden=false;
  const last=Q.i===n-1;
  if(exam){
    barIn.innerHTML=`<button class="btn" id="prev" ${Q.i?'':'disabled'}>Back</button><button class="btn primary" id="next">${last?'Submit exam':'Next'}</button>`;
    $('#prev').onclick=()=>{Q.i--;show()};
    $('#next').onclick=()=>{if(last)finish();else{Q.i++;show()}};
  }else{
    barIn.innerHTML=`<button class="btn primary" id="next" ${answered?'':'disabled'}>${last?'See results':'Next question'}</button>`;
    $('#next').onclick=()=>{if(last)finish();else{Q.i++;show()}};
  }
}
function pick(oi){
  const it=Q.items[Q.i];
  if(Q.mode==='study'){ if(it.pick!==null)return; it.pick=oi; score(it); }
  else it.pick=oi;
  show();
}
function score(it){const r=rec(it.q.id);r.s++;const ok=it.pick===0;if(ok)r.c++;r.l=ok?1:0;save()}

function finish(){
  if(!Q||Q.done)return;
  Q.done=true; stopTick();
  if(Q.mode==='exam')Q.items.forEach(it=>{if(it.pick!==null)score(it);else{const r=rec(it.q.id);r.s++;r.l=0;save()}});
  const items=Q.mode==='exam'?Q.items:Q.items.filter(x=>x.pick!==null);
  const ok=items.filter(x=>x.pick===0).length, n=items.length, pct=n?Math.round(ok/n*100):0, pass=pct>=75;
  const secs=Math.floor((Date.now()-Q.t0)/1000);
  window.scrollTo(0,0);
  hdr.innerHTML='';
  const C=2*Math.PI*40;
  let h=`<div class="score"><svg class="dial" viewBox="0 0 96 96" role="img" aria-label="${pct}% correct">
    <circle cx="48" cy="48" r="40" fill="none" stroke="var(--panel-2)" stroke-width="9"/>
    <circle cx="48" cy="48" r="40" fill="none" stroke="${pass?'var(--good)':'var(--bad)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 48 48)"/>
    <text x="48" y="54" text-anchor="middle" font-weight="600" font-size="24" fill="var(--ink)">${pct}%</text></svg>
    <div><div class="verdict ${pass?'pass':'fail'}">${Q.mode==='exam'?(pass?'Pass':'Below 75%'):(pass?'Well done':'Keep going')}</div>
    <div class="small" style="margin-top:6px">${ok} of ${n} correct · ${fmt(secs)} ${Q.mode==='exam'?'· pass mark 75%':''}</div></div></div>
  <h2>Review</h2><div class="rlist">`;
  items.forEach(it=>{const q=it.q,good=it.pick===0;
    h+=`<div class="ritem ${good?'':'bad'}"><div class="meta"><span class="chip ref">${esc(q.r)}</span></div><p>${esc(q.q)}</p>
    ${good?'':`<div class="a">Your answer: <span>${it.pick===null?'Not answered':esc(q.o[it.pick])}</span></div>`}
    <div class="a">Correct: <span>${esc(q.o[0])}</span></div><div class="a" style="margin-top:4px">${esc(q.e)}</div></div>`});
  h+='</div>';
  app.innerHTML=h;
  const wrongIds=items.filter(x=>x.pick!==0).map(x=>x.q);
  barIn.innerHTML=`<button class="btn" id="hm">Home</button>${wrongIds.length?'<button class="btn primary" id="rw">Retry wrong ('+wrongIds.length+')</button>':''}`;
  $('#hm').onclick=home;
  if(wrongIds.length)$('#rw').onclick=()=>{Q={mode:'study',items:shuffle(wrongIds).map(q=>({q,order:shuffle([0,1,2,3]),pick:null})),i:0,t0:Date.now(),limit:0,done:false};show()};
}

function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);lsSet('maxqb.theme',nx)}
{const t=lsGet('maxqb.theme');if(t)document.documentElement.setAttribute('data-theme',t)}

document.addEventListener('keydown',e=>{
  if(!Q||Q.done)return;
  const k='1234'.indexOf(e.key);
  if(k>=0){const it=Q.items[Q.i];pick(it.order[k])}
  else if(e.key==='Enter'){const b=$('#next');if(b&&!b.disabled)b.click()}
});
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script>
