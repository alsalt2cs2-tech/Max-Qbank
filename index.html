"o":["ARMED detent","FLIGHT detent","UP","Half way"],"e":"(# memory limitation)"},{"id":"L4-04","c":"L4","r":"FCOM L.10.7","q":"Do not deploy speedbrakes in flight below:","o":["1,000 ft RA / above the surface","500 ft","1,500 ft","2,000 ft"],"e":"(# memory limitation)"},{"id":"L4-05","c":"L4","r":"FCOM L.10.7","q":"Rapid, large alternating control inputs may cause structural failure:","o":["At any speed, including below VA","Only above VA","Only above VMO","Only with flaps extended"],"e":"(# memory limitation)"},{"id":"L4-06","c":"L4","r":"FCOM L.10.7","q":"Alternate flaps duty cycle: after releasing the position switch, wait before moving it again:","o":["15 seconds","5 seconds","30 seconds","1 minute"],"e":"After a full 0–15–0 cycle, allow 5 minutes cooling."},{"id":"L4-07","c":"L4","r":"FCOM L.10.7","q":"After a complete alternate flap extend/retract cycle (0–15–0), allow cooling for:","o":["5 minutes","15 minutes","2 minutes","10 minutes"],"e":"FCOM Limitations."},{"id":"L4-08","c":"L4","r":"FCOM L.10.8","q":"ADIRU alignment must not be attempted at latitudes greater than:","o":["78° 15'","82°","73°","70.2°"],"e":"FCOM Limitations."},{"id":"L4-09","c":"L4","r":"FCOM L.10.8","q":"Operations based on magnetic heading/track are prohibited where IRS MagVar table errors exceed:","o":["5°","3°","2°","10°"],"e":"For fail-operational A/P ILS/GLS approaches using magnetic courses: 3°."},{"id":"L4-10","c":"L4","r":"FCOM L.10.8","q":"Do not use look-ahead terrain alerting within ___ of an airport/runway not in the GPWS database.","o":["15 NM","5 NM","10 NM","30 NM"],"e":"Terrain display must not be used for navigation."},{"id":"L4-11","c":"L4","r":"FCOM L.10.8","q":"If 'OVERRUN, GO-AROUND' occurs on approach:","o":["Execute an immediate go-around","Continue if runway in sight","Use max autobrake","Check landing distance"],"e":"FCOM Limitations."},{"id":"L4-12","c":"L4","r":"FCOM L.10.8","q":"Inhibit the overrun alert when landing OAT is below ___ or above ___, or weight exceeds MLW.","o":["–40°C; 50°C","–30°C; 45°C","–40°C; 55°C","–50°C; 50°C"],"e":"FCOM Limitations."},{"id":"L4-13","c":"L4","r":"FCOM L.10.9","q":"Weather radar operation in a hangar:","o":["Avoid (except test mode)","Allowed at low gain","Allowed in standby","Allowed with doors open"],"e":"(# memory limitation)"},{"id":"L4-14","c":"L4","r":"FCOM L.10.9","q":"Maximum tank fuel temperature:","o":["49°C","54°C","43°C","60°C"],"e":"FCOM Limitations."},{"id":"L4-15","c":"L4","r":"FCOM L.10.9","q":"Minimum tank fuel temperature before takeoff and in flight:","o":["–43°C or 3°C above freezing point, whichever is higher","–40°C","–43°C or 5°C above freezing point","–37°C"],"e":"FSII additives don't change this limit."},{"id":"L4-16","c":"L4","r":"FCOM L.10.9","q":"Intentional dry running of a center tank fuel pump (LOW PRESSURE light on):","o":["Prohibited","Allowed for 5 minutes","Allowed in cruise","Allowed on the ground"],"e":"FCOM Limitations."},{"id":"L4-17","c":"L4","r":"FCOM L.10.9","q":"Maximum fuel imbalance between main tanks:","o":["453 kg","907 kg","226 kg","1,000 kg"],"e":"Imbalance must be scheduled to be zero."},{"id":"L4-18","c":"L4","r":"FCOM L.10.9","q":"Main tanks 1 and 2 must be full if the center tank contains more than:","o":["453 kg","907 kg","1,000 kg","226 kg"],"e":"FCOM Limitations."},{"id":"L4-19","c":"L4","r":"FCOM L.10.9","q":"Brakes must not be applied:","o":["Until after touchdown","Until 80 kt","Before spoiler deployment","Below 60 kt"],"e":"Non-AFM."}],"memory":[{"id":"M01","title":"Landing Configuration","ref":"QRH 15.1","cond":"In flight, the steady warning horn sounds.","steps":["Assure correct airplane landing configuration"]},{"id":"M02","title":"Takeoff Configuration","ref":"QRH 15.1","cond":"On the ground, intermittent horn or TAKEOFF CONFIG light when advancing thrust levers to takeoff thrust.","steps":["Assure correct airplane takeoff configuration"]},{"id":"M03","title":"Aborted Engine Start","ref":"QRH 7.1","cond":"On the ground, an aborted engine start is needed.","steps":["Engine start lever (affected engine) — CUTOFF"]},{"id":"M04","title":"Engine Limit or Surge or Stall","ref":"QRH 7.2","cond":"Abnormal or rapidly approaching/exceeding limit indications, abnormal noises, no or abnormal thrust response, or flames in inlet/exhaust.","steps":["Autothrottle (if engaged) — Disengage","Thrust lever (affected engine) — Confirm — Retard until indications stay within limits or lever is closed"]},{"id":"M05","title":"Loss of Thrust on Both Engines","ref":"QRH 7.6","cond":"Both engines have a loss of thrust and both ENG FAIL alerts show.","steps":["ENGINE START switches (both) — FLT","Engine start levers (both) — CUTOFF","When EGT decreases: Engine start levers (both) — IDLE detent","If EGT reaches redline or no EGT increase within 30 s: Start lever (affected) — Confirm — CUTOFF, then IDLE detent (repeat as needed)"]},{"id":"M06","title":"ENGINE FIRE or Engine Severe Damage or Separation","ref":"QRH 8.2","cond":"Engine fire warning, airframe vibration with abnormal engine indications, engine separation, or engine failure with smoke/fumes.","steps":["Autothrottle (if engaged) — Disengage","Thrust lever (affected engine) — Confirm — Close","Engine start lever (affected engine) — Confirm — CUTOFF","Engine fire switch (affected engine) — Confirm — Pull","If fire switch or ENG OVERHEAT light illuminated: Engine fire switch — Rotate to the stop and hold for 1 second"]},{"id":"M07","title":"Engine Overheat","ref":"QRH 8.6","cond":"An overheat is detected in the engine.","steps":["Autothrottle (if engaged) — Disengage","Thrust lever (affected engine) — Confirm — Close","If ENG OVERHEAT light stays illuminated: Go to ENGINE FIRE or Engine Severe Damage or Separation checklist"]},{"id":"M08","title":"APU Fire","ref":"QRH 8.1","cond":"Fire is detected in the APU.","steps":["APU fire switch — Confirm — Pull, rotate to the stop, and hold for 1 second","APU switch — OFF"]},{"id":"M09","title":"Runaway Stabilizer","ref":"QRH 9.1","cond":"Uncommanded stabilizer trim movement, continuous or not appropriate for flight conditions.","steps":["Control column — Hold firmly","Autopilot (if engaged) — Disengage","Autothrottle (if engaged) — Disengage","Control column and thrust levers — Control pitch attitude and airspeed","Main electric stabilizer trim — Reduce control column forces","If runaway stops after A/P disengaged: Do not re-engage the autopilot or autothrottle","If runaway continues after A/P disengaged: STAB TRIM cutout switches (both) — CUTOUT; if it still continues: Stabilizer trim wheel — Grasp and hold"]},{"id":"M10","title":"Airspeed Unreliable","ref":"QRH 10.1","cond":"Airspeed or Mach indications are suspected to be unreliable.","steps":["Autopilot (if engaged) — Disengage","Autothrottle (if engaged) — Disengage","F/D switches (both) — OFF","Set gear-up pitch and thrust: flaps extended 10° and 80% N1 / flaps up 4° and 75% N1"]},{"id":"M11","title":"CABIN ALTITUDE WARNING or Rapid Depressurization","ref":"QRH 2.1","cond":"Cabin altitude exceedance, or in flight the intermittent horn sounds or CABIN ALTITUDE light illuminates.","steps":["Don oxygen masks and set regulators to 100%","Establish crew communications","Pressurization mode selector — MAN","Outflow VALVE switch — Hold in CLOSE until indication shows fully closed","If cabin altitude uncontrollable: Passenger signs ON, PASS OXYGEN switch ON, go to Emergency Descent checklist"]},{"id":"M12","title":"Emergency Descent","ref":"QRH 0.1","cond":"Cabin altitude cannot be controlled, or a rapid descent is needed.","steps":["Announce the emergency descent (PF advises cabin on PA; PM advises ATC and gets area altimeter setting)","Passenger signs — ON","Without delay, descend to lowest safe altitude or 10,000 ft, whichever is higher","ENGINE START switches (both) — CONT","Thrust levers (both) — Reduce to minimum or as needed for anti-ice","SPEED BRAKE — FLIGHT DETENT","Set target speed to Mmo/Vmo (limit speed if structural integrity in doubt)"]},{"id":"M13","title":"Bomb on Board (in flight)","ref":"QRH 0.x","cond":"Suspicious article found or specific bomb threat confirmed by company or ATC — in flight.","steps":["Aircraft (if climbing) — LEVEL OFF","Emergency — DECLARE","Transponder — As required","Cabin crew — NOTIFY","Fasten seat belts — ON","Landing alt selector — SET to current cabin altitude (do not raise cabin altitude)","Plan to land at the nearest suitable airport as soon as possible","Descent — INITIATE (reduce cabin differential to zero below 10,000 ft, observing MSAs)","Speed — DETERMINE"]}]};

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app'), bar=$('#bar'), barIn=$('#barIn'), hdr=$('#hdrRight');
const KEY='maxqb.v1';
const DB=window.__QBANK__;
let mem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
let P=load();
let S=P._set||{chs:null,filter:'all',count:20,mode:'study'};
let Q=null, tick=null;

function load(){try{return JSON.parse(lsGet(KEY))||{}}catch(e){return{}}}
function save(){P._set=S;P._t=Date.now();lsSet(KEY,JSON.stringify(P))}
function rec(id){return P[id]||(P[id]={s:0,c:0,l:null,f:0})}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chName(id){const c=DB.chapters.find(x=>x.id===id);return c?c.name:id}

/* Backup: export / import progress as a small text file (for moving between devices) */
function exportProgress(){
  const blob=new Blob([JSON.stringify(P)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='maxqbank-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function importProgress(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&typeof d==='object'){P=d;S=P._set||S;save();home();$('#poolInfo').textContent='Progress imported.'}}catch(e){$('#poolInfo').textContent='That file is not a MAX QBank backup.'}};
    r.readAsText(f)};
  inp.click();
}

if(!S.chs)S.chs=DB.chapters.map(c=>c.id);
/* chapters added in an update start selected */
if(!Array.isArray(S.known))S.known=S.chs.slice().concat(DB.chapters.filter(c=>(c.sec||'FCTM')==='FCTM').map(c=>c.id));
DB.chapters.forEach(c=>{if(!S.known.includes(c.id)){S.known.push(c.id);if(!S.chs.includes(c.id))S.chs.push(c.id)}});
if(S.sec===undefined)S.sec=null;
const SECS=DB.sections||[{id:'FCTM',name:'FCTM',sub:''}];
function secOf(c){return c.sec||'FCTM'}
function secChapters(id){return DB.chapters.filter(c=>secOf(c)===id)}
function secName(id){const s=SECS.find(x=>x.id===id);return s?s.name:id}
home();


/* ---------- Memory items: sequence drill ---------- */
function mrec(id){const k='M:'+id;return P[k]||(P[k]={s:0,c:0,l:null,f:0})}
function memStats(){const M=DB.memory||[];let seen=0,ok=0,no=0;M.forEach(m=>{const r=P['M:'+m.id];if(r&&r.s){seen++;if(r.l===1)ok++;else if(r.l===0)no++}});return{seen,ok,no}}
var MD=null;
function memHome(){
  stopTick();Q=null;MD=null;window.scrollTo(0,0);
  const M=DB.memory||[], ms=memStats();
  if(!S.mfilter)S.mfilter='all';
  if(S.mdist===undefined)S.mdist=2;
  hdr.innerHTML='<button class="iconbtn" id="thm" aria-label="Switch theme">◐</button>';$('#thm').onclick=toggleTheme;
  let h=`<button class="linkbtn backlink" id="back">‹ All sections</button><div class="sechead">Memory Items<small>Read the condition, then tap the steps in the correct order</small></div>
  <div class="stats"><div class="stat"><b>${ms.seen}<span style="font-size:15px;color:var(--muted)">/${M.length}</span></b><span>Practised</span></div>
  <div class="stat"><b>${ms.seen?Math.round(ms.ok/ms.seen*100):0}%</b><span>Perfect</span></div>
  <div class="stat"><b>${ms.no}</b><span>To review</span></div></div>
  <h2>Procedures</h2><div class="chaps">`;
  M.forEach(m=>{const r=P['M:'+m.id];const st=!r||!r.s?'—':r.l===1?'✓':'✗';
    h+=`<button class="chap mitem" data-m="${m.id}"><span class="box ${r&&r.s?(r.l===1?'mok':'mno'):''}">${st==='—'?'':st}</span>
    <span class="t"><div class="n">${esc(m.title)}</div><div class="m">${esc(m.ref)} · ${m.steps.length} step${m.steps.length>1?'s':''}</div></span>
    <span class="pct"><small>${r&&r.s?r.c+'/'+r.s:'new'}</small></span></button>`});
  h+=`</div><p class="hint">Tap a procedure to drill just that one.</p>
  <h2>Drill</h2>
  <div class="seg" id="mfSeg">${[['all','All'],['wrong','To review ('+ms.no+')'],['new','Not practised']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.mfilter===k}">${l}</button>`).join('')}</div>
  <h2>Extra wrong steps mixed in</h2>
  <div class="seg" id="mdSeg">${[[0,'None'],[2,'2 · normal'],[4,'4 · hard']].map(([k,l])=>`<button data-d="${k}" aria-pressed="${S.mdist===k}">${l}</button>`).join('')}</div>
  <p class="hint" id="poolInfo"></p>`;
  app.innerHTML=h;
  $('#back').onclick=sections;
  app.querySelectorAll('.mitem').forEach(b=>b.onclick=()=>memStart([M.find(m=>m.id===b.dataset.m)]));
  app.querySelectorAll('#mfSeg button').forEach(b=>b.onclick=()=>{S.mfilter=b.dataset.f;save();memHome()});
  app.querySelectorAll('#mdSeg button').forEach(b=>b.onclick=()=>{S.mdist=+b.dataset.d;save();memHome()});
  const list=M.filter(m=>{const r=P['M:'+m.id];if(S.mfilter==='wrong')return r&&r.l===0;if(S.mfilter==='new')return !r||!r.s;return true});
  $('#poolInfo').textContent=list.length?`${list.length} procedures, in random order.`:'Nothing matches this filter.';
  bar.hidden=false;
  barIn.innerHTML=`<button class="btn primary" id="go" ${list.length?'':'disabled'}>Start drill · ${list.length}</button>`;
  $('#go').onclick=()=>memStart(shuffle(list));
}
function memStart(list){
  const M=DB.memory||[];
  MD={items:list.map(m=>{
    const own=new Set(m.steps);
    const pool=shuffle(M.filter(x=>x.id!==m.id).flatMap(x=>x.steps).filter(s=>!own.has(s)));
    const extra=[...new Set(pool)].slice(0,S.mdist||0);
    return {m,tiles:shuffle(m.steps.map((s,i)=>({s,i})).concat(extra.map(s=>({s,i:-1})))),pick:[],done:false,ok:null}}),i:0,good:0};
  memShow();
}
function memShow(){
  window.scrollTo(0,0);
  const it=MD.items[MD.i], m=it.m, n=MD.items.length;
  hdr.innerHTML='<button class="iconbtn" id="quit" aria-label="Exit drill">✕</button>';
  $('#quit').onclick=()=>{if(MD.items.some(x=>x.done))memFinish();else memHome()};
  let h=`<div class="qhead"><div class="prog"><i style="width:${(MD.i+(it.done?1:0))/n*100}%"></i></div><span class="count">${MD.i+1} / ${n}</span></div>
  <div class="qcard"><div class="meta"><span class="chip ref">${esc(m.ref)}</span><span class="chip">Memory item</span></div>
  <p class="qtext">${esc(m.title)}</p><p class="small" style="margin:6px 0 0">${esc(m.cond)}</p>
  <h2 style="margin-top:16px">Your sequence</h2><ol class="seq">`;
  if(!it.pick.length&&!it.done)h+=`<li class="ph">Tap the steps below in order${m.steps.length>1?' ('+m.steps.length+' steps)':''}</li>`;
  it.pick.forEach((ti,k)=>{const tl=it.tiles[ti];let cls='';
    if(it.done)cls=tl.i===k?'ok':'no';
    h+=`<li class="step ${cls}" data-k="${k}"><span class="k">${k+1}</span><span>${esc(tl.s)}</span></li>`});
  h+='</ol>';
  if(!it.done){
    h+=`<h2>Steps</h2><div class="tiles">`;
    it.tiles.forEach((tl,ti)=>{if(it.pick.includes(ti))return;h+=`<button class="tile" data-t="${ti}">${esc(tl.s)}</button>`});
    h+='</div>';
  }else{
    h+=`<div class="expl ${it.ok?'':'bad'}"><b>${it.ok?'Perfect sequence.':'Not quite. Correct sequence:'}</b>${it.ok?'':'<ol class="ans">'+m.steps.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>'}</div>`;
  }
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{it.pick.push(+b.dataset.t);memShow()});
  if(!it.done)app.querySelectorAll('.step').forEach(b=>b.onclick=()=>{it.pick.splice(+b.dataset.k);memShow()});
  bar.hidden=false;
  const last=MD.i===n-1;
  if(!it.done){
    barIn.innerHTML=`<button class="btn" id="clr" ${it.pick.length?'':'disabled'}>Undo</button><button class="btn primary" id="chk" ${it.pick.length?'':'disabled'}>Check</button>`;
    $('#clr').onclick=()=>{it.pick.pop();memShow()};
    $('#chk').onclick=()=>{
      it.done=true;
      it.ok=it.pick.length===m.steps.length&&it.pick.every((ti,k)=>it.tiles[ti].i===k);
      const r=mrec(m.id);r.s++;if(it.ok){r.c++;MD.good++}r.l=it.ok?1:0;save();memShow()};
  }else{
    barIn.innerHTML=`<button class="btn primary" id="nx">${last?'See results':'Next procedure'}</button>`;
    $('#nx').onclick=()=>{if(last)memFinish();else{MD.i++;memShow()}};
  }
}
function memFinish(){
  const done=MD.items.filter(x=>x.done), ok=done.filter(x=>x.ok).length, n=done.length, pct=n?Math.round(ok/n*100):0;
  window.scrollTo(0,0);hdr.innerHTML='';
  let h=`<div class="score"><div class="verdict ${pct===100?'pass':'fail'}" style="font-size:40px">${pct}%</div>
  <div><div class="verdict ${pct===100?'pass':'fail'}">${pct===100?'All perfect':'Keep drilling'}</div><div class="small" style="margin-top:6px">${ok} of ${n} sequences perfect</div></div></div>
  <h2>Review</h2><div class="rlist">`;
  done.forEach(x=>{h+=`<div class="ritem ${x.ok?'':'bad'}"><p>${esc(x.m.title)}</p>${x.ok?'':'<ol class="ans">'+x.m.steps.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>'}</div>`});
  h+='</div>';app.innerHTML=h;
  const wrong=done.filter(x=>!x.ok).map(x=>x.m);
  barIn.innerHTML=`<button class="btn" id="hm">Memory items</button>${wrong.length?'<button class="btn primary" id="rw">Retry wrong ('+wrong.length+')</button>':''}`;
  $('#hm').onclick=memHome; if(wrong.length)$('#rw').onclick=()=>memStart(shuffle(wrong));
}

function pool(){
  const inSec=new Set(secChapters(S.sec).map(c=>c.id));
  return DB.questions.filter(q=>{
    if(!inSec.has(q.c)||!S.chs.includes(q.c))return false;
    const r=P[q.id];
    if(S.filter==='unseen')return !r||!r.s;
    if(S.filter==='wrong')return r&&r.l===0;
    if(S.filter==='flag')return r&&r.f;
    return true});
}

function statsFor(all){
  const seen=all.filter(q=>P[q.id]&&P[q.id].s);
  const corr=seen.reduce((a,q)=>a+P[q.id].c,0), tot=seen.reduce((a,q)=>a+P[q.id].s,0);
  return {seen,acc:tot?Math.round(corr/tot*100):0,
    ok:seen.filter(q=>P[q.id].l===1).length,no:seen.filter(q=>P[q.id].l===0).length,
    wrong:all.filter(q=>P[q.id]&&P[q.id].l===0).length,flag:all.filter(q=>P[q.id]&&P[q.id].f).length};
}
function sections(){
  stopTick(); Q=null; S.sec=null; window.scrollTo(0,0);
  bar.hidden=true; barIn.innerHTML='';
  hdr.innerHTML='<button class="iconbtn" id="thm" aria-label="Switch theme">◐</button>';
  $('#thm').onclick=toggleTheme;
  const st=statsFor(DB.questions);
  let h=`<div class="stats">
    <div class="stat"><b>${st.seen.length}<span style="font-size:15px;color:var(--muted)">/${DB.questions.length}</span></b><span>Questions seen</span></div>
    <div class="stat"><b>${st.acc}%</b><span>Accuracy</span></div>
    <div class="stat"><b>${st.wrong}</b><span>To review</span></div></div>
  <h2>Sections</h2><div class="chaps">`;
  SECS.forEach(s=>{
    if(s.id==='MEM'){
      const M=DB.memory||[], ms=memStats();
      h+=`<button class="chap sec" data-s="MEM" ${M.length?'':'aria-disabled="true"'}>
      <span class="box secbox">M</span>
      <span class="t"><div class="n">${esc(s.name)}</div><div class="m">${M.length?`${M.length} procedures · sequence drill`:'Coming soon'}</div>
      ${M.length?`<div class="bar"><i class="g" style="width:${ms.ok/M.length*100}%"></i><i class="x" style="width:${ms.no/M.length*100}%"></i></div>`:''}</span>
      <span class="pct">${ms.seen?Math.round(ms.ok/ms.seen*100)+'%':(M.length?'—':'')}<small>${M.length?ms.seen+'/'+M.length:''}</small></span></button>`;
      return}
    const cids=new Set(secChapters(s.id).map(c=>c.id));
    const qs=DB.questions.filter(q=>cids.has(q.c)), x=statsFor(qs);
    h+=`<button class="chap sec" data-s="${s.id}" ${qs.length?'':'aria-disabled="true"'}>
      <span class="box secbox">${esc(s.name.slice(0,1))}</span>
      <span class="t"><div class="n">${esc(s.name)}</div><div class="m">${qs.length?`${cids.size} chapters · ${qs.length} Q`:'Coming soon'}</div>
      ${qs.length?`<div class="bar"><i class="g" style="width:${x.ok/qs.length*100}%"></i><i class="x" style="width:${x.no/qs.length*100}%"></i></div>`:''}</span>
      <span class="pct">${x.seen.length?Math.round(x.ok/x.seen.length*100)+'%':(qs.length?'—':'')}<small>${qs.length?x.seen.length+'/'+qs.length:''}</small></span></button>`});
  h+=`</div>
  <h2>Progress</h2>
  <div class="row"><button class="linkbtn" id="exp">Back up progress</button><span class="small">·</span><button class="linkbtn" id="imp">Restore backup</button></div>
  <p class="hint" id="poolInfo"></p>
  <div id="resetBox" style="margin-top:10px"><button class="linkbtn" id="reset">Reset all progress on this device</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{
    const id=b.dataset.s;
    if(id==='MEM'?!(DB.memory||[]).length:!secChapters(id).length){$('#poolInfo').textContent=secName(id)+' questions are not added yet.';return}
    S.sec=id;save();home()});
  $('#exp').onclick=exportProgress; $('#imp').onclick=importProgress;
  $('#reset').onclick=()=>{$('#resetBox').innerHTML='<div class="confirm">This clears seen, wrong and flagged questions on this device.<div class="row" style="margin-top:10px"><button class="btn" id="rNo">Keep progress</button><button class="btn primary" id="rYes">Reset</button></div></div>';
    $('#rNo').onclick=sections;$('#rYes').onclick=()=>{const keep=P._set;P={_set:keep};save();sections()}};
  save();
}

function home(){
  stopTick(); Q=null; window.scrollTo(0,0);
  if(!S||!Array.isArray(S.chs))S={chs:DB.chapters.map(c=>c.id),known:DB.chapters.map(c=>c.id),filter:'all',count:20,mode:'study',sec:null};
  if(S.sec==='MEM'&&(DB.memory||[]).length)return memHome();
  if(!S.sec||!secChapters(S.sec).length)return sections();
  const CH=secChapters(S.sec), cset=new Set(CH.map(c=>c.id));
  const all=DB.questions.filter(q=>cset.has(q.c)), st=statsFor(all), wrong=st.wrong, flag=st.flag;
  hdr.innerHTML='<button class="iconbtn" id="thm" aria-label="Switch theme">◐</button>';
  $('#thm').onclick=toggleTheme;
  let h=`<button class="linkbtn backlink" id="back">‹ All sections</button><div class="sechead">${esc(secName(S.sec))}<small>${esc((SECS.find(x=>x.id===S.sec)||{}).sub||'')}</small></div>
  <div class="stats">
    <div class="stat"><b>${st.seen.length}<span style="font-size:15px;color:var(--muted)">/${all.length}</span></b><span>Questions seen</span></div>
    <div class="stat"><b>${st.acc}%</b><span>Accuracy</span></div>
    <div class="stat"><b>${wrong}</b><span>To review</span></div></div>
  <h2>Chapters</h2><div class="chaps">`;
  CH.forEach(c=>{
    const qs=all.filter(q=>q.c===c.id), sn=qs.filter(q=>P[q.id]&&P[q.id].s);
    const ok=sn.filter(q=>P[q.id].l===1).length, no=sn.filter(q=>P[q.id].l===0).length;
    const on=S.chs.includes(c.id);
    h+=`<button class="chap" data-c="${c.id}" aria-pressed="${on}">
      <span class="box">${on?'✓':''}</span>
      <span class="t"><div class="n">${esc(c.name)}</div><div class="m">${esc(c.src)} ${esc(c.ref)} · ${qs.length} Q</div>
      <div class="bar"><i class="g" style="width:${qs.length?ok/qs.length*100:0}%"></i><i class="x" style="width:${qs.length?no/qs.length*100:0}%"></i></div></span>
      <span class="pct">${sn.length?Math.round(ok/sn.length*100)+'%':'—'}<small>${sn.length}/${qs.length}</small></span></button>`});
  h+=`</div><div class="row" style="margin-top:8px"><button class="linkbtn" id="selAll">Select all</button><span class="small">·</span><button class="linkbtn" id="selNone">Clear</button></div>
  <h2>Questions</h2>
  <div class="seg" id="fSeg">${[['all','All'],['unseen','Unseen'],['wrong','Wrong ('+wrong+')'],['flag','Flagged ('+flag+')']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div>
  <h2>Number of questions</h2>
  <div class="seg" id="nSeg">${[10,20,50,0].map(n=>`<button data-n="${n}" aria-pressed="${S.count===n}">${n||'All'}</button>`).join('')}</div>
  <h2>Mode</h2>
  <div class="seg" id="mSeg"><button data-m="study" aria-pressed="${S.mode==='study'}">Study · instant feedback</button><button data-m="exam" aria-pressed="${S.mode==='exam'}">Exam · timed, 75% pass</button></div>
  <p class="hint" id="poolInfo"></p>`;
  app.innerHTML=h;
  $('#back').onclick=sections;
  app.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{const id=b.dataset.c;S.chs=S.chs.includes(id)?S.chs.filter(x=>x!==id):S.chs.concat(id);save();home()});
  $('#selAll').onclick=()=>{S.chs=S.chs.filter(x=>!cset.has(x)).concat([...cset]);save();home()};
  $('#selNone').onclick=()=>{S.chs=S.chs.filter(x=>!cset.has(x));save();home()};
  app.querySelectorAll('#fSeg button').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();home()});
  app.querySelectorAll('#nSeg button').forEach(b=>b.onclick=()=>{S.count=+b.dataset.n;save();home()});
  app.querySelectorAll('#mSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();home()});
  const n=pool().length, take=S.count?Math.min(S.count,n):n;
  $('#poolInfo').textContent=n?`${take} of ${n} matching questions, in random order.`:'No questions match. Choose more chapters or another filter.';
  bar.hidden=false;
  barIn.innerHTML=`<button class="btn primary" id="go" ${n?'':'disabled'}>Start ${S.mode==='exam'?'exam':'study'} · ${take}</button>`;
  $('#go').onclick=start;
}

function start(){
  const qs=shuffle(pool()).slice(0,S.count||undefined);
  if(!qs.length)return;
  Q={mode:S.mode,items:qs.map(q=>({q,order:shuffle([0,1,2,3]),pick:null})),i:0,t0:Date.now(),limit:S.mode==='exam'?qs.length*75:0,done:false};
  if(Q.mode==='exam')startTick();
  show();
}
function startTick(){stopTick();tick=setInterval(()=>{const el=$('#tmr');if(!el||!Q)return;const left=Q.limit-Math.floor((Date.now()-Q.t0)/1000);el.textContent=fmt(Math.max(0,left));if(left<=0){finish()}},1000)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function show(){
  window.scrollTo(0,0);
  const it=Q.items[Q.i], q=it.q, r=rec(q.id), n=Q.items.length, exam=Q.mode==='exam';
  const answered=it.pick!==null, reveal=!exam&&answered;
  hdr.innerHTML=(exam?`<span class="timer" id="tmr">${fmt(Math.max(0,Q.limit-Math.floor((Date.now()-Q.t0)/1000)))}</span> `:'')+
    `<button class="iconbtn flag" id="flg" aria-pressed="${!!r.f}" aria-label="Flag question">⚑</button> <button class="iconbtn" id="quit" aria-label="Exit session">✕</button>`;
  let h=`<div class="qhead"><div class="prog"><i style="width:${(Q.i+(answered?1:0))/n*100}%"></i></div><span class="count">${Q.i+1} / ${n}</span></div>
  <div id="quitBox"></div>
  <div class="qcard"><div class="meta"><span class="chip ref">${esc(q.r)}</span><span class="chip">${esc(chName(q.c))}</span></div>
  <p class="qtext">${esc(q.q)}</p><div class="opts">`;
  it.order.forEach((oi,k)=>{
    let cls='';
    if(reveal){ if(oi===0)cls='ok'; else if(oi===it.pick)cls='no'; }
    else if(exam&&it.pick===oi)cls='sel';
    h+=`<button class="opt ${cls}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span></button>`});
  h+='</div>';
  if(reveal){const ok=it.pick===0;h+=`<div class="expl ${ok?'':'bad'}"><b>${ok?'Correct.':'Incorrect. Correct answer: '+esc(q.o[0])}</b>${esc(q.e)}</div>`}
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  $('#flg').onclick=()=>{r.f=r.f?0:1;save();$('#flg').setAttribute('aria-pressed',!!r.f)};
  $('#quit').onclick=()=>{$('#quitBox').innerHTML=`<div class="confirm">${exam?'End the exam now? Unanswered questions count as wrong.':'Leave this session? Answers so far are saved.'}<div class="row" style="margin-top:10px"><button class="btn" id="qNo">Continue</button><button class="btn primary" id="qYes">${exam?'End exam':'Leave'}</button></div></div>`;
    $('#qNo').onclick=()=>{$('#quitBox').innerHTML=''};$('#qYes').onclick=()=>exam?finish():(Q.items.some(x=>x.pick!==null)?finish():home())};
  bar.hidden=false;
  const last=Q.i===n-1;
  if(exam){
    barIn.innerHTML=`<button class="btn" id="prev" ${Q.i?'':'disabled'}>Back</button><button class="btn primary" id="next">${last?'Submit exam':'Next'}</button>`;
    $('#prev').onclick=()=>{Q.i--;show()};
    $('#next').onclick=()=>{if(last)finish();else{Q.i++;show()}};
  }else{
    barIn.innerHTML=`<button class="btn primary" id="next" ${answered?'':'disabled'}>${last?'See results':'Next question'}</button>`;
    $('#next').onclick=()=>{if(last)finish();else{Q.i++;show()}};
  }
}
function pick(oi){
  const it=Q.items[Q.i];
  if(Q.mode==='study'){ if(it.pick!==null)return; it.pick=oi; score(it); }
  else it.pick=oi;
  show();
}
function score(it){const r=rec(it.q.id);r.s++;const ok=it.pick===0;if(ok)r.c++;r.l=ok?1:0;save()}

function finish(){
  if(!Q||Q.done)return;
  Q.done=true; stopTick();
  if(Q.mode==='exam')Q.items.forEach(it=>{if(it.pick!==null)score(it);else{const r=rec(it.q.id);r.s++;r.l=0;save()}});
  const items=Q.mode==='exam'?Q.items:Q.items.filter(x=>x.pick!==null);
  const ok=items.filter(x=>x.pick===0).length, n=items.length, pct=n?Math.round(ok/n*100):0, pass=pct>=75;
  const secs=Math.floor((Date.now()-Q.t0)/1000);
  window.scrollTo(0,0);
  hdr.innerHTML='';
  const C=2*Math.PI*40;
  let h=`<div class="score"><svg class="dial" viewBox="0 0 96 96" role="img" aria-label="${pct}% correct">
    <circle cx="48" cy="48" r="40" fill="none" stroke="var(--panel-2)" stroke-width="9"/>
    <circle cx="48" cy="48" r="40" fill="none" stroke="${pass?'var(--good)':'var(--bad)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 48 48)"/>
    <text x="48" y="54" text-anchor="middle" font-weight="600" font-size="24" fill="var(--ink)">${pct}%</text></svg>
    <div><div class="verdict ${pass?'pass':'fail'}">${Q.mode==='exam'?(pass?'Pass':'Below 75%'):(pass?'Well done':'Keep going')}</div>
    <div class="small" style="margin-top:6px">${ok} of ${n} correct · ${fmt(secs)} ${Q.mode==='exam'?'· pass mark 75%':''}</div></div></div>
  <h2>Review</h2><div class="rlist">`;
  items.forEach(it=>{const q=it.q,good=it.pick===0;
    h+=`<div class="ritem ${good?'':'bad'}"><div class="meta"><span class="chip ref">${esc(q.r)}</span></div><p>${esc(q.q)}</p>
    ${good?'':`<div class="a">Your answer: <span>${it.pick===null?'Not answered':esc(q.o[it.pick])}</span></div>`}
    <div class="a">Correct: <span>${esc(q.o[0])}</span></div><div class="a" style="margin-top:4px">${esc(q.e)}</div></div>`});
  h+='</div>';
  app.innerHTML=h;
  const wrongIds=items.filter(x=>x.pick!==0).map(x=>x.q);
  barIn.innerHTML=`<button class="btn" id="hm">Home</button>${wrongIds.length?'<button class="btn primary" id="rw">Retry wrong ('+wrongIds.length+')</button>':''}`;
  $('#hm').onclick=home;
  if(wrongIds.length)$('#rw').onclick=()=>{Q={mode:'study',items:shuffle(wrongIds).map(q=>({q,order:shuffle([0,1,2,3]),pick:null})),i:0,t0:Date.now(),limit:0,done:false};show()};
}

function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);lsSet('maxqb.theme',nx)}
{const t=lsGet('maxqb.theme');if(t)document.documentElement.setAttribute('data-theme',t)}

document.addEventListener('keydown',e=>{
  if(!Q||Q.done)return;
  const k='1234'.indexOf(e.key);
  if(k>=0){const it=Q.items[Q.i];pick(it.order[k])}
  else if(e.key==='Enter'){const b=$('#next');if(b&&!b.disabled)b.click()}
});
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script>
