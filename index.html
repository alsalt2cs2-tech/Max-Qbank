<html lang="en"><head>

<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --ink:#14202e; --muted:#5b6778; --line:#d6dce4;
  --accent:#c98a00; --accent-ink:#1a1200; --accent-soft:#fbf0d4;
  --good:#1f8a4c; --good-soft:#e1f3e8; --bad:#c23b32; --bad-soft:#fbe5e3; --info:#1f5fa8;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1420; --panel:#142031; --panel-2:#1a2a3e; --ink:#e6edf5; --muted:#93a2b5; --line:#26374d;
  --accent:#f2b630; --accent-ink:#1a1200; --accent-soft:#3a2f12;
  --good:#4cc27e; --good-soft:#123222; --bad:#ff7a6e; --bad-soft:#3a1a18; --info:#6aa8ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1420; --panel:#142031; --panel-2:#1a2a3e; --ink:#e6edf5; --muted:#93a2b5; --line:#26374d;
  --accent:#f2b630; --accent-ink:#1a1200; --accent-soft:#3a2f12;
  --good:#4cc27e; --good-soft:#123222; --bad:#ff7a6e; --bad-soft:#3a1a18; --info:#6aa8ef; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);margin-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px}
.iconbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,.chap:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:16px 120px}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chaps{display:flex;flex-direction:column;gap:8px}
.chap{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.chap[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-ink)}
.chap[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chap .t{min-width:0}
.chap .n{font-weight:600;line-height:1.3}
.chap .m{font:12px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.bar{height:5px;border-radius:3px;background:var(--panel-2);margin-top:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .x{background:var(--bad)}
.chap .pct{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.chap .pct small{display:block;font:11px var(--mono);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:7px;padding:8px 10px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{display:flex;gap:10px;padding-block:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:13px 14px;font-weight:600;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--info);cursor:pointer;padding:0;font-size:13px;text-decoration:underline}
.qhead{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.chip.ref{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.qtext{font-size:17px;font-weight:500;line-height:1.45;text-wrap:pretty;margin:0}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;line-height:1.4}
.opt .k{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:600 14px var(--mono);background:var(--panel);border:1px solid var(--line)}
.opt.sel{border-color:var(--info)} .opt.sel .k{background:var(--info);color:#fff;border-color:var(--info)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--panel-2);border-left:3px solid var(--good);font-size:14px}
.expl.bad{border-left-color:var(--bad)}
.expl b{display:block;margin-bottom:3px}
.flag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timer{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.dial{width:96px;height:96px}
.verdict{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;border-left:3px solid var(--good)}
.ritem.bad{border-left-color:var(--bad)}
.ritem p{margin:0 0 6px;font-weight:500}
.ritem .a{font-size:13px;color:var(--muted)}
.ritem .a span{color:var(--ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:12px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<script>
window.__QBANK__={"version":2,"chapters":[{"id":"1A","name":"Maneuver Speeds, Thrust & Callouts","src":"FCTM","ref":"1.7 – 1.24"},{"id":"1B","name":"FPV, Cold Temp, Icing, FMC & RNP","src":"FCTM","ref":"1.24 – 1.37"},{"id":"1C","name":"Automation, HUD & Adverse Weather","src":"FCTM","ref":"1.38 – 1.47"},{"id":"2","name":"Ground Operations","src":"FCTM","ref":"2.1 – 2.17"},{"id":"3","name":"Takeoff & Initial Climb","src":"FCTM","ref":"3.1 – 3.39"},{"id":"4","name":"Climb & Cruise","src":"FCTM","ref":"4.1 – 4.15"},{"id":"4D","name":"Descent & Holding","src":"FCTM","ref":"4.16 – 4.22"},{"id":"5","name":"Approach & Missed Approach","src":"FCTM","ref":"5.1 – 5.84"},{"id":"6","name":"Landing","src":"FCTM","ref":"6.1 – 6.44"},{"id":"7","name":"Maneuvers","src":"FCTM","ref":"7.1 – 7.24"},{"id":"8","name":"Non-Normal Operations","src":"FCTM","ref":"8.1 – 8.54"},{"id":"SOP","name":"WY Company Procedures","src":"WY SOP","ref":"NP.60"}],"questions":[{"id":"1A-01","c":"1A","r":"FCTM 1.7","q":"What is the flap maneuver speed for Flaps 5?","o":["VREF40 + 30","VREF40 + 20","VREF40 + 50","VREF40 + 10"],"e":"UP +70, 1 +50, 5 +30, 10 +30, 15 +20, 25 +10, 30 = VREF30, 40 = VREF40."},{"id":"1A-02","c":"1A","r":"FCTM 1.7","q":"What is the flaps UP maneuver speed?","o":["VREF40 + 70","VREF40 + 50","VREF40 + 80","VREF30 + 70"],"e":"Flaps UP maneuver speed is VREF40 + 70 for all weights."},{"id":"1A-03","c":"1A","r":"FCTM 1.7","q":"What is the flap maneuver speed for Flaps 15?","o":["VREF40 + 20","VREF40 + 30","VREF40 + 10","VREF15"],"e":"Flaps 15 maneuver speed is VREF40 + 20."},{"id":"1A-04","c":"1A","r":"FCTM 1.7","q":"Which two flap settings share the same maneuver speed additive?","o":["Flaps 5 and Flaps 10 (VREF40 + 30)","Flaps 1 and Flaps 5 (VREF40 + 50)","Flaps 15 and Flaps 25 (VREF40 + 20)","Flaps 25 and Flaps 30 (VREF40 + 10)"],"e":"Flaps 5 and Flaps 10 both use VREF40 + 30."},{"id":"1A-05","c":"1A","r":"FCTM 1.7","q":"Flap maneuver speeds guarantee at least what bank capability to stick shaker near airport altitude?","o":["40° (25° bank + 15° overshoot)","30° (15° bank + 15° overshoot)","25° bank","60° bank"],"e":"Full maneuver capability is 1.3g, or 40° of bank (25° + 15° overshoot), to stick shaker."},{"id":"1A-06","c":"1A","r":"FCTM 1.8","q":"In 1g flight, the speed in the MIDDLE of the flaps-down amber band provides:","o":["Adequate maneuver capability, 30° (15° + 15° overshoot)","Full maneuver capability, 40°","Stick shaker activation","1.3g to low-speed buffet"],"e":"Top of band = full (40°), middle = adequate (30°), bottom = stick shaker for the current g load."},{"id":"1A-07","c":"1A","r":"FCTM 1.8","q":"The bottom of the amber band (top of the red and black tape) represents:","o":["Stick shaker activation speed for the current g load","Minimum maneuver speed","VREF","Adequate maneuver capability"],"e":"If g load increases while maneuvering, the stick shaker speed increases too."},{"id":"1A-08","c":"1A","r":"FCTM 1.9","q":"Above approximately 20,000 ft, the top of the flaps-up amber band shows:","o":["1.3g maneuver capability to low-speed buffet","40° bank to stick shaker","Adequate maneuver capability only","Mach buffet onset"],"e":"Up to ~10,000 ft it behaves like the flaps-down band; between 10,000 and 20,000 ft Mach effects reduce capability; above ~20,000 ft it shows 1.3g to low-speed buffet (or a value preset by maintenance)."},{"id":"1A-09","c":"1A","r":"FCTM 1.10","q":"In level, constant-speed flight, 1.3g corresponds to approximately:","o":["40° of bank","25° of bank","30° of bank","60° of bank"],"e":"1.1g ≈ 25°, 1.3g ≈ 40°, 2.0g ≈ 60°."},{"id":"1A-10","c":"1A","r":"FCTM 1.11","q":"Extending the landing gear reduces maneuver margin by the equivalent of:","o":["2 kt of airspeed or less","4 kt of airspeed or less","10 kt of airspeed","It has no effect"],"e":"Gear extension: ≤2 kt. Engine failure during flap retraction: ≤4 kt."},{"id":"1A-11","c":"1A","r":"FCTM 1.11","q":"An engine failure during flap retraction reduces maneuver margin by the equivalent of:","o":["4 kt of airspeed or less","2 kt of airspeed or less","10 kt of airspeed","15 kt of airspeed"],"e":"The loss of lift from the loss of thrust is equivalent to 4 kt or less."},{"id":"1A-12","c":"1A","r":"FCTM 1.11","q":"How do engine and wing anti-ice affect maneuver margin?","o":["Engine AI reduces flaps-down margin only; wing AI reduces both, and the effect remains until landing","Both reduce flaps-up and flaps-down margin until landing","Neither has any effect on maneuver margin","Wing AI reduces flaps-down margin only; the effect ends when switched off"],"e":"Engine AI's effect goes away when switched off. Wing AI's effect remains until landing. Flap retraction/extension speeds do not change, so margin is reduced."},{"id":"1A-13","c":"1A","r":"FCTM 1.11","q":"What is the effect of a temperature change on maneuver margin?","o":["Negligible","Margin decreases as temperature increases","Margin increases as temperature increases","Significant at high altitude airports"],"e":"Temperature effect is negligible; weight and altitude increases reduce margin."},{"id":"1A-14","c":"1A","r":"FCTM 1.14","q":"With the autothrottle engaged for landing, command speed is set to:","o":["VREF + 5 kt","VREF + half the headwind + gust","VREF + 10 kt","VREF"],"e":"The A/T adds thrust quickly and reduces it slowly, giving sufficient wind and gust protection."},{"id":"1A-15","c":"1A","r":"FCTM 1.14","q":"A/T disconnected, runway 36, wind 360/20 gusting 30. Approach speed?","o":["VREF + 15 kt (or landing flap placard − 5, if lower)","VREF + 20 kt","VREF + 10 kt","VREF + 25 kt"],"e":"Half of 20 = 10, plus gust 10 = 20, capped at VREF + 15 or flap placard − 5, whichever is lower."},{"id":"1A-16","c":"1A","r":"FCTM 1.15","q":"A/T disconnected, runway 36, wind 090/15 gusting 25. Approach speed?","o":["VREF + 10 kt","VREF + 5 kt","VREF + 15 kt","VREF + 17 kt"],"e":"A direct crosswind gives 0 steady additive, but the full 10 kt gust increment is added."},{"id":"1A-17","c":"1A","r":"FCTM 1.15","q":"With a steady tailwind or tailwind gusts, command speed is:","o":["VREF + 5 kt, A/T connected or disconnected","VREF + half the tailwind","VREF + full gust value","VREF"],"e":"Do not apply wind additives for steady tailwinds or tailwind gusts."},{"id":"1A-18","c":"1A","r":"FCTM 1.14","q":"To estimate half the steady headwind component with a 45° crosswind, use:","o":["35% of the reported wind","50% of the reported wind","25% of the reported wind","0%"],"e":"50% for a direct headwind, 35% for 45°, 0 for a direct crosswind."},{"id":"1A-19","c":"1A","r":"FCTM 1.16","q":"Flaps 15 landing with VREF ICE (VREF15 + 10) required. Wind additives should not exceed:","o":["5 kt","10 kt","15 kt","0 kt"],"e":"FCTM 1.16: with VREF ICE on a Flaps 15 landing, wind additives should not exceed 5 kt."},{"id":"1A-20","c":"1A","r":"FCTM 1.15","q":"A NNC says 'use VREF40 + 30'. A/T will be disconnected. Command speed is:","o":["(VREF40 + 30) + wind additive (min 5, max 15)","VREF40 + 30 only","VREF40 + 35 fixed","VREF40 + 30 + full gust, no maximum"],"e":"The NNC-adjusted VREF becomes the VREF; wind additives are then applied, minimum 5 and maximum 15 kt."},{"id":"1A-21","c":"1A","r":"FCTM 1.17","q":"On the 737-8/-9, which landing bugs are displayed after landing flaps/speed are entered?","o":["VREF and VREF + 20","VREF and VREF + 15","VREF and VREF + 5","VREF and VREF + 30"],"e":"737-7 shows VREF + 15; 737-8/-9 show VREF + 20."},{"id":"1A-22","c":"1A","r":"FCTM 1.17","q":"V2 provides at least what bank capability for all takeoff flaps?","o":["30° (15° + 15° overshoot)","40° (25° + 15° overshoot)","15°","25°"],"e":"V2 gives 30°; V2 + 15 gives 40°."},{"id":"1A-23","c":"1A","r":"FCTM 1.18","q":"With the FMC inoperative, V1, VR and VREF bugs are set using:","o":["The INFO switch on the Engine Display Control Panel","The MCP speed selector","The standby airspeed indicator knob","They cannot be set"],"e":"Refer to FCOM SP.10 for details."},{"id":"1A-24","c":"1A","r":"FCTM 1.18","q":"With the EECs in ALTERNATE mode, maximum thrust is obtained by:","o":["Advancing thrust levers to the full rated TO/GA limit; full forward only if terrain contact is imminent","Advancing thrust levers to the full forward stop","Setting 100% N1","Using the fixed derate limit"],"e":"In NORMAL mode, full forward gives maximum thrust. In ALTERNATE mode, full forward only if terrain contact is imminent."},{"id":"1A-25","c":"1A","r":"FCTM 1.19","q":"Nonessential conversation is not recommended below:","o":["10,000 ft MSL / FL100 (higher at high-altitude airports)","18,000 ft","Transition altitude","5,000 ft AGL"],"e":"Adjust the altitude upward at high-altitude airports."},{"id":"1A-26","c":"1A","r":"FCTM 1.20","q":"Below 500 ft AFE on approach, which GPWS voice callouts need NOT be acknowledged by the PF?","o":["Altitude callouts","All GPWS callouts","Warning callouts","'CONTINUE' / 'GO-AROUND' at minimums"],"e":"'CONTINUE'/'GO-AROUND' at minimums is not an altitude callout and is always made."},{"id":"1A-27","c":"1A","r":"FCTM 1.20","q":"If automatic callouts are not available, the PM may call out radio altitude at:","o":["100, 50 and 30 ft","500, 100 and 50 ft","50, 30 and 10 ft","1000 and 500 ft only"],"e":"This aids awareness of eye height at touchdown."},{"id":"1A-28","c":"1A","r":"FCTM 1.19","q":"If the PM does not make a required callout, the PF should:","o":["Make the callout","Ignore it if the airplane is stable","Disconnect the autopilot","Initiate a go-around"],"e":"Absence of a callout may indicate a system malfunction or pilot incapacitation."},{"id":"1B-01","c":"1B","r":"FCTM 1.24","q":"On final approach, the Flight Path Vector indicates:","o":["Flight path angle relative to the horizon, not glide path to the runway","Glide path relative to the runway","Pitch attitude, usable with the PLI","ILS glide slope deviation"],"e":"Use ILS/GLS, VASI/PAPI for glide path. Do not use the FPV with the PLI (pitch-referenced)."},{"id":"1B-02","c":"1B","r":"FCTM 1.24","q":"The FPV is displaced to the LEFT of the pitch scale. This indicates:","o":["Wind from the right, drift to the left","Wind from the left, drift to the right","Airplane below glide path","A headwind"],"e":"The FPV shows ground track relative to heading."},{"id":"1B-03","c":"1B","r":"FCTM 1.24","q":"The vertical flight path angle on the FPV should be considered unreliable when:","o":["Primary altitude displays are unreliable","The F/D is off","The autopilot is engaged","The map is in PLAN mode"],"e":"The FPV uses inertial and barometric altitude inputs."},{"id":"1B-04","c":"1B","r":"FCTM 1.25","q":"The VSD decision gates that help achieve a stabilized approach are at:","o":["1,000 ft and 500 ft","1,500 ft and 1,000 ft","500 ft and 100 ft","2,000 ft and 1,000 ft"],"e":"For a visual approach without a published GP angle, a 3° reference line is displayed."},{"id":"1B-05","c":"1B","r":"FCTM 1.25","q":"The green dot (range-to-target speed) on the VSD shows:","o":["Where excess speed will be dissipated along the vertical path","Top of descent","The FAF position","The point where flaps must be extended"],"e":"If excess speed is not an issue, the symbol does not appear."},{"id":"1B-06","c":"1B","r":"FCTM 1.26","q":"When OAT is colder than ISA:","o":["True altitude is lower than indicated","True altitude is higher than indicated","There is no error if QNH is set","Error only exists above transition altitude"],"e":"The error grows with height above the altimeter source and can exceed 1,000 ft in very cold temperatures."},{"id":"1B-07","c":"1B","r":"FCTM 1.26","q":"Outside published temperature limits, with cold temperature corrections applied, an airplane with uncompensated Baro-VNAV may:","o":["Descend to the corrected LNAV (MDA) minima","Use LNAV/VNAV DA as published","Not fly any RNAV approach","Apply hot temperature corrections instead"],"e":"LNAV/VNAV minima are prohibited outside limits. Corrected LNAV/VNAV only with the Temperature Compensation option and approved procedures. No hot temperature correction exists."},{"id":"1B-08","c":"1B","r":"FCTM 1.26","q":"Cold temperature corrections should be considered especially at:","o":["−30°C or colder (sometimes between 0°C and −30°C)","0°C or colder only","−10°C or colder","−50°C only"],"e":"Use SP.16 or SP.11, particularly near high terrain."},{"id":"1B-09","c":"1B","r":"FCTM 1.27","q":"Ice crystal icing engine power loss typically occurs:","o":["At high altitude in cloud above convective weather, often with little or no radar return","At low altitude in freezing rain","Only when airframe ice is visible","During ground de-icing"],"e":"Ice crystals melt and accrete inside the engine; when shed they can cause surge, flameout or high vibration."},{"id":"1B-10","c":"1B","r":"FCTM 1.28","q":"Repeated approaches and touch-and-go landings in icing conditions can cause:","o":["Fan blade damage from ice shedding off unheated surfaces","Static port blockage","Brake overheating","Pitot heat failure"],"e":"Ice accumulations exceed those of typical revenue flights."},{"id":"1B-11","c":"1B","r":"FCTM 1.28","q":"Small out-of-trim conditions with no spoilers deflected affect fuel flow by:","o":["Less than 1%","About 3%","About 5%","More than 10%"],"e":"Spoiler deflection from control wheel displacement causes a significant drag increase."},{"id":"1B-12","c":"1B","r":"FCTM 1.29","q":"Primary rudder trim technique: A/P in HDG SEL, stable for 30 s, wheel low on the left. You:","o":["Trim rudder left until the control wheel is level","Trim rudder right until the bank pointer is zero","Use aileron trim to level the wheel","Disconnect the A/P and center the slip indicator"],"e":"Trim toward the low side of the wheel until it reads zero index. A slight forward slip is acceptable."},{"id":"1B-13","c":"1B","r":"FCTM 1.29","q":"Which step is part of the ALTERNATE rudder trim technique only?","o":["Verify rudder trim is zero, then trim until the bank pointer shows zero","Set symmetrical thrust","Balance fuel","A/P in HDG SEL for 30 s"],"e":"After A/P disengagement, aileron trim is applied, and should be completed before final approach."},{"id":"1B-14","c":"1B","r":"FCTM 1.30","q":"In flight, FMC CDU changes should be:","o":["Made by the PM and executed after PF confirmation","Made and executed by the PF","Made by either pilot without crosscheck","Prohibited below FL100"],"e":"In preflight, all entries made by one pilot are verified by the other."},{"id":"1B-15","c":"1B","r":"FCTM 1.30","q":"Minor differences between charted magnetic tracks and FMC tracks are:","o":["Operationally acceptable (FMC uses a magnetic variation lookup table)","A reason to reject the procedure","A sign of a corrupt database","Corrected by entering true tracks"],"e":"Chart designers apply local magnetic variation."},{"id":"1B-16","c":"1B","r":"FCTM 1.31","q":"With gear down after a non-normal, which FMC function remains usable?","o":["VNAV PTH for the approach","Fuel remaining predictions","Holding time available","Altitude capability"],"e":"Predictions assume clean configuration. Gear-down performance is in the QRH PI chapter."},{"id":"1B-17","c":"1B","r":"FCTM 1.32","q":"RNP 10 routes are acceptable for a non-GPS FMC if the last radio update was within:","o":["6 hours","2 hours","1 hour","12 hours"],"e":"Oceanic operations also require dual navigation systems."},{"id":"1B-18","c":"1B","r":"FCTM 1.33","q":"European P-RNAV terminal procedures require:","o":["RNP 1.0","RNP 5.0","RNP 2.0","RNP 0.3"],"e":"B-RNAV en route is RNP 5.0."},{"id":"1B-19","c":"1B","r":"FCTM 1.34","q":"With DME-DME updating only (no GPS), all Boeing FMCs have an approach capability of:","o":["RNP 0.5","RNP 0.1","RNP 0.3","RNP 1.0"],"e":"Approach RNPs can be as low as 0.10 NM with appropriate equipment."},{"id":"1B-20","c":"1B","r":"FCTM 1.35","q":"If the crew manually enters an RNP LARGER than the procedure requires:","o":["Alerting may occur at the wrong value, so the required RNP could be exceeded without an alert","Nuisance alerts will occur","ANP decreases automatically","There is no effect"],"e":"A smaller RNP causes nuisance alerts; a larger RNP is the dangerous case."},{"id":"1B-21","c":"1B","r":"FCTM 1.36","q":"Without NPS, during RNP operations, XTK should normally not exceed:","o":["1.0 × RNP, and excessive XTK generates no crew alert","0.5 × RNP, with an amber alert","2.0 × RNP, with an EICAS alert","The ANP value"],"e":"The PM monitors the PROGRESS page and notifies the PF."},{"id":"1B-22","c":"1B","r":"FCTM 1.36","q":"For RNP operations, route width is normally at least:","o":["2.0 × RNP either side of the LNAV course","1.0 × RNP either side","0.5 × RNP either side","4 NM either side"],"e":"Required width is set by terrain or traffic clearance."},{"id":"1B-23","c":"1B","r":"FCTM 1.36","q":"'UNABLE REQD NAV PERF – RNP' during an RNP approach, no visual reference. Action?","o":["Change to a non-RNP procedure; if unable, go around","Continue; ANP is advisory","Enter a larger RNP to clear the message","Switch to F/D only"],"e":"The alert means ANP > RNP."},{"id":"1B-24","c":"1B","r":"FCTM 1.37","q":"If the autopilot is unavailable for an RNP operation, use the F/D and ND cues with at least one map set to:","o":["10 NM or less","20 NM or less","40 NM or less","5 NM exactly"],"e":"Use the position trend vector, airplane symbol and digital cross-track deviation."},{"id":"1B-25","c":"1B","r":"FCTM 1.37","q":"During an RNAV approach with a coded glide path angle, the required pitch mode is:","o":["VNAV PTH","V/S","LVL CHG","VNAV SPD"],"e":"These procedures show only LNAV/VNAV minima and do not allow LNAV only."},{"id":"1B-26","c":"1B","r":"FCTM 1.37","q":"Go-around while on an RF leg. Key action:","o":["Immediately re-select LNAV (or verify it re-engaged); GA roll mode is track hold","Keep GA roll mode; it tracks the RF path","Select HDG SEL to runway heading","Use INTC ARC"],"e":"Fly the LNAV course by the map until LNAV engages."},{"id":"1B-27","c":"1B","r":"FCTM 1.37","q":"Which statement about RF legs is correct?","o":["Direct To or Intercept to the second waypoint of an RF leg deletes the RF leg","A procedure may begin with Direct To an RF leg","RF leg maximum speeds are advisory only","Tailwind has no effect on RF tracking"],"e":"Max speeds are critical: high ground speed can reach the bank limit. A TF leg normally precedes an RF leg."},{"id":"1B-28","c":"1B","r":"FCTM 1.37","q":"After a temporary FMC loss, the active RF leg appears after a discontinuity. To capture it:","o":["Activate and EXEC, then use INTC ARC","Use Direct To the RF end point","Select HDG SEL and rejoin later","Re-enter the procedure manually as waypoints"],"e":"INTC ARC is needed to achieve LNAV capture of the RF leg, if the situation permits."},{"id":"1C-01","c":"1C","r":"FCTM 1.38","q":"In non-WGS-84 airspace, the AFM requires the crew to:","o":["Inhibit GPS updating for approaches, unless other appropriate procedures are used","Inhibit GPS updating for all phases","Use GPS only en route above FL290","Select DME-DME off"],"e":"GPS updating is acceptable for SIDs, STARs and en route navigation."},{"id":"1C-02","c":"1C","r":"FCTM 1.38","q":"The terrain display is recommended at all times in:","o":["A non-radar environment","Cruise above FL250","Daylight VMC","Oceanic airspace only"],"e":"Also at night, in IMC, and on departure/approach near terrain."},{"id":"1C-03","c":"1C","r":"FCTM 1.39","q":"The autopilot should only be engaged when:","o":["The airplane is in trim, F/D commands are satisfied and the flight path is under control","Above 1,000 ft AGL","The F/D is off","Speed is above flaps-up maneuver speed"],"e":"The A/P is not designed to correct significant out-of-trim or recover unusual attitudes."},{"id":"1C-04","c":"1C","r":"FCTM 1.39","q":"Outside takeoff and climb, autothrottle use is recommended:","o":["Only when the autopilot is engaged in CMD","At all times","Only during approach","Never in manual flight"],"e":"A/T is recommended for takeoff and climb in either automatic or manual flight."},{"id":"1C-05","c":"1C","r":"FCTM 1.39","q":"During engine-out operations Boeing recommends:","o":["Disconnecting the A/T and keeping the inoperative engine's thrust lever at CLOSE","Keeping the A/T engaged in SPD mode","Using A/T ARM mode","Matching both thrust levers"],"e":"This helps recognize the inoperative engine and avoids unexpected thrust changes."},{"id":"1C-06","c":"1C","r":"FCTM 1.39","q":"Why is autothrottle ARM mode normally not recommended?","o":["It provides only minimum speed protection, with no gust protection, and can be confusing","It disables TO/GA","It increases fuel burn significantly","It disconnects the autopilot"],"e":"Do not use A/T ARM with Non-Normal Checklists."},{"id":"1C-07","c":"1C","r":"FCTM 1.41","q":"When VNAV is not used, the preferred mode for an altitude change of 1,000 ft or more is:","o":["LVL CHG","V/S","ALT HOLD","CWS P"],"e":"V/S is preferred for changes of less than 1,000 ft."},{"id":"1C-08","c":"1C","r":"FCTM 1.42","q":"Normal MCP altitude technique, VNAV climb on a SID. Which constraints are set in the MCP?","o":["Maximum or hard altitude constraints","Every minimum crossing altitude","Only the final cleared altitude","Only 'at or above' constraints"],"e":"The FMC alerts the crew if minimum altitude constraints will not be met."},{"id":"1C-09","c":"1C","r":"FCTM 1.42","q":"Alternate MCP altitude technique (operator approved), arrival with closely spaced constraints. Initially set:","o":["The lowest closely spaced constraint or the FAF altitude, whichever is higher","The next constraint","The FAF altitude always","The highest constraint"],"e":"For departures, set the highest of the closely spaced constraints."},{"id":"1C-10","c":"1C","r":"FCTM 1.43","q":"AFDS modes do not respond to MCP selections. First corrective action?","o":["Disengage the A/P and set both F/D switches OFF, then re-engage","Pull the MCP circuit breaker","Select the other autopilot","Switch to CWS"],"e":"This clears all modes; default pitch/roll modes engage on re-engagement."},{"id":"1C-11","c":"1C","r":"FCTM 1.44","q":"Suggested alternate for an inoperative G/S mode on an ILS:","o":["V/S, monitoring glide slope raw data","LVL CHG","VNAV PTH","ALT HOLD"],"e":"LNAV inop → HDG SEL; VOR/LOC inop → HDG SEL with raw data."},{"id":"1C-12","c":"1C","r":"FCTM 1.44","q":"Suggested alternate for an inoperative VNAV PTH in cruise:","o":["ALT HOLD (or LVL CHG to transition to it)","V/S","CWS P","TO/GA"],"e":"VNAV PTH on approach → V/S referencing glidepath."},{"id":"1C-13","c":"1C","r":"FCTM 1.45","q":"The HUD horizon line is aligned with the actual horizon:","o":["Only at 0 ft AGL","At all altitudes","Only above FL100","Only in cruise"],"e":"Separation grows with altitude because of the Earth's curvature."},{"id":"1C-14","c":"1C","r":"FCTM 1.45","q":"Which statement about HUD annunciations is correct?","o":["Armed modes may not be annunciated on the HUD","HUD shows more modes than the FMA","HUD annunciations replace the FMA","HUD does not show any F/D modes"],"e":"Otherwise HUD annunciations are similar to the FMA."},{"id":"1C-15","c":"1C","r":"FCTM 1.45","q":"Which type of pilot incapacitation is the most dangerous and most frequent?","o":["Subtle incapacitation","Sudden death","Obvious unconsciousness","Incapacitation during cruise"],"e":"Failure to respond to a second request or checklist response is cause for investigation."},{"id":"1C-16","c":"1C","r":"FCTM 1.46","q":"After confirming pilot incapacitation and ensuring control, the next action is to:","o":["Engage the autopilot to reduce workload","Declare an emergency first","Call the cabin crew first","Begin descent immediately"],"e":"Then declare an emergency, use cabin crew, prepare for landing."},{"id":"1C-17","c":"1C","r":"FCTM 1.46","q":"If moderate to heavy rain, hail or sleet is encountered:","o":["Reduce airspeed and maintain an increased minimum thrust; consider the APU","Increase airspeed to pass through quickly","Reduce thrust to flight idle","Select engine anti-ice OFF"],"e":"Higher minimum thrust improves engine tolerance and stall margin."},{"id":"1C-18","c":"1C","r":"FCTM 1.47","q":"In severe turbulence during manual flight, after trimming for penetration speed:","o":["Do not change pitch trim; maintain attitude and let altitude and speed vary","Re-trim continuously to hold altitude","Use large control inputs to hold altitude","Extend flaps to increase margin"],"e":"Do not let airspeed remain below penetration speed."},{"id":"1C-19","c":"1C","r":"FCTM 1.47","q":"In an area of known turbulence, flap extension should be:","o":["Delayed as long as possible","Done early to reduce speed","Done at the turbulence penetration speed","Avoided only above FL200"],"e":"The airplane withstands higher gust loads with flaps up."},{"id":"2-01","c":"2","r":"FCTM 2.1","q":"Why are static port obstructions by ice particularly hazardous?","o":["Static ports are not heated by probe heat, and clear ice is hard to detect","Probe heat melts the ice into water","They only affect the standby instruments","They cause engine surge"],"e":"Erroneous airspeed and altitude may appear after takeoff."},{"id":"2-02","c":"2","r":"FCTM 2.2","q":"FLT ALT on the pressurization panel should be set to:","o":["The final planned cruise altitude","An intermediate altitude, reset during climb","The first cleared altitude","Field elevation"],"e":"Intermediate settings raise cabin altitude and workload."},{"id":"2-03","c":"2","r":"FCTM 2.2","q":"If the airplane climbs above the selected FLT ALT and the cabin reaches maximum differential pressure:","o":["Cabin rate of climb equals airplane rate of climb","The outflow valve closes fully and cabin stays constant","Cabin altitude descends","Pressurization switches to MANUAL"],"e":"This is why FLT ALT should be set to the final cruise altitude."},{"id":"2-04","c":"2","r":"FCTM 2.3","q":"Who is usually injured or killed in pushback and towing accidents?","o":["The headset operator walking near the nose wheels","The tug driver","The wing walker","The flight crew"],"e":"Procedures without personnel near the nose wheels reduce the risk."},{"id":"2-05","c":"2","r":"FCTM 2.3","q":"Pushback is normally accomplished with:","o":["All hydraulic systems pressurized and nose wheel steering locked out","Hydraulics depressurized","Nose wheel steering active","Parking brake set"],"e":"Do not taxi until the marshaller indicates the airplane is clear."},{"id":"2-06","c":"2","r":"FCTM 2.6","q":"Normal taxi speed is approximately:","o":["20 kt","10 kt","30 kt","15 kt"],"e":"Up to 30 kt on long straight taxiways; about 10 kt for sharp turns."},{"id":"2-07","c":"2","r":"FCTM 2.10","q":"Except for turns less than about 30°, speed prior to turn entry should be:","o":["10 kt or less","15 kt or less","20 kt or less","5 kt or less"],"e":"The main gear tracks inside the nose gear."},{"id":"2-08","c":"2","r":"FCTM 2.6","q":"Some taxi speeds, usually between 10 and 20 kt, may cause increased vibration. The fix is:","o":["A slight increase or decrease in speed","Stopping and restarting the taxi","Applying light brakes continuously","Using rudder pedal steering only"],"e":"This improves passenger comfort, especially on rough taxiways."},{"id":"2-09","c":"2","r":"FCTM 2.7","q":"Carbon brake wear depends primarily on:","o":["The number of brake applications","Brake temperature","Taxi speed","Aircraft weight"],"e":"One firm application causes less wear than several light ones."},{"id":"2-10","c":"2","r":"FCTM 2.7","q":"Long taxi distances with continuous light brake pressure can:","o":["Melt the wheel fuse plugs and deflate the tires","Improve carbon brake life","Cause antiskid failure","Overheat the engines"],"e":"Brake to about 10 kt, then release to let the brakes cool."},{"id":"2-11","c":"2","r":"FCTM 2.7","q":"With antiskid inoperative, taxi speed should be adjusted to:","o":["Allow very light braking","Allow moderate braking","No more than 5 kt","Allow differential braking only"],"e":"Moderate to heavy braking can cause tire damage or blowouts."},{"id":"2-12","c":"2","r":"FCTM 2.5","q":"Backing the airplane with reverse thrust is:","o":["Not recommended","Permitted at idle reverse","Permitted with ground crew guidance","Required for powerback stands"],"e":"During taxi, only momentary idle reverse on slippery surfaces for control."},{"id":"2-13","c":"2","r":"FCTM 2.7","q":"Use of reverse thrust above reverse idle during taxi:","o":["Is not recommended due to FOD and engine surge","Is recommended on slippery surfaces","Is acceptable below 10 kt","Is required to stop on ice"],"e":"Consider towing rather than extended use of reverse thrust."},{"id":"2-14","c":"2","r":"FCTM 2.9","q":"During a turn, the main gear tracks:","o":["Inside the nose gear, so the nose gear must be steered outside the path","Outside the nose gear","Exactly in the nose gear track","Inside only on turns greater than 90°"],"e":"The smaller the radius, the greater the need to oversteer."},{"id":"2-15","c":"2","r":"FCTM 2.10","q":"On the 737-8, the pilot seat is how far ahead of the main gear?","o":["56 ft (17.1 m)","49 ft (14.9 m)","62 ft (18.9 m)","5.25 ft (1.6 m)"],"e":"737-7: 49 ft; 737-9: 62 ft. Seat ahead of nose gear: 5.25 ft for all."},{"id":"2-16","c":"2","r":"FCTM 2.10","q":"For turns of 90° or more, initiate the turn when the intersecting centerline approaches:","o":["The center of the number 3 window","The nose of the airplane","The number 1 window","The wing tip"],"e":"Initially use approximately full nose wheel steering wheel displacement."},{"id":"2-17","c":"2","r":"FCTM 2.12","q":"Minimum-radius 180° turn technique:","o":["Stop, full tiller, release brakes, thrust on the outboard engine only, 5–10 kt","Keep rolling at 15 kt with both engines","Use differential braking at 10 kt","Use reverse thrust on the inboard engine"],"e":"Light intermittent braking on the inside main gear helps reduce the radius."},{"id":"2-18","c":"2","r":"FCTM 2.12","q":"During a minimum-radius 180° turn, which gear leaves the pavement first?","o":["The nose gear","The outboard main gear","The inboard main gear","Both main gears together"],"e":"Monitor the nose gear track closely."},{"id":"2-19","c":"2","r":"FCTM 2.13","q":"Minimum-radius 180° turn maneuvering is normally only required on runways narrower than:","o":["148 ft (45 m)","200 ft (60 m)","100 ft (30 m)","164 ft (50 m)"],"e":"Turnaround configurations are shown for circular and hammerhead pads."},{"id":"2-20","c":"2","r":"FCTM 2.16","q":"A 'slippery' surface is defined as:","o":["Any surface where braking capability is less than that of a dry surface","Only ice or compacted snow","Standing water deeper than 3 mm","Braking action 'poor' or worse"],"e":"Wet, ice, standing water, slush and snow are all slippery."},{"id":"2-21","c":"2","r":"FCTM 2.16","q":"Taxiing through slush in low temperatures, or with precipitation below freezing, you should:","o":["Taxi with flaps up","Taxi with takeoff flaps set","Use reverse idle continuously","Keep engine anti-ice off"],"e":"Prolonged taxi in heavy snow may require de-icing before takeoff."},{"id":"2-22","c":"2","r":"FCTM 2.16","q":"FAA airports with takeoff/landing minima below what RVR must have a low-visibility taxi plan?","o":["1,200 ft (350 m)","600 ft (175 m)","1,800 ft (550 m)","2,400 ft (800 m)"],"e":"Know stop bars, ILS critical areas and low-visibility taxi routes."},{"id":"2-23","c":"2","r":"FCTM 2.16","q":"On slippery surfaces, which may be more effective than nose wheel steering?","o":["Differential braking","Large tiller inputs","Reverse thrust above idle","Higher taxi speed"],"e":"Near turn completion, both engines to idle reduce nose gear skidding."},{"id":"3-01","c":"3","r":"FCTM 3.4","q":"Rolling takeoff technique: thrust levers are first advanced to approximately:","o":["40% N1, stabilize momentarily, then TO/GA","70% N1","60% N1","Directly to takeoff thrust"],"e":"Symmetrical thrust is more important than the exact initial value."},{"id":"3-02","c":"3","r":"FCTM 3.5","q":"Allowing engines to stabilize for more than about how long before advancing to takeoff thrust may affect takeoff distance?","o":["2 seconds","5 seconds","10 seconds","1 second"],"e":"A brief pause gives uniform acceleration and reduces directional control problems."},{"id":"3-03","c":"3","r":"FCTM 3.5","q":"Target takeoff N1 should be set by:","o":["60 kt","80 kt","40 kt","V1"],"e":"Minor increases may be made immediately after 60 kt."},{"id":"3-04","c":"3","r":"FCTM 3.5","q":"An engine exceedance occurs after thrust is set and you continue the takeoff. When may the thrust lever be retarded?","o":["At a minimum of 400 ft AGL with acceptable airspeed","Immediately","After V1","After flaps up"],"e":"Retarding thrust after it is set invalidates takeoff performance."},{"id":"3-05","c":"3","r":"FCTM 3.5","q":"The rudder becomes effective between:","o":["40 and 60 kt","60 and 80 kt","20 and 40 kt","80 and 100 kt"],"e":"Keep the airplane on centerline with rudder pedal steering and rudder."},{"id":"3-06","c":"3","r":"FCTM 3.5","q":"Regardless of who is PF, the captain keeps a hand on the thrust levers until:","o":["V1","VR","80 kt","Positive rate"],"e":"After V1 the captain's hand is removed."},{"id":"3-07","c":"3","r":"FCTM 3.6","q":"After THR HLD, takeoff N1 should stabilize within:","o":["±2% N1, adjusted by the PM to −0% / +1%","±5% N1","±1% N1 exactly","±4% N1"],"e":"A momentary overshoot of 4% N1 may occur."},{"id":"3-08","c":"3","r":"FCTM 3.6","q":"A takeoff into a headwind of 20 kt or more may result in:","o":["THR HLD before the A/T makes final thrust adjustments","A/T disconnect","N1 overshoot of 10%","Loss of THR HLD"],"e":"The PM adjusts thrust manually if required."},{"id":"3-09","c":"3","r":"FCTM 3.7","q":"Normal all-engine rotation is a smooth continuous rotation at VR toward:","o":["15° pitch at 2–3°/s","10° pitch at 3–4°/s","12° pitch at 1–2°/s","20° pitch at 3°/s"],"e":"Liftoff attitude is reached in about 3–4 seconds."},{"id":"3-10","c":"3","r":"FCTM 3.7","q":"Which is correct about rotation technique?","o":["Stabilizer trim is not recommended and the F/D is not used for rotation","Follow the F/D pitch bar for rotation","Trim nose-up during rotation","Increase control forces on longer fuselages"],"e":"Use the attitude indicator as the primary pitch reference after liftoff."},{"id":"3-11","c":"3","r":"FCTM 3.11","q":"A rotation rate 1°/s slower than normal increases the distance to 35 ft by up to:","o":["1,000 ft","200 ft","500 ft","2,000 ft"],"e":"Rotating to 5° less than target adds up to 200 ft."},{"id":"3-12","c":"3","r":"FCTM 3.11","q":"If rotation is delayed beyond V2 + 20, the F/D commands:","o":["Rotation speed, up to a maximum of V2 + 25","V2 + 20","V2","V2 + 15"],"e":"Either early or late rotation degrades takeoff performance."},{"id":"3-13","c":"3","r":"FCTM 3.9","q":"Tail strike pitch attitude (wheels on runway, struts extended) for the 737-8:","o":["11.0°","13.4°","10.0°","12.5°"],"e":"737-7: 13.4°, 737-9: 10.0°."},{"id":"3-14","c":"3","r":"FCTM 3.10","q":"Which takeoff flap settings have the least tail clearance?","o":["Flaps 1 and 5","Flaps 15 and 25","Flaps 10 and 15","Flaps 25 only"],"e":"Consider a larger flap setting for takeoffs at light weights."},{"id":"3-15","c":"3","r":"FCTM 3.12","q":"With CG at or near the aft limit, forward column pressure is maintained until:","o":["80 kt","60 kt","V1","VR"],"e":"Use reduced thrust and a rolling takeoff at light weight and aft CG."},{"id":"3-16","c":"3","r":"FCTM 3.12","q":"When operating with an alternate forward CG limit:","o":["FMC and QRH takeoff speeds are not valid","FMC speeds remain valid","VR must be increased by 10 kt","Only ATM takeoffs are allowed"],"e":"Speeds come from alternate forward CG data from dispatch or flight operations."},{"id":"3-17","c":"3","r":"FCTM 3.13","q":"The rolling takeoff procedure is strongly advised when crosswinds exceed ___ or tailwinds exceed ___:","o":["20 kt / 10 kt","15 kt / 5 kt","25 kt / 10 kt","30 kt / 15 kt"],"e":"Engine surge can occur if takeoff thrust is set before brake release."},{"id":"3-18","c":"3","r":"FCTM 3.15","q":"Takeoff crosswind guideline on a dry runway (RWYCC 6):","o":["36 kt (34 kt with winglets)","40 kt","33 kt","25 kt"],"e":"Guidelines are not limitations."},{"id":"3-19","c":"3","r":"FCTM 3.15","q":"Takeoff crosswind guideline for RWYCC 3 (Medium):","o":["20 kt","25 kt","15 kt","22 kt"],"e":"5 Good 25 · 4 Good-Medium 22 · 3 Medium 20 · 2 Medium-Poor 15 · 1 Poor 13."},{"id":"3-20","c":"3","r":"FCTM 3.15","q":"Takeoff crosswind guideline for RWYCC 1 (Poor):","o":["13 kt","15 kt","10 kt","20 kt"],"e":"RWYCC 0 (Nil): no takeoff."},{"id":"3-21","c":"3","r":"FCTM 3.13","q":"Crosswind guidelines assume wind measured at:","o":["33 ft (10 m) on runways 148 ft (45 m) or wider","50 ft on any runway","Surface level on 60 m runways","The runway midpoint at 2 m"],"e":"They are based on light weight and aft CG with an engine-out RTO."},{"id":"3-22","c":"3","r":"FCTM 3.15","q":"Why should control wheel displacement be limited during a crosswind takeoff?","o":["Excessive wheel raises spoilers, increasing drag and reducing tail clearance","It causes engine surge","It disengages the autothrottle","It increases VMCG"],"e":"Use only enough wheel to keep the wings approximately level."},{"id":"3-23","c":"3","r":"FCTM 3.16","q":"In strong crosswinds, VR may be increased, but not beyond:","o":["Actual gross weight VR + 20 kt","VR + 10 kt","V2 + 15 kt","VR + 30 kt"],"e":"Set V-speeds for actual weight; rotate at the higher speed."},{"id":"3-24","c":"3","r":"FCTM 3.17","q":"If windshear is suspected, the recommended takeoff thrust is:","o":["Full rated takeoff thrust (unless a fixed derate is required for dispatch)","Maximum ATM","CLB-1","Fixed derate"],"e":"Reduced thrust is normally used whenever performance permits."},{"id":"3-25","c":"3","r":"FCTM 3.17","q":"Which statement about an ATM (assumed temperature) takeoff is correct?","o":["It is not an operating limit; thrust levers may be advanced to full rated thrust at any time","It is an operating limit; never advance","It is permitted on runways with slush","VMCG is based on the reduced thrust"],"e":"VMCG and VMCA are based on full rated takeoff thrust."},{"id":"3-26","c":"3","r":"FCTM 3.17","q":"ATM reduced thrust is NOT permitted:","o":["On a runway contaminated with standing water, slush, snow or ice","On a wet runway with wet data","At night","With crosswinds above 10 kt"],"e":"Fixed derate may be used on contaminated runways."},{"id":"3-27","c":"3","r":"FCTM 3.18","q":"Engine failure during a fixed derate takeoff. Should thrust be increased on the operating engine?","o":["No, unless the captain judges terrain clearance cannot be assured","Yes, always to full rated thrust","Yes, to maximum continuous","Only above 400 ft"],"e":"Takeoff speeds consider VMCG/VMCA only at the derated thrust level."},{"id":"3-28","c":"3","r":"FCTM 3.18","q":"Why may a fixed derate permit a higher takeoff weight on a contaminated runway?","o":["It lowers VMCG","It shortens accelerate-stop distance","It increases tire speed limit","It improves climb gradient"],"e":"Fixed derate may also permit a lower weight when limited by minimum takeoff weight."},{"id":"3-29","c":"3","r":"FCTM 3.19","q":"Below 800 ft RA in THR HLD, pushing TO/GA a second time:","o":["Sets the reference N1 bugs to full GA thrust","Advances the thrust levers to full GA","Disconnects the A/T","Engages GA pitch mode"],"e":"Above 800 ft RA, pushing TO/GA advances the levers to full GA thrust."},{"id":"3-30","c":"3","r":"FCTM 3.20","q":"With takeoff guidance and CAT III centerline lighting, takeoff may be authorized with RVR as low as:","o":["300 ft (75 m)","500 ft (150 m)","600 ft (175 m)","1,200 ft (350 m)"],"e":"With training and lighting only: 500 ft (150 m)."},{"id":"3-31","c":"3","r":"FCTM 3.21","q":"On an icy runway, if centerline deviations cannot be controlled before the rudder becomes effective:","o":["Reject the takeoff immediately","Apply differential thrust and continue","Continue and correct after V1","Increase thrust to full"],"e":"Hold forward column pressure below ~80 kt for nose wheel steering."},{"id":"3-32","c":"3","r":"FCTM 3.22","q":"The takeoff field length is the longest of accelerate-go, accelerate-stop, and:","o":["1.15 × the all-engine distance to 35 ft","1.67 × the all-engine distance","The balanced field length + 10%","Accelerate-stop with reverse thrust"],"e":"Engine failure or event is assumed 1 second before V1."},{"id":"3-33","c":"3","r":"FCTM 3.22","q":"The AFM accelerate-stop distance includes:","o":["Speedbrakes and maximum braking, but not reverse thrust","Reverse thrust and autobrake RTO","Only wheel brakes at 3/4 pressure","Reverse thrust only"],"e":"Operationally, reverse thrust and autobrakes are recommended."},{"id":"3-34","c":"3","r":"FCTM 3.23","q":"To increase a brake-energy-limited weight, use:","o":["A minimum V1 policy","A maximum V1 policy","Improved climb","Clearway"],"e":"Max V1 → obstacle limit; improved climb → climb/obstacle; clearway/stopway → field/obstacle."},{"id":"3-35","c":"3","r":"FCTM 3.24","q":"Below approximately 80 kt, the takeoff should be rejected for:","o":["Any event undesirable for continued takeoff, e.g. master caution, unusual vibration, tire failure","Engine failure or fire only","Only warnings with an aural alert","Nothing; continue to V1"],"e":"RTO energy is proportional to the square of velocity."},{"id":"3-36","c":"3","r":"FCTM 3.24","q":"V-speeds are not displayed during the takeoff roll and there are no other faults. Action?","o":["Continue; PM calls V1/VR; if VR unknown, rotate 5–10 kt before V2","Reject the takeoff","Continue and rotate at V2","Reject only above 80 kt"],"e":"Missing V-speeds alone do not meet the RTO criteria."},{"id":"3-37","c":"3","r":"FCTM 3.25","q":"During any rejected takeoff, the autothrottle should be:","o":["Disconnected as the thrust levers are moved to idle","Left engaged","Set to ARM","Disconnected only after stopping"],"e":"Before THR HLD, levers would advance again when released if the A/T is not disconnected."},{"id":"3-38","c":"3","r":"FCTM 3.25","q":"If rejecting the takeoff due to fire in windy conditions, position the airplane so the fire is:","o":["On the downwind side","On the upwind side","Facing the terminal","Directly behind the airplane"],"e":"Also consider fuse plug melting after high-energy RTOs."},{"id":"3-39","c":"3","r":"FCTM 3.25","q":"Per 14 CFR Part 25, V1 is:","o":["The maximum speed at which the first action to stop must be taken","The speed at which the decision to stop begins","The speed at which brakes become effective","The minimum rotation speed"],"e":"It is also the minimum speed to continue after an engine failure and reach the required height."},{"id":"3-40","c":"3","r":"FCTM 3.26","q":"An engine fails 2 s before V1 and the crew continues. Height at the runway end (runway-limited) is about:","o":["15–20 ft","35 ft","0 ft","50 ft"],"e":"With all engines, the airplane would reach about 150 ft."},{"id":"3-41","c":"3","r":"FCTM 3.27","q":"Initiating an RTO 2 seconds after V1 (dry) results in about:","o":["+690 ft (210 m) overrun at about 75 kt","+250 ft at 50 kt","+120 ft at 35 kt","No overrun"],"e":"Late RTO initiation is the leading cause of runway excursions."},{"id":"3-42","c":"3","r":"FCTM 3.28","q":"Using dry runway performance on a wet runway (RTO) results in about:","o":["+1,070 ft (325 m) overrun at about 90 kt","+290 ft at 45 kt","+430 ft at 60 kt","−150 ft"],"e":"This is the largest overrun in the RTO margin diagrams."},{"id":"3-43","c":"3","r":"FCTM 3.29","q":"During initial climb, if speed exceeds V2 + 20 kt:","o":["Stop the acceleration but do not reduce back to V2 + 20","Reduce to V2 + 20 immediately","Reduce to V2","Retract flaps immediately"],"e":"Any speed between V2 + 15 and V2 + 25 gives approximately the same profile."},{"id":"3-44","c":"3","r":"FCTM 3.29","q":"Minimum fuel takeoff: a main tank pump low pressure light illuminates after takeoff. You should:","o":["Not turn off the fuel pumps; reduce nose-up attitude and avoid rapid acceleration","Turn off the affected pump","Open the crossfeed","Increase climb attitude"],"e":"Minimum recommended takeoff fuel is trip fuel plus reserves."},{"id":"3-45","c":"3","r":"FCTM 3.29","q":"Immediate turn after takeoff, all engines, takeoff flaps. Maximum bank at V2 + 15?","o":["30°","15°","25°","20°"],"e":"Normally initiate the turn at no less than 400 ft AGL."},{"id":"3-46","c":"3","r":"FCTM 3.30","q":"If LNAV is armed before takeoff, it becomes active at:","o":["50 ft AGL, if the active leg is within 3.0 NM and 5° of runway heading","400 ft AGL always","Acceleration height","1,000 ft AGL"],"e":"If not armed, select LNAV above 400 ft AGL."},{"id":"3-47","c":"3","r":"FCTM 3.30","q":"VNAV armed for takeoff engages at:","o":["400 ft AGL","50 ft AGL","1,000 ft AGL","Acceleration height"],"e":"VNAV provides overspeed protection for the leading edge devices."},{"id":"3-48","c":"3","r":"FCTM 3.31","q":"The minimum altitude for flap retraction is:","o":["400 ft AFE","1,000 ft AFE","800 ft AFE","1,500 ft AFE"],"e":"Training: 1,000 ft. Line noise abatement: thrust reduction ~1,500 ft, acceleration 1,500–3,000 ft."},{"id":"3-49","c":"3","r":"FCTM 3.31","q":"Flap retraction begins at V2 + 15, except for:","o":["A Flaps 1 takeoff, which begins at the Flaps 1 maneuver speed","A Flaps 25 takeoff","An engine-out takeoff","A VNAV takeoff"],"e":"Each subsequent retraction: at the current flap maneuver speed with the target at or above the next."},{"id":"3-50","c":"3","r":"FCTM 3.32","q":"Flaps 25 takeoff. At V2 + 15, select flaps:","o":["15","5","1","UP"],"e":"Then '15' → 5, '5' → 1, '1' → UP."},{"id":"3-51","c":"3","r":"FCTM 3.32","q":"Flaps 15 takeoff. At V2 + 15, select flaps:","o":["5","1","10","UP"],"e":"Then '5' → 1, '1' → UP."},{"id":"3-52","c":"3","r":"FCTM 3.32","q":"During flap retraction, bank angle is limited to 15° until:","o":["V2 + 15","V2","Flaps up","Acceleration height"],"e":"At the flap retraction speed at least 30° capability exists."},{"id":"3-53","c":"3","r":"FCTM 3.33","q":"With an engine failure at or after V1, the best indicator of correct rudder input is:","o":["Airplane heading","The slip/skid indicator","The control wheel position","The bank pointer"],"e":"Stop the yaw with rudder."},{"id":"3-54","c":"3","r":"FCTM 3.33","q":"One engine inoperative rotation: target pitch and rate are:","o":["12–13°, at about 1.5–2.5°/s","15°, at 2–3°/s","10°, at 1°/s","8°, at 3°/s"],"e":"Target is 2–3° lower and rate ½°/s slower than normal. Liftoff in about 5 s."},{"id":"3-55","c":"3","r":"FCTM 3.37","q":"Engine fails between V2 and V2 + 20 during initial climb. Climb at:","o":["The airspeed at which the failure occurred","V2","V2 + 20","Flaps-up maneuver speed"],"e":"If above V2 + 20, reduce to V2 + 20. Minimum V2."},{"id":"3-56","c":"3","r":"FCTM 3.37","q":"After an engine failure on takeoff, memory items are accomplished:","o":["When the flight path is under control, gear is up and at a minimum of 400 ft AGL","Immediately at V1","After flaps are up","Above 1,500 ft AGL"],"e":"Reference items are done by the PM as soon as practical."},{"id":"3-57","c":"3","r":"FCTM 3.38","q":"Engine-out acceleration height is based on reaching flaps-up speed and setting maximum continuous thrust within:","o":["5 minutes (10 minutes optional) of starting the takeoff","3 minutes","15 minutes","2 minutes"],"e":"Some combinations may require retraction as low as 400 ft."},{"id":"3-58","c":"3","r":"FCTM 3.38","q":"Engine-out flap retraction without VNAV: the F/D commands:","o":["A near-level or slight climb (0–200 fpm) segment","A 500 fpm climb","V2 + 20","A descent to gain speed"],"e":"Leave pitch mode in TO/GA and set flaps-up maneuver speed on the MCP."},{"id":"3-59","c":"3","r":"FCTM 3.39","q":"Engine-out, flaps up, climbing at flaps-up maneuver speed with CON. Before level-off:","o":["Ensure the autothrottle is disconnected","Re-engage the A/T in SPD","Select CLB-2","Extend flaps 1"],"e":"After level-off, set thrust as needed."},{"id":"3-60","c":"3","r":"FCTM 3.39","q":"Combined ATM and fixed derate takeoff on airplanes with the double-derate option. After an engine failure, Boeing recommends:","o":["Not advancing the thrust levers, since the derate limit is not displayed","Advancing to full rated thrust","Advancing to the N1 bug","Advancing to maximum continuous"],"e":"Without the option, the N1 bug shows the derate limit and thrust may go to that limit only."},{"id":"4-01","c":"4","r":"FCTM 4.1","q":"CLB-1 and CLB-2 are approximately what derate of climb thrust?","o":["10% and 20%","5% and 10%","15% and 30%","20% and 40%"],"e":"Derates are removed gradually as the airplane climbs."},{"id":"4-02","c":"4","r":"FCTM 4.1","q":"During a reduced thrust climb, if rate of climb drops below about 500 fpm:","o":["Select the next higher climb rating","Reduce speed","Level off","Select CON"],"e":"Reduced thrust climb increases trip fuel."},{"id":"4-03","c":"4","r":"FCTM 4.2","q":"Climbing in a pitch mode other than VNAV SPD, set the MCP altitude to:","o":["The next constraint or the clearance altitude, whichever is lower","The clearance altitude only","The highest constraint","The cruise altitude"],"e":"For 'at or above' constraints, set the clearance altitude."},{"id":"4-04","c":"4","r":"FCTM 4.2","q":"Pushing MCP ALT INTV during a VNAV climb:","o":["Deletes the next altitude constraint and climbs to the MCP altitude","Disconnects VNAV","Engages LVL CHG","Deletes all speed restrictions"],"e":"Recommended when relieved of constraints in congested areas."},{"id":"4-05","c":"4","r":"FCTM 4.3","q":"Low-altitude level-off after a high-thrust, light-weight takeoff. Which helps prevent an overshoot?","o":["Reduce to climb thrust earlier than normal","Use full thrust and higher rotation rate","Delay gear retraction","Use VNAV with ALT INTV"],"e":"Also: reduced takeoff thrust, manual level-off, manual thrust to prevent flap overspeed."},{"id":"4-06","c":"4","r":"FCTM 4.4","q":"Economy climb schedule when FMC data is unavailable, below 10,000 ft:","o":["250 kt or VREF40 + 70, whichever is higher","250 kt","VREF40 + 70","280 kt"],"e":"Above 10,000 ft: 280 kt / M0.78."},{"id":"4-07","c":"4","r":"FCTM 4.4","q":"Economy climb schedule when FMC data is unavailable, above 10,000 ft:","o":["280 kt / M0.78","290 kt / M0.79","250 kt / M0.74","300 kt / M0.78"],"e":"Max rate climb approximation: flaps-up maneuver speed + 50 kt until M0.78."},{"id":"4-08","c":"4","r":"FCTM 4.4","q":"Maximum rate climb can be approximated by:","o":["Flaps-up maneuver speed + 50 kt until M0.78","Flaps-up maneuver speed","250 kt / M0.74","VREF40 + 100"],"e":"Max angle climb gives about the same gradient as flaps-up maneuver speed."},{"id":"4-09","c":"4","r":"FCTM 4.4","q":"Selecting CON on the FMC N1 LIMIT page after an engine failure in climb:","o":["Moves the N1 bug to maximum continuous; thrust must be set manually","Sets maximum continuous thrust automatically","Engages the A/T in N1","Selects ENG OUT CLB"],"e":"If computed speeds are unavailable, use flaps-up speed and CON."},{"id":"4-10","c":"4","r":"FCTM 4.5","q":"The FMC maximum altitude is the lowest of maximum certified, thrust-limited and:","o":["Buffet or maneuver-limited altitude","Optimum altitude","Trip altitude","Step climb altitude"],"e":"The minimum buffet margin is 0.3g (40° bank)."},{"id":"4-11","c":"4","r":"FCTM 4.5","q":"The minimum maneuver margin to buffet used for maximum altitude is:","o":["0.3g (40° bank)","0.2g (35° bank)","0.5g (48° bank)","0.1g (25° bank)"],"e":"Some regulatory agencies may require a different margin."},{"id":"4-12","c":"4","r":"FCTM 4.6","q":"Near maximum altitude and NOT in LNAV, fly at least:","o":["10 kt above the lower amber band with bank of 10° or less","5 kt above the amber band with 15° bank","20 kt above with 25° bank","At the top of the amber band with 20° bank"],"e":"LNAV provides real-time bank angle limiting based on thrust."},{"id":"4-13","c":"4","r":"FCTM 4.6","q":"Speed drops below the lower amber band near maximum altitude. Which is NOT a recommended action?","o":["Increase pitch to hold altitude","Reduce bank angle","Increase thrust up to maximum continuous","Descend"],"e":"Minimum maneuver speed does not guarantee level flight; drag may exceed thrust."},{"id":"4-14","c":"4","r":"FCTM 4.6","q":"Optimum altitude calculation does NOT consider:","o":["Winds and temperature deviation","Gross weight","Cruise speed","Cost index in ECON"],"e":"It provides optimum performance in still air only."},{"id":"4-15","c":"4","r":"FCTM 4.7","q":"A cost index of zero results in:","o":["Maximum range cruise","Long range cruise","Minimum time","Holding speed"],"e":"Headwinds increase ECON speed; tailwinds decrease it, but not below zero-wind MRC."},{"id":"4-16","c":"4","r":"FCTM 4.7","q":"Long range cruise (LRC) provides:","o":["Fuel mileage 1% less than maximum, with no wind correction","Maximum range with wind correction","Minimum cost","Fuel mileage 5% less than maximum"],"e":"Within 2,000 ft of optimum, LRC ≈ M0.79 and gives the best buffet margin."},{"id":"4-17","c":"4","r":"FCTM 4.7","q":"Regarding step climbs, the FMC:","o":["Does not compute an optimum step point; the crew enters STEP TO","Computes and executes optimum steps automatically","Displays the optimum step point on the LEGS page","Ignores gross weight"],"e":"It computes the ETA, distance and fuel saving for the entered step."},{"id":"4-18","c":"4","r":"FCTM 4.8","q":"A step climb is not normally justified unless cruise time at the higher altitude is about:","o":["20 minutes or longer","5 minutes","1 hour","45 minutes"],"e":"A 4,000 ft en-route climb costs about 100–200 lb (45–90 kg)."},{"id":"4-19","c":"4","r":"FCTM 4.8","q":"Maximum specification freezing point of Jet A-1 is:","o":["−47°C","−40°C","−50°C","−37°C"],"e":"Jet A: −40°C. TS-1/RT: −50°C."},{"id":"4-20","c":"4","r":"FCTM 4.8","q":"For a blend of fuels, the most conservative freezing point is used until:","o":["3 consecutive refuelings with the lower freezing point fuel","The next refueling","The tanks are below half","Fuel temperature is measured"],"e":"Transfer wing fuel to the center tank first if freezing point is critical."},{"id":"4-21","c":"4","r":"FCTM 4.9","q":"Typical fuel cooling rate in cruise is about:","o":["3°C per hour (up to 12°C in extreme conditions)","1°C per hour","10°C per hour","6°C per hour (up to 20°C)"],"e":"Stabilizing fuel temperature takes 15 minutes to one hour."},{"id":"4-22","c":"4","r":"FCTM 4.9","q":"Increasing Mach by 0.01 increases TAT by approximately:","o":["0.5–0.7°C","1–2°C","0.1°C","3°C"],"e":"Descending 3,000–5,000 ft below optimum is the usual fix."},{"id":"4-23","c":"4","r":"FCTM 4.10","q":"Cruising 8,000 ft below optimum altitude increases trip fuel by about:","o":["7%","2%","1%","12%"],"e":"ISA+10: 1% · ±2,000 ft: 1–2% · 4,000 ft below: 2% · +0.01M above LRC: 1–2%."},{"id":"4-24","c":"4","r":"FCTM 4.10","q":"ISA + 10°C increases trip fuel by about:","o":["1%","3%","5%","0.5%"],"e":"An unexplained fuel discrepancy should be treated as a possible leak."},{"id":"4-25","c":"4","r":"FCTM 4.11","q":"Engine failure at cruise altitude. First thrust actions:","o":["Disconnect the A/T and manually set CON thrust","Keep A/T engaged and select CON","Select LVL CHG immediately","Set CLB thrust"],"e":"Then ENG OUT CRZ, set MAX alt and EO speed on the MCP, decelerate, then LVL CHG."},{"id":"4-26","c":"4","r":"FCTM 4.11","q":"During engine-out driftdown, LVL CHG is selected:","o":["After airspeed has slowed to the engine-out target speed","Immediately after the failure","Before setting CON","Only after the NNC"],"e":"Maintaining EO speed and MCT, the airplane levels off above the original MAX altitude."},{"id":"4-27","c":"4","r":"FCTM 4.12","q":"With severe engine damage, the EEC may allow additional thrust at the forward stop below:","o":["15,000 ft pressure altitude and M0.45","10,000 ft and M0.40","FL200 and M0.60","25,000 ft and M0.70"],"e":"Fly EO target speed and MCT; descend until altitude can be maintained."},{"id":"4-28","c":"4","r":"FCTM 4.12","q":"Which statement about high altitude, high speed flight is correct?","o":["The airplane has no Mach tuck tendency","Mach buffet is normal at high Mach cruise","Mach trim inop causes a strong nose-up change","Drag decreases near MMO"],"e":"With Mach trim inop there is a slight nose-down trim change near MMO."},{"id":"4-29","c":"4","r":"FCTM 4.12","q":"An attitude change giving 500 fpm at 290 KIAS at sea level gives about what at 290 KIAS at FL350?","o":["900 fpm","500 fpm","300 fpm","1,500 fpm"],"e":"290 KIAS ≈ 490 kt TAS at FL350; rate of climb is proportional to TAS."},{"id":"4-30","c":"4","r":"FCTM 4.13","q":"ETOPS applies to flights with points more than ___ from an adequate airport at engine-out cruise speed:","o":["One hour (in still air)","Two hours","90 minutes","400 NM"],"e":"Critical fuel is normally calculated by dispatch and shown in the CFP."},{"id":"4-31","c":"4","r":"FCTM 4.14","q":"SATCOM is unavailable above:","o":["82°N","78°N","85°N","89°30'N"],"e":"Arrange HF and SELCAL before leaving SATCOM coverage."},{"id":"4-32","c":"4","r":"FCTM 4.15","q":"HDG SEL and ROLL CWS should not be used beyond:","o":["89°30' North or South latitude","85° latitude","82° latitude","87° latitude"],"e":"LNAV is the primary roll mode for polar operations."},{"id":"4-33","c":"4","r":"FCTM 4.14","q":"A simple approximation for metric wind speed in polar regions:","o":["1 m/s ≈ 2 kt","1 m/s ≈ 1 kt","1 m/s ≈ 3.6 kt","1 m/s ≈ 0.5 kt"],"e":"Be prepared for QFE and metric altitudes."},{"id":"SOP-01","c":"SOP","r":"WY SOP 60.3.1","q":"CRZ CG to enter in PERF INIT for the B737-8:","o":["23.8%","26.2%","19.7%","25.0%"],"e":"B737-800: 26.2%, B737-900: 19.7%, B737-8: 23.8%."},{"id":"SOP-02","c":"SOP","r":"WY SOP 60.3.1","q":"TAKEOFF REF page 2/2 ACCEL HT entries for NADAP 1 and NADAP 2:","o":["3,000 ft and 1,000 ft","1,500 ft and 800 ft","1,000 ft and 3,000 ft","3,000 ft and 1,500 ft"],"e":"Enter the OPT EO ACCEL HT if higher than 1,000 ft."},{"id":"SOP-03","c":"SOP","r":"WY SOP 60.3.1","q":"REDUCTION THR height entered on TAKEOFF REF page 2/2:","o":["800 ft","1,000 ft","1,500 ft","400 ft"],"e":"Per WY SOP 60.3.1."},{"id":"SOP-04","c":"SOP","r":"WY SOP 60.3.1","q":"Open STARs where vectoring is expected are designed with a discontinuity. The crew should:","o":["Not connect the waypoints","Connect the waypoints to avoid a discontinuity","Delete the STAR","Enter a hold at the last waypoint"],"e":"Connecting them can cause errors."},{"id":"SOP-05","c":"SOP","r":"WY SOP 60.3.7","q":"Destination elevation is 109 ft. LAND ALT is set to:","o":["150 ft","100 ft","110 ft","200 ft"],"e":"LAND ALT is rounded up to the nearest higher multiple of 50 ft."},{"id":"SOP-06","c":"SOP","r":"WY SOP 60.3.6","q":"Igniter selection for departures from Muscat:","o":["Right igniter, changed after each sector","Left igniter always","BOTH","Right igniter for the whole day"],"e":"Per WY SOP 60.3.6."},{"id":"SOP-07","c":"SOP","r":"WY SOP 60.3.12","q":"Takeoff when TORA is less than 2,438 m (8,000 ft):","o":["PIC only, with no ATM, derate or intersection","Either pilot, full thrust","PIC only, ATM permitted","SIC permitted with derate"],"e":"TORA < 2,438 m is listed as not authorized for ATM, derate and intersection."},{"id":"SOP-08","c":"SOP","r":"WY SOP 60.3.12","q":"Which condition prohibits ATM but NOT a fixed derate?","o":["Gusty crosswind","EEC ALT mode","Contaminated runway","Windshear"],"e":"Antiskid INOP, gusty crosswind and de/anti-icing prohibit ATM only."},{"id":"SOP-09","c":"SOP","r":"WY SOP 60.3.12","q":"OPT Preference 1 for the B737 MAX uses RTL CONFIG:","o":["15/30, with 1/15 as Preference 2 if performance limited","1/15, with 15/30 as Preference 2","5/30","OPTIMUM only"],"e":"With Preference 1, use fixed derate and ATM whenever possible."},{"id":"SOP-10","c":"SOP","r":"WY SOP 60.3.12","q":"With OPT Preference 2, 3 or 4, the thrust used is:","o":["Full thrust (no derate)","Maximum ATM","CLB-1","Fixed derate 1"],"e":"ATM and derate are recommended with Preference 1."},{"id":"SOP-11","c":"SOP","r":"WY SOP 60.3.13","q":"After the OPT compare calculation, before engine start:","o":["iPad to airplane mode and Wi-Fi off","Keep Wi-Fi on for updates","Send the result to dispatch","Print the OPT output"],"e":"Wi-Fi devices are prohibited on the flight deck with engines operating."},{"id":"SOP-12","c":"SOP","r":"WY SOP 60.3.13","q":"Who enters V2 in the MCP, arms the A/T and sets takeoff trim?","o":["PIC","SIC","PF","PM"],"e":"The SIC enters assumed temperature, derate, flaps and speeds with PIC confirmation."},{"id":"SOP-13","c":"SOP","r":"WY SOP 60.4.1","q":"At an airport with no specified transponder procedure, during pushback and taxi the transponder is:","o":["STBY","XPNDR","TA/RA","TA ONLY"],"e":"XPNDR at airports with ground movement monitoring."},{"id":"SOP-14","c":"SOP","r":"WY SOP 60.5.4","q":"On the B737 MAX, the engine display is on the ___ side for start and taxi, and moves to the ___ side before entering the runway:","o":["PIC / PM","PM / PF","SIC / PIC","PF / PIC"],"e":"It returns to the PIC side after vacating the runway."},{"id":"SOP-15","c":"SOP","r":"WY SOP 60.6.3","q":"On the B737 MAX, the VSD is selected:","o":["On both sides from before takeoff until after landing","On the PM side below 10,000 ft only","On the PF side for approach only","Only in IMC"],"e":"On the NG, the VSD may be on the PM side for takeoff, landing and below 10,000 ft."},{"id":"SOP-16","c":"SOP","r":"WY SOP 60.6.4–60.6.5","q":"Before entering the runway, weather radar and TERR are normally selected on:","o":["Radar on the PF side, TERR on the PM side","Radar on the PM side, TERR on the PF side","Both on the PF side","Both on the PM side"],"e":"TERR is retained until above 10,000 ft AGL or MSA, whichever is higher."},{"id":"SOP-17","c":"SOP","r":"WY SOP 60.6.2","q":"FMC entries required during taxi are made by:","o":["The SIC, in a straight line, executed after PIC confirmation","The PIC while taxiing","Either pilot at any time","The PF only"],"e":"Make all entries before taxi or when stopped whenever possible."},{"id":"SOP-18","c":"SOP","r":"WY SOP 60.7.1","q":"When cleared to line up, the SIC announces on the PA:","o":["'Cabin crew take your seats for takeoff'","'Cabin crew prepare for departure'","'Cabin crew, doors to automatic'","'Cabin crew, seats for landing'"],"e":"It may be delayed at PIC discretion in case of backtrack."},{"id":"SOP-19","c":"SOP","r":"WY SOP 60.8.1","q":"FMA callouts after becoming airborne start at:","o":["400 ft RA, by the PF","50 ft RA, by the PM","1,000 ft AGL, by the PF","Acceleration height, by the PM"],"e":"No FMA callouts below 400 ft RA due to the critical phase."},{"id":"SOP-20","c":"SOP","r":"WY SOP 60.8.1","q":"After landing gear up, the PF's hands stay on the thrust levers and control column until at least:","o":["5,000 ft AGL","1,000 ft AGL","10,000 ft AMSL","Acceleration height"],"e":"Thrust levers are never left unguarded."},{"id":"SOP-21","c":"SOP","r":"WY SOP 60.8.2","q":"Automation re-engagement sequence called by the PF:","o":["A/T (PM), roll mode (PM), pitch mode (PM), autopilot (PF)","Autopilot, pitch, roll, A/T","Roll, pitch, A/T, autopilot","Pitch, roll, autopilot, A/T"],"e":"Modes are called left to right across the MCP."},{"id":"SOP-22","c":"SOP","r":"WY SOP 60.8.3","q":"Engine failure after V1 with an EOP, VNAV takeoff. Speed technique?","o":["Speed intervention, V2 + 15 until the last EOP track","Follow VNAV acceleration","V2 until flaps up","Flaps-up maneuver speed"],"e":"Flap retraction is delayed until the last EOP track and above EO acceleration altitude."},{"id":"SOP-23","c":"SOP","r":"WY SOP 60.8.3","q":"Unless stated otherwise, WY Engine Out Procedures assume a bank angle of:","o":["15°","25°","30°","10°"],"e":"Minimum altitude for A/P engagement with an engine out is 400 ft."},{"id":"SOP-24","c":"SOP","r":"WY SOP 60.8.3","q":"If memory items are required during an EOP turn:","o":["Stop during the turn and complete them after the turn","Complete them during the turn","Do them before the turn","Skip them until level-off"],"e":"Aviate, navigate, communicate. ATC has no knowledge of company EOPs."},{"id":"SOP-25","c":"SOP","r":"WY SOP 60.9.2","q":"Below 10,000 ft AMSL, FMC entries are made by:","o":["The PM only, executed after PF confirmation","The PF only","Either pilot","The PIC only"],"e":"Sterile flight deck is maintained below 10,000 ft AMSL."},{"id":"SOP-26","c":"SOP","r":"WY SOP 60.10.1","q":"Fuel balancing shall NOT be performed:","o":["When a pilot leaves the flight deck or during controlled rest","In cruise","Above FL300","With the autopilot engaged"],"e":"Per WY SOP 60.10.1."},{"id":"SOP-27","c":"SOP","r":"WY SOP 60.10.1","q":"To reduce carbon brake wear, the autobrake should be set to:","o":["OFF, or 2 or higher","1","MAX only","RTO"],"e":"A single sustained application causes far less wear than several small ones."},{"id":"SOP-28","c":"SOP","r":"WY SOP 60.11.2","q":"Speed before descending below 5,000 ft AAL must be:","o":["250 kt or less","240 kt or less","220 kt or less","Flaps-up maneuver speed"],"e":"Speeds above 250 kt below 10,000 ft AMSL only with ATC approval and if the PIC considers it safe."},{"id":"SOP-29","c":"SOP","r":"WY SOP 60.11.2","q":"As a recommendation, which speed restriction is entered in the FMC descent page?","o":["240 kt at 10,000 ft AAL","250 kt at 10,000 ft AMSL","220 kt at 5,000 ft AAL","210 kt at FAF"],"e":"This helps avoid errors."},{"id":"SOP-30","c":"SOP","r":"WY SOP 60.11.1","q":"At top of descent, the seatbelt sign is:","o":["Set ON by the PM","Set to AUTO by the PF","Left in its current position","Set ON by the cabin crew request"],"e":"If already ON for turbulence, cycle to AUTO then ON."},{"id":"SOP-31","c":"SOP","r":"WY SOP 60.11.3","q":"When radar vectors are provided during descent:","o":["Don't descend in VNAV; select other modes as the path is inaccurate","Continue in VNAV PTH","Use VNAV with speed intervention","Use LNAV only"],"e":"Sequence the flight plan to keep LNAV available for approach and go-around."},{"id":"SOP-32","c":"SOP","r":"WY SOP 60.3.14","q":"On the ground, VHF 2 is normally used to monitor company (122.2) and, once pushback starts:","o":["121.5","123.45","ATIS","Ground frequency"],"e":"VHF 1 for ATC, VHF 3 for ACARS."},{"id":"4D-01","c":"4D","r":"FCTM 4.16","q":"At the airport speed transition altitude, the FMC ECON descent reduces speed to:","o":["The airport speed restriction in the database minus 10 kt","The airport speed restriction exactly","Flaps-up maneuver speed","210 kt"],"e":"Speed schedule also honors LEGS and DES page constraints."},{"id":"4D-02","c":"4D","r":"FCTM 4.16","q":"The FMC descent path is built:","o":["From the lowest constraint upward, assuming idle thrust (approach idle below the anti-ice altitude)","From top of descent downward at 3°","From the FAF at 1,000 fpm","Only when VNAV SPD is engaged"],"e":"At least one waypoint altitude constraint below cruise altitude is needed to generate a path."},{"id":"4D-03","c":"4D","r":"FCTM 4.16","q":"Descending in a pitch mode other than VNAV PTH or VNAV SPD, the MCP altitude must be set to:","o":["The next altitude constraint","The clearance altitude only","The FAF altitude","The lowest constraint on the STAR"],"e":"Normally set mandatory and 'at or above' restrictions in the MCP."},{"id":"4D-04","c":"4D","r":"FCTM 4.17","q":"Deceleration requirements below cruise altitude (e.g. at 10,000 ft) are planned based on a rate of descent of about:","o":["500 fpm","1,000 fpm","Level flight","1,500 fpm"],"e":"Deceleration at top of descent is performed in level flight."},{"id":"4D-05","c":"4D","r":"FCTM 4.17","q":"Using VNAV speed intervention in VNAV SPD, the airplane responds to a speed change by:","o":["Changing pitch while thrust remains at idle","Changing thrust only","Disconnecting VNAV","Extending speedbrakes automatically"],"e":"In VNAV PTH, speedbrakes or added thrust may be needed to hold the speed."},{"id":"4D-06","c":"4D","r":"FCTM 4.17","q":"No-wind descent planning distance at ECON speed is approximately:","o":["3 NM per 1,000 ft","2 NM per 1,000 ft","5 NM per 1,000 ft","1 NM per 1,000 ft"],"e":"Rate of descent depends on thrust, drag, airspeed schedule and weight."},{"id":"4D-07","c":"4D","r":"FCTM 4.18","q":"Typical clean idle descent rate at M0.78/280 kt is about:","o":["2,000 fpm (2,300 with speedbrake)","1,500 fpm (1,700 with speedbrake)","3,000 fpm (3,500 with speedbrake)","1,100 fpm (1,200 with speedbrake)"],"e":"250 kt: 1,500/1,700 fpm; VREF40+70: 1,100/1,200 fpm."},{"id":"4D-08","c":"4D","r":"FCTM 4.18","q":"The Descent Procedure should be completed by:","o":["10,000 ft MSL","Transition level","Top of descent","The IAF"],"e":"The Approach Procedure is normally started at transition level."},{"id":"4D-09","c":"4D","r":"FCTM 4.18","q":"A good descent crosscheck is:","o":["10,000 ft AGL, 30 NM from the airport, at 250 kt","10,000 ft AGL, 20 NM, 250 kt","5,000 ft AGL, 30 NM, 210 kt","10,000 ft MSL, 40 NM, 280 kt"],"e":"Plan to reach pattern altitude at flaps-up speed ~12 NM straight-in or ~8 NM abeam."},{"id":"4D-10","c":"4D","r":"FCTM 4.18","q":"Decelerating from 280 to 250 kt in level flight without speedbrakes takes about:","o":["30 seconds and 2.5 NM","60 seconds and 5 NM","15 seconds and 1 NM","2 minutes and 8 NM"],"e":"A further 55 s and 4 NM to flaps-up speed. Speedbrakes reduce these by about 10%."},{"id":"4D-11","c":"4D","r":"FCTM 4.18","q":"When should the approach briefing be completed?","o":["As soon as practical, preferably before top of descent","At transition level","Below 10,000 ft","At the IAF"],"e":"This allows full attention to airplane control during approach."},{"id"
