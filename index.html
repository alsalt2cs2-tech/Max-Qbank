:"4D-12","c":"4D","r":"FCTM 4.19","q":"When using speedbrakes in flight, the PF should:","o":["Keep a hand on the speedbrake lever","Arm them for landing","Use them only with the A/P off","Retract them before adding flaps 1"],"e":"This prevents leaving them extended. Lower speedbrakes before adding thrust."},{"id":"4D-13","c":"4D","r":"FCTM 4.19","q":"With flaps extended, speedbrakes:","o":["Should be retracted with flaps 15 or greater, and before 1,000 ft AGL","May be used down to 500 ft","Are prohibited at any flap setting","Should be used to control speed on final"],"e":"If used with flaps extended, avoid high sink rates."},{"id":"4D-14","c":"4D","r":"FCTM 4.19","q":"Near VMO/MMO with A/P engaged, retracting speedbrakes quickly may:","o":["Cause a momentary overspeed","Cause a stall warning","Disconnect the A/P","Trigger a configuration warning"],"e":"Retract slowly so the A/P can adjust pitch."},{"id":"4D-15","c":"4D","r":"FCTM 4.19","q":"When can the landing gear be used to increase descent rate?","o":["When anti-ice thrust reduces descent rate even with speedbrakes, or ATC requires higher rates","Whenever ahead of profile","Above FL250 only","Never"],"e":"Avoid routine use: passenger comfort and gear door life."},{"id":"4D-16","c":"4D","r":"FCTM 4.19","q":"Flaps 5 is normally selected:","o":["Before the approach fix going outbound, or just before downwind on a visual approach","At the FAF","At 10,000 ft","At glide slope alive"],"e":"Extend flaps when terminal area requires speed below flaps-up maneuver speed."},{"id":"4D-17","c":"4D","r":"FCTM 4.20","q":"Pilots complying with ATC speed adjustments are expected to maintain speed within:","o":["±10 kt","±5 kt","±15 kt","±20 kt"],"e":"At high weights, consider flaps or request a higher speed if the limit is below maneuver speed."},{"id":"4D-18","c":"4D","r":"FCTM 4.20","q":"Start reducing to holding speed:","o":["3 minutes before arrival at the holding fix","1 minute before the fix","At the fix","5 NM before the fix"],"e":"Cross the fix at or below maximum holding speed."},{"id":"4D-19","c":"4D","r":"FCTM 4.20","q":"If FMC holding speed exceeds the ICAO/FAA maximum, you may hold at:","o":["Flaps 1, at flaps 1 maneuver speed (~10% more fuel)","Flaps 5","Clean below maneuver speed","Flaps 1 at 210 kt"],"e":"FMC holding speeds are never lower than flaps-up maneuver speed."},{"id":"4D-20","c":"4D","r":"FCTM 4.20","q":"When holding in icing conditions or turbulence:","o":["Maintain the clean configuration","Hold at flaps 1","Hold at flaps 5","Extend speedbrakes"],"e":"Per FCTM 4.20."},{"id":"4D-21","c":"4D","r":"FCTM 4.20","q":"If the hold is not programmed in the FMC, the initial outbound leg above 14,000 ft is:","o":["1½ minutes","1 minute","2 minutes","30 seconds"],"e":"At or below 14,000 ft: 1 minute (or as required by the authority)."},{"id":"4D-22","c":"4D","r":"FCTM 4.21","q":"ICAO maximum holding speed above 14,000 ft up to 20,000 ft:","o":["240 kt","230 kt","265 kt","250 kt"],"e":"Through 14,000: 230 · 14–20,000: 240 · 20–34,000: 265 · above 34,000: M0.83."},{"id":"4D-23","c":"4D","r":"FCTM 4.21","q":"ICAO maximum holding speed above 20,000 ft up to 34,000 ft:","o":["265 kt","240 kt","250 kt","M0.83"],"e":"Above 34,000 ft: M0.83."},{"id":"4D-24","c":"4D","r":"FCTM 4.21","q":"FAA maximum holding speed through 6,000 ft MSL:","o":["200 kt","230 kt","210 kt","180 kt"],"e":"6,001–14,000: 230 kt (may be 210 kt where an icon shows) · 14,001 and above: 265 kt."},{"id":"4D-25","c":"4D","r":"FCTM 4.21","q":"With a PROC HOLD active on the LEGS page:","o":["Exit is automatic; a new hold must be entered to remain holding","EXIT HOLD must be selected","The hold continues indefinitely","LNAV disconnects at the fix"],"e":"Applies to procedure holds from the database."},{"id":"4D-26","c":"4D","r":"FCTM 4.22","q":"Without FMC or FCOM holding speeds, above FL250 use:","o":["VREF40 + 100 kt (at least 0.3g to initial buffet)","Flaps-up maneuver speed","VREF40 + 70","250 kt"],"e":"Flaps-up maneuver speed approximates minimum fuel burn speed at low altitudes."},{"id":"5-01","c":"5","r":"FCTM 5.1","q":"The requirement to tune and identify a navaid can be satisfied by:","o":["Confirming the frequency is replaced by the correct identifier on the PFD/ND, or aural identification","Seeing the deviation pointer move","Checking the frequency on the CDU","Confirming no warning flag"],"e":"Do not use out-of-service navaids even if indications look normal."},{"id":"5-02","c":"5","r":"FCTM 5.3","q":"Under FAA criteria, approach category is based on:","o":["VREF at maximum certified landing weight","VREF at actual landing weight","V2 at MTOW","1.3 VS at actual weight"],"e":"Category does not change when actual landing weight is lower."},{"id":"5-03","c":"5","r":"FCTM 5.3","q":"Category C covers speeds of:","o":["121 kt or more but less than 141 kt","141 kt or more but less than 166 kt","91 kt or more but less than 121 kt","166 kt or more"],"e":"Category D: 141 to less than 166 kt. The 737 MAX is C or D depending on max landing weight."},{"id":"5-04","c":"5","r":"FCTM 5.4","q":"Cleared for an approach but NOT on a published segment, you should:","o":["Maintain the assigned altitude until crossing the IAF or established on a published segment","Descend to the segment minimum altitude","Descend to the FAF altitude","Descend to MSA"],"e":"On a published segment, you may descend to that segment's minimum altitude."},{"id":"5-05","c":"5","r":"FCTM 5.4","q":"Approach from a holding pattern (race track): flaps 5 is extended:","o":["On the outbound track parallel to the final approach course","At the holding fix inbound","At glide slope alive","Before entering the hold"],"e":"Turn inbound on the procedure turn heading."},{"id":"5-06","c":"5","r":"FCTM 5.4","q":"The FMC builds the procedure turn path based on predicted winds and an airspeed of:","o":["170 kt","210 kt","150 kt","Flaps 5 maneuver speed"],"e":"Crossing the fix at excessive ground speed may exceed protected airspace."},{"id":"5-07","c":"5","r":"FCTM 5.5","q":"Approaches should be stabilized by:","o":["1,000 ft AFE in IMC and 500 ft AFE in VMC","500 ft AFE in IMC and 300 ft in VMC","1,500 ft in IMC and 1,000 ft in VMC","1,000 ft in both IMC and VMC"],"e":"If unstabilized below these heights, a missed approach is recommended."},{"id":"5-08","c":"5","r":"FCTM 5.5","q":"Stabilized approach airspeed tolerance is:","o":["+10 / −5 kt, if trending toward approach speed","±5 kt","+15 / −5 kt","+5 / 0 kt"],"e":"Sink rate no greater than 1,000 fpm, or a special briefing is required."},{"id":"5-09","c":"5","r":"FCTM 5.5","q":"Maximum sink rate for a stabilized approach without a special briefing:","o":["1,000 fpm","1,500 fpm","800 fpm","1,200 fpm"],"e":"Also: correct flight path, landing configuration, appropriate thrust, briefings and checklists complete."},{"id":"5-10","c":"5","r":"FCTM 5.5","q":"On a circling approach, wings should be level on final by:","o":["300 ft AFE","500 ft AFE","200 ft AFE","100 ft AFE"],"e":"ILS/GLS: within one dot of LOC and G/S."},{"id":"5-11","c":"5","r":"FCTM 5.5","q":"At 100 ft HAT on a visual approach, the airplane should be:","o":["With the flight deck within the lateral confines of the runway edges extended","On centerline exactly","At VREF","Wings level only"],"e":"Per stabilized approach recommendations."},{"id":"5-12","c":"5","r":"FCTM 5.6","q":"The touchdown zone is defined as:","o":["The first 3,000 ft or first third of the runway, whichever is less","The first 1,000 ft","The first half of the runway","The first 2,000 ft or first quarter"],"e":"Cross the threshold stabilized at approach speed within +10 kt."},{"id":"5-13","c":"5","r":"FCTM 5.6","q":"Which is a recommended missed approach condition on an ILS without visual reference?","o":["Full-scale deflection of the localizer or glide slope","One dot glide slope deviation","Glide slope alive late","Autopilot disconnect warning at 50 ft"],"e":"Others: nav/instrument failure, significant disagreement, ANP > RNP, lost comm on radar approach."},{"id":"5-14","c":"5","r":"FCTM 5.6","q":"FMC U14 or later, RNP AR approach: 'UNABLE REQD NAV PERF-RNP' appears. Action?","o":["Missed approach, regardless of whether lateral or vertical RNP is exceeded","Continue if XTK is within limits","Switch to a non-RNP procedure","Continue with raw data"],"e":"Unless suitable visual reference is established."},{"id":"5-15","c":"5","r":"FCTM 5.7","q":"A DA(H) of 1,440' (200'):","o":["DA 1,440 ft MSL, 200 ft above touchdown zone elevation","DA 200 ft MSL, height 1,440 ft","MDA 1,440 ft above threshold","DH 200 ft on the radio altimeter only"],"e":"DA/MDA reference MSL; (H) references TDZE or threshold."},{"id":"5-16","c":"5","r":"FCTM 5.7","q":"Unless specifically authorized, the radio altimeter is NOT used for:","o":["Determining MDA(H) on instrument approaches","Determining DH on CAT II","Determining AH on CAT III","Crosschecking altitude over known terrain"],"e":"Discuss RA use as a safety backup in the briefing."},{"id":"5-17","c":"5","r":"FCTM 5.7","q":"When an earlier than normal speed reduction is needed during maneuvering:","o":["Flaps 10 with gear up is acceptable","Flaps 15 with gear up is required","Use speedbrakes with flaps 15","Extend the gear first"],"e":"Per FCTM 5.7."},{"id":"5-18","c":"5","r":"FCTM 5.8","q":"Which landing flap setting minimizes landing speed and distance?","o":["Flaps 40","Flaps 30","Flaps 15","Flaps 25"],"e":"Flaps 30: better noise abatement and less flap wear. Flaps 15: where approach climb performance is a factor."},{"id":"5-19","c":"5","r":"FCTM 5.8","q":"If the maneuver speed for the next flap setting is below VREF + wind additive:","o":["Select the next flap when approaching VREF + additive and maintain VREF + additive","Slow to the new maneuver speed","Delay flap extension until the FAF","Use the previous flap setting"],"e":"Flap extension schedule provides at least 40° bank capability."},{"id":"5-20","c":"5","r":"FCTM 5.9","q":"During a go-around at GA thrust, adequate maneuver margin exists with flaps 15 at:","o":["VREF30 + 5 or VREF40 + 5","VREF15","VREF40","VREF30 + 20"],"e":"Full margin exists whenever at or above the maneuver speed for the current flaps."},{"id":"5-21","c":"5","r":"FCTM 5.9","q":"For a non-ILS approach, an acceptable way to determine the MAP instead of timing is:","o":["Reaching DA(H)/MDA(H) on a VNAV path, or using the map display","Using the radio altimeter","Calling ATC","Using DME from any station"],"e":"Timing is not needed unless UNABLE REQD NAV PERF-RNP is displayed."},{"id":"5-22","c":"5","r":"FCTM 5.9","q":"On an ILS, DH is determined by reference to:","o":["The radio altimeter (DA by the barometric altimeter)","The barometric altimeter","The marker beacon","DME"],"e":"Per FCTM 5.9."},{"id":"5-23","c":"5","r":"FCTM 5.10","q":"For most localizer approaches not flown in VNAV PTH, the published MAP is:","o":["The runway threshold","The FAF","1 NM before the threshold","The middle marker"],"e":"With VNAV PTH, use the VNAV/IAN missed approach criteria."},{"id":"5-24","c":"5","r":"FCTM 5.10","q":"On an ASR approach, the controller discontinues guidance at:","o":["The MAP or 1 NM from the runway, whichever is greater","The threshold","2 NM from the runway","DA"],"e":"Perform the missed approach when instructed."},{"id":"5-25","c":"5","r":"FCTM 5.11","q":"'Fail operational' refers to an AFDS that:","o":["Can complete the approach, autoland and rollout after any single failure below alert height","Disconnects without significant deviation after a failure","Requires DA(H)","Uses a single autopilot"],"e":"Fail passive: no significant path deviation after a failure; uses DA(H)."},{"id":"5-26","c":"5","r":"FCTM 5.14","q":"Alert height is:","o":["A height above which a CAT III approach must be discontinued if a specified failure occurs","The height where visual reference is required","The same as DH","The height the A/T retards"],"e":"Most agencies don't require visual references below AH."},{"id":"5-27","c":"5","r":"FCTM 5.14","q":"Cross the procedure turn fix at:","o":["Flaps 5 maneuver speed","Flaps up maneuver speed","Flaps 15 speed","210 kt"],"e":"LNAV and VNAV may be used if the full arrival is in the CDU."},{"id":"5-28","c":"5","r":"FCTM 5.15","q":"Before localizer capture, attempt to be at:","o":["Flaps 5 and flaps 5 maneuver speed","Flaps 15 and gear down","Flaps 1 and 210 kt","Landing flaps"],"e":"Select the next lower speed just as configuration drag takes effect."},{"id":"5-29","c":"5","r":"FCTM 5.15","q":"APP mode should not be selected until:","o":["ILS tuned/identified, on intercept heading, both pointers shown, and cleared for approach","Glide slope alive","The FAF","LOC captured"],"e":"To avoid unwanted G/S capture, select LOC first, then APP."},{"id":"5-30","c":"5","r":"FCTM 5.16","q":"Before descending below 800 ft RA on a dual A/P ILS:","o":["APP selected, both A/Ps in CMD, and stabilized on LOC and G/S","FLARE annunciated","RETARD annunciated","A/T disconnected"],"e":"Bank up to 30° may be commanded during LOC capture."},{"id":"5-31","c":"5","r":"FCTM 5.16","q":"At glide slope alive on an ILS:","o":["Gear down, flaps 15, decelerate to flaps 15 speed","Landing flaps and VREF + 5","Flaps 5","Arm APP"],"e":"At G/S capture: landing flaps, final speed, Landing checklist."},{"id":"5-32","c":"5","r":"FCTM 5.16","q":"Extending landing flaps above flaps 15 speed may cause:","o":["Flap load relief activation and large thrust changes","Stick shaker","A/P disconnect","Configuration warning"],"e":"Set missed approach altitude when established on the glide slope."},{"id":"5-33","c":"5","r":"FCTM 5.16","q":"To detect a false glide slope, crosscheck that altitude is approximately:","o":["300 ft HAT per NM from the runway on a 3° slope","500 ft per NM","200 ft per NM","1,000 ft per 3 NM at the FAF only"],"e":"Also check FAF crossing altitude, VNAV path, normal pitch and descent rate."},{"id":"5-34","c":"5","r":"FCTM 5.17","q":"The flare mode arms below:","o":["1,500 ft radio altitude","1,000 ft","800 ft","500 ft"],"e":"FLARE annunciation indicates the second A/P is fully engaged."},{"id":"5-35","c":"5","r":"FCTM 5.17","q":"At 500 ft on an autopilot approach, check that:","o":["The A/P disengage warning lights are extinguished","RETARD is annunciated","ROLLOUT is engaged","FLARE is engaged"],"e":"Fail operational: verify ROLLOUT armed and LAND 3/LAND 2."},{"id":"5-36","c":"5","r":"FCTM 5.17","q":"Fail passive autoland in a crosswind: after touchdown:","o":["Disengage the A/P immediately and use rudder for centerline","Keep the A/P engaged for rollout","Wait for A/T disconnect then disengage A/P","Apply full aileron into wind before disengaging"],"e":"The airplane touches down in a crab. A/T disconnects 2 s after touchdown."},{"id":"5-37","c":"5","r":"FCTM 5.17","q":"Fail operational runway alignment begins at or below ___ RA, limiting sideslip to ___:","o":["450 ft / 5°","500 ft / 10°","200 ft / 5°","400 ft / 3°"],"e":"Upwind wing is low at touchdown in all cases."},{"id":"5-38","c":"5","r":"FCTM 5.18","q":"Intercepting the G/S from above, the MCP altitude is set no lower than:","o":["1,000 ft AFE, using V/S −1,000 to −1,500 fpm","500 ft AFE using V/S −2,000","The FAF altitude using LVL CHG","DA"],"e":"Ensure LOC is captured before descending below cleared or FAF altitude. Not recommended with VNAV."},{"id":"5-39","c":"5","r":"FCTM 5.18","q":"Intercepting a G/S from well above 3° may cause:","o":["A false capture with a rapid pitch-up and airspeed loss","A/P disconnect","Flap load relief only","G/S mode never arming"],"e":"If not captured and stabilized by 1,000 ft AFE, go around."},{"id":"5-40","c":"5","r":"FCTM 5.19","q":"Delayed flap approach: landing flaps are selected approaching:","o":["1,000 ft AFE","500 ft AFE","The FAF","1,500 ft AFE"],"e":"Intercept G/S gear down, flaps 15, flaps 15 speed."},{"id":"5-41","c":"5","r":"FCTM 5.19","q":"Raw data localizer tracking normally requires a bank of:","o":["5° to 10°","15° to 20°","25°","1° to 3°"],"e":"Begin the turn inbound at first movement of the localizer pointer."},{"id":"5-42","c":"5","r":"FCTM 5.20","q":"Initiating a CAT III autoland requires:","o":["Both hydraulic systems A and B operational","Only system B","Standby hydraulics","One system plus PTU"],"e":"Fail operational: if one fails below AH, the autoland may continue."},{"id":"5-43","c":"5","r":"FCTM 5.20","q":"Autoland flap settings:","o":["Flaps 30 or 40 (engine out fail operational: flaps 30 only)","Flaps 15, 30 or 40","Flaps 40 only","Flaps 30 only"],"e":"Do not autoland if the localizer is offset from the centerline."},{"id":"5-44","c":"5","r":"FCTM 5.21","q":"In the US, ILS critical areas are protected when weather is below:","o":["800 ft ceiling and/or 2 SM visibility","1,000 ft and 3 SM","200 ft and 1/2 SM","500 ft and 1 SM"],"e":"Above that, beam bends may occur; guard the controls."},{"id":"5-45","c":"5","r":"FCTM 5.22","q":"Normally controlling RVR for CAT I, II and III approaches:","o":["Touchdown RVR","Mid RVR","Rollout RVR","Lowest of the three"],"e":"For CAT III, mid and rollout may also be controlling."},{"id":"5-46","c":"5","r":"FCTM 5.22","q":"CAT I/II, after acquiring the red terminating or side row bars, if the runway environment is not distinctly visible:","o":["Execute an immediate missed approach","Continue to 50 ft","Continue to the threshold","Level off and search"],"e":"Below 100 ft above TDZE, red bars may be required."},{"id":"5-47","c":"5","r":"FCTM 5.22","q":"CAT III fail passive operations typically apply a DH of:","o":["50 ft","100 ft","200 ft","0 ft"],"e":"Fail operational: normally no specific visual references required below AH."},{"id":"5-48","c":"5","r":"FCTM 5.23","q":"Regulatory agencies may require adding to the dry landing distance for low visibility operations:","o":["15%","25%","10%","67%"],"e":"They may also impose lower wind limits than FCOM autoland limits."},{"id":"5-49","c":"5","r":"FCTM 5.23","q":"On a dual A/P approach, the stabilizer is trimmed additionally nose up below:","o":["400 ft RA","500 ft RA","800 ft RA","1,500 ft RA"],"e":"If the A/P is disengaged below 400 ft, expect a mistrim and forward column force."},{"id":"5-50","c":"5","r":"FCTM 5.23","q":"CAT II with a single autopilot: the A/T should be:","o":["Disconnected when the A/P is disengaged","Kept engaged to touchdown","Disconnected at 500 ft","Never used"],"e":"Fail passive CAT II requires two engines operating."},{"id":"5-51","c":"5","r":"FCTM 5.24","q":"Fault above AH, autoland status annunciation has changed. Action?","o":["Adjust to higher minimums or go around (land if suitable visual reference)","Continue to the original minima","Disengage both autopilots","Ignore if the A/T is engaged"],"e":"If status unchanged and equipment not required, continue."},{"id":"5-52","c":"5","r":"FCTM 5.25","q":"Fail operational: master caution below AH. You should:","o":["Not disengage the A/P unless it is not controlling adequately","Disengage the A/P and land manually","Go around","Disconnect the A/T"],"e":"If a fault affects A/T or autobrakes, take manual control of thrust and braking."},{"id":"5-53","c":"5","r":"FCTM 5.25","q":"Alert height for the fail operational AFDS is:","o":["200 ft above the runway","100 ft","50 ft","None"],"e":"ISFD required for LAND 3 only."},{"id":"5-54","c":"5","r":"FCTM 5.26","q":"Allowable autoland crosswind: fail passive / fail operational:","o":["20 kt / 25 kt","25 kt / 30 kt","15 kt / 20 kt","20 kt / 20 kt"],"e":"Per the fail passive vs fail operational comparison table."},{"id":"5-55","c":"5","r":"FCTM 5.27","q":"On a fail passive approach, if FLARE is not armed by approximately ___ the autopilots disengage:","o":["350 ft","500 ft","200 ft","100 ft"],"e":"At 400 ft the stabilizer is trimmed nose up; at 50 ft FLARE engages."},{"id":"5-56","c":"5","r":"FCTM 5.27","q":"During autoland, the A/T begins retarding at:","o":["27 ft","50 ft","10 ft","100 ft"],"e":"RETARD annunciates."},{"id":"5-57","c":"5","r":"FCTM 5.27","q":"Fail operational one engine inoperative autoland is authorized with:","o":["Dual A/P, flaps 30 only (performance permitting)","Single A/P, flaps 15","Dual A/P, flaps 40","Not authorized"],"e":"Fail passive: single A/P only; engine-out autoland not authorized."},{"id":"5-58","c":"5","r":"FCTM 5.28","q":"Engine-out go-around flap setting: fail passive / fail operational:","o":["Flaps 1 / Flaps 15","Flaps 15 / Flaps 15","Flaps 5 / Flaps 1","Flaps 1 / Flaps 1"],"e":"After TO/GA, the AFDS commands GA attitude then holds command speed."},{"id":"5-59","c":"5","r":"FCTM 5.29","q":"737-8, flaps 30, 3° glide path: main gear height over the threshold is about:","o":["33 ft","50 ft","48 ft","20 ft"],"e":"Pilot eye height ~48 ft; ILS antenna crosses at 50 ft."},{"id":"5-60","c":"5","r":"FCTM 5.29","q":"Approach body attitude decreases by about 1° for each:","o":["5 kt above VREF30 + 5","10 kt above VREF","2 kt above VREF","1 kt above VREF"],"e":"Based on flaps 30, VREF30 + 5."},{"id":"5-61","c":"5","r":"FCTM 5.30","q":"For fail passive airplanes, dual autopilots with one engine inoperative are:","o":["Not authorized","Authorized to CAT I","Authorized to CAT II","Required"],"e":"Use F/D or single A/P; A/T not recommended."},{"id":"5-62","c":"5","r":"FCTM 5.30","q":"Fail operational, engine out: if flaps 30 performance is not satisfactory:","o":["A flaps 15 engine-inoperative landing is required, autoland not authorized","Use flaps 40 autoland","Use flaps 25","Divert"],"e":"At G/S capture select flaps 30, VREF30 + 5."},{"id":"5-63","c":"5","r":"FCTM 5.31","q":"Fail operational, dual A/P approach with LAND 3/LAND 2 annunciated. Manual rudder trim is:","o":["Not recommended; the A/P controls rudder and trim inputs are counteracted","Required to keep the wheel centered","Required at 500 ft","Used to zero the trim before LAND 2"],"e":"If used, an out-of-trim condition can appear when the A/P is disengaged."},{"id":"5-64","c":"5","r":"FCTM 5.31","q":"Engine-out approach: if rudder trim is to be centered before landing, do it by:","o":["500 ft AFE","1,000 ft AFE","50 ft","After touchdown"],"e":"It may be inadvisable because of workload and possible missed approach."},{"id":"5-65","c":"5","r":"FCTM 5.31","q":"737-8, engine fails on final with landing flaps, insufficient thrust. Action:","o":["Retract to flaps 15 and set command speed VREF (30/40) + 20","Keep landing flaps and add 10 kt","Retract to flaps 1","Go around with flaps 30"],"e":"VREF30/40 + 20 is at least VREF15 (white bug). Add wind additives if time permits."},{"id":"5-66","c":"5","r":"FCTM 5.31","q":"Engine-out go-around from flaps 30 or 40 on the 737-8: initial flap selection is:","o":["Flaps 15","Flaps 1","Flaps 5","Flaps 25"],"e":"Further retraction at a safe altitude in level flight or a shallow climb."},{"id":"5-67","c":"5","r":"FCTM 5.33","q":"GLS approaches are certified to:","o":["Category I minimums (demonstrated through autoland and rollout)","Category II","Category IIIA","Non-precision only"],"e":"No beam bending, no critical area protection needed."},{"id":"5-68","c":"5","r":"FCTM 5.34","q":"Boeing FMS airplanes may fly GPS approaches provided an RNP of:","o":["0.3 or smaller is used","0.5 or smaller","1.0 or smaller","0.1 only"],"e":"Manual entry of 0.3 is required if not provided automatically."},{"id":"5-69","c":"5","r":"FCTM 5.35","q":"The CDFA method for non-ILS approaches reduces:","o":["Crew error and CFIT exposure through a constant-angle approach","Landing distance","Fuel burn only","Approach minima"],"e":"Traditional dive-and-drive changes the flight path at low altitude."},{"id":"5-70","c":"5","r":"FCTM 5.36","q":"Why should the A/P stay engaged in VNAV PTH until visual reference?","o":["VNAV PTH has no path deviation alerting","VNAV PTH disconnects at the FAF","The F/D is unavailable","It is required for autoland"],"e":"Automatic flight is the preferred method for non-ILS approaches."},{"id":"5-71","c":"5","r":"FCTM 5.36","q":"Using LNAV without GPS updating for an approach, raw data must be checked no later than:","o":["The FAF","The IAF","DA(H)","1,000 ft AFE"],"e":"Localizer-based approaches require raw data monitoring throughout."},{"id":"5-72","c":"5","r":"FCTM 5.38","q":"Maximum RNP for a VOR or RNAV approach with RNP alerting:","o":["0.5 NM","0.3 NM","0.6 NM","1.0 NM"],"e":"NDB 0.6 · VOR 0.5 · RNAV 0.5 · RNAV (GPS/GNSS) 0.3."},{"id":"5-73","c":"5","r":"FCTM 5.38","q":"Maximum RNP for an RNAV (GPS) approach:","o":["0.3 NM","0.5 NM","0.1 NM","0.6 NM"],"e":"At least one GPS or DME must be operational."},{"id":"5-74","c":"5","r":"FCTM 5.39","q":"Between the FAF and MAP of a database approach, waypoints:","o":["May not be added or deleted","May be added via the LEGS page","May be deleted if not needed","May be modified freely"],"e":"Use the FIX page for additional references; modifying disables 'on approach' logic."},{"id":"5-75","c":"5","r":"FCTM 5.39","q":"Manual waypoint entry for RNAV or GPS approaches is:","o":["Not accomplished, due to inadequate terrain clearance","Permitted with raw data","Permitted below 10,000 ft","Required if not in database"],"e":"Nor with VNAV after the FAF."},{"id":"5-76","c":"5","r":"FCTM 5.40","q":"Map building with the FMC should be avoided below:","o":["10,000 ft AGL","5,000 ft AGL","FL180","The IAF"],"e":"Use raw data displays during high workload phases."},{"id":"5-77","c":"5","r":"FCTM 5.41","q":"A suitable VNAV approach path approximates 3° and crosses the threshold at about:","o":["50 ft","35 ft","100 ft","80 ft"],"e":"A threshold crossing altitude entry needs four digits, e.g. 0080."},{"id":"5-78","c":"5","r":"FCTM 5.41","q":"For approaches with RNP or a DA(H), database waypoints from the FAF onward may be modified only to:","o":["Add a cold temperature correction to altitude constraints","Add speed constraints","Add a step-down fix","Change the GP angle"],"e":"Per FCTM 5.41."},{"id":"5-79","c":"5","r":"FCTM 5.42","q":"Without cold temperature corrections, the effective GP angle in colder than ISA conditions is:","o":["Lower than displayed","Higher than displayed","Unchanged","Corrected automatically"],"e":"The coded GP angle is steeper in warm and shallower in cold conditions."},{"id":"5-80","c":"5","r":"FCTM 5.42","q":"Altitude intervention during a VNAV approach is appropriate only when:","o":["The AFDS enters VNAV ALT above the path and descent must continue","Below the path","Established on the GP","To delete step-down constraints"],"e":"Set the next lower constraint or TDZE, then push ALT INTV."},{"id":"5-81","c":"5","r":"FCTM 5.43","q":"In VNAV ALT, altitude intervention may delete a down-path constraint if it is within:","o":["150 ft of current altitude","500 ft","50 ft","1,000 ft"],"e":"In VNAV PTH or SPD, approach constraints are not deleted."},{"id":"5-82","c":"5","r":"FCTM 5.43","q":"Typical coded GP angle range:","o":["2.75° to 3.77°, typically 3.00°","2.5° to 3.5°","3.0° only","2.0° to 4.5°"],"e":"The FMC builds the path from the MAP upward toward the FAF."},{"id":"5-83","c":"5","r":"FCTM 5.44","q":"The final approach course fix (FACF) is typically located about ___ before the FAF:","o":["7 NM","3 NM","10 NM","5 NM"],"e":"With 'at' constraints at the FAF, a short level 'fly-off' segment may result."},{"id":"5-84","c":"5","r":"FCTM 5.45","q":"If both FACF and FAF have 'at or above' constraints, the crew should consider:","o":["Changing the FACF constraint to a hard 'at' altitude","Deleting the FACF","Changing the FAF to 'at or below'","Using V/S"],"e":"This gives a shallower path for normal deceleration."},{"id":"5-85","c":"5","r":"FCTM 5.47","q":"Using MDA(H) as minimum, the baro minimums selector may be set to:","o":["MDA(H) + 50 ft","MDA(H) − 50 ft","MDA(H) + 100 ft","DA + 50 ft"],"e":"Prevents descent below MDA during the go-around."},{"id":"5-86","c":"5","r":"FCTM 5.47","q":"The FMC default approach RNP appears when within ___ of the approach waypoint, or below ___ above the destination:","o":["2 NM / 2,000 ft","5 NM / 3,000 ft","30 NM / 10,000 ft","1 NM / 1,000 ft"],"e":"A manual entry overrides database and default values."},{"id":"5-87","c":"5","r":"FCTM 5.47","q":"Descending to the FAF in LVL CHG or V/S, at ~2 NM before the FAF you should:","o":["Verify ALT HOLD before setting DA(H)/MDA(H) in the MCP","Set DA(H) immediately","Select APP","Set the missed approach altitude"],"e":"Otherwise the airplane may descend below the FAF altitude before the GP."},{"id":"5-88","c":"5","r":"FCTM 5.48","q":"If MDA is not an even 100 ft value, set the MCP altitude to:","o":["The nearest 100 ft increment above","The nearest 100 ft below","MDA rounded to 50 ft","The FAF altitude"],"e":"Per FCTM 5.48."},{"id":"5-89","c":"5","r":"FCTM 5.49","q":"On a VNAV approach, the missed approach altitude is set when:","o":["At least 300 ft below the missed approach altitude, stable in VNAV PTH","At the FAF","At 1,000 ft AFE","At DA"],"e":"Avoids an unwanted level-off during final descent."},{"id":"5-90","c":"5","r":"FCTM 5.49","q":"In gusty winds before flaps 15, VNAV PTH may revert to LVL CHG. If this happens beyond the FAF:","o":["Initiate a missed approach immediately","Reselect VNAV","Switch to V/S","Continue in LVL CHG"],"e":"Caused by minimum speed reversion protection."},{"id":"5-91","c":"5","r":"FCTM 5.53","q":"IAN restrictions include:","o":["QFE operation is not authorized","Autoland is available","Waypoints may be modified freely","No raw data needed for LOC approaches"],"e":"IAN is recommended for straight-in approaches only. Cold temp corrections permitted for the FAF onward."},{"id":"5-92","c":"5","r":"FCTM 5.53","q":"In temperatures above ISA, the IAN glide path compared to a PAPI is:","o":["Slightly higher, so following the PAPI may trigger a GLIDESLOPE alert","Slightly lower","Identical","Not displayed"],"e":"The IAN GP is barometric."},{"id":"5-93","c":"5","r":"FCTM 5.54","q":"FMC-based IAN approach (e.g. RNAV): the ILS should be:","o":["Not tuned","Tuned for monitoring","Tuned and identified","Set to the front course only"],"e":"For LOC G/S out, set the G/S prompt OFF. Front course always set in the MCP."},{"id":"5-94","c":"5","r":"FCTM 5.55","q":"On an IAN approach, landing configuration is initiated:","o":["About 2 NM from the FAF","At glide path alive","At the FAF","1,000 ft AFE"],"e":"Vertical deviation scale depends on RNP and may only move just before intercept."},{"id":"5-95","c":"5","r":"FCTM 5.55","q":"With the A/P engaged below 100 ft RA on an IAN approach:","o":["An aural GPWS alert sounds and A/P status flashes","The A/P disconnects automatically","FLARE engages","The A/T retards"],"e":"IAN does not support autoland."},{"id":"5-96","c":"5","r":"FCTM 5.58","q":"V/S non-ILS approach, no published vertical speeds. Set approximately:","o":["−700 to −800 fpm","−500 fpm","−1,000 to −1,200 fpm","−300 fpm"],"e":"No level flight segment at minimums."},{"id":"5-97","c":"5","r":"FCTM 5.59","q":"3° path rule of thumb: height above airport vs distance:","o":["300 ft per NM (e.g. 900 ft at 3 NM)","500 ft per NM","200 ft per NM","1,000 ft per 3 NM at 2 NM"],"e":"PM can call recommended altitudes."},{"id":"5-98","c":"5","r":"FCTM 5.59","q":"On a V/S approach, the missed approach altitude is set:","o":["About 300 ft above MDA(H)","At the FAF","300 ft below the missed approach altitude","At MDA"],"e":"No below-path alerting, so keep MDA set as long as possible."},{"id":"5-99","c":"5","r":"FCTM 5.59","q":"Leaving MDA on a V/S approach after disengaging the A/P and A/T:","o":["Turn both F/Ds OFF, then both ON","Leave F/Ds as is","Turn F/Ds OFF","Select TO/GA"],"e":"Removes unwanted commands and keeps GA guidance available."},{"id":"5-100","c":"5","r":"FCTM 5.62","q":"RNP AR approach without NPS: one pilot's map range should be:","o":["10 NM or less","20 NM","40 NM","5 NM exactly"],"e":"TERR on at least one side; VOR/DME updating must be OFF."},{"id":"5-101","c":"5","r":"FCTM 5.62","q":"RNP AR approach: before the FAF, an 'at or above' restriction may be:","o":["Changed to an 'at' restriction at the same altitude","Deleted","Raised by 500 ft","Changed to 'at or below'"],"e":"Speed changes allowed if published maximums are not exceeded."},{"id":"5-102","c":"5","r":"FCTM 5.63","q":"For RNP AR with multiple published RNPs, the crew should select:","o":["The highest available RNP permitted by the weather","The lowest available RNP","Always 0.1","The FMC default only"],"e":"If 0.3 default is published and weather allows, use it so the FMC can auto-switch to missed approach RNP."},{"id":"5-103","c":"5","r":"FCTM 5.63","q":"RNP AR with NPS: the vertical RNP should be verified as:","o":["125 ft","75 ft","50 ft","250 ft"],"e":"Amber deviation alert occurs at ~75 ft since vertical ANP is at least 50 ft."},{"id":"5-104","c":"5","r":"FCTM 5.63","q":"RNP AR: LNAV should be selected no later than:","o":["The IAF","The FAF","The FACF","1,000 ft AFE"],"e":"VNAV PTH must be engaged by the FAF or GP intercept for all segments with a GP angle."},{"id":"5-105","c":"5","r":"FCTM 5.63","q":"RNP AR: actual temperature outside the procedure's specified range (no temp compensation option):","o":["The RNP AR procedure cannot be flown","Apply cold temperature corrections","Increase DA by 100 ft","Fly with A/P only"],"e":"Within the range, no corrections are needed."},{"id":"5-106","c":"5","r":"FCTM 5.64","q":"RNP AR vertical deviation limit from the FAF to the MAP:","o":["75 ft","125 ft","50 ft","1 dot"],"e":"Lateral: within 1.0 × RNP (containment is 2 × RNP)."},{"id":"5-107","c":"5","r":"FCTM 5.64","q":"On RNP AR RF legs, bank angles rarely exceed:","o":["15°, unless ground speed is very high","25°","30°","10°"],"e":"Published speed limits ensure bank margins in strong winds."},{"id":"5-108","c":"5","r":"FCTM 5.65","q":"MDA 550 ft MSL, TDZE 100 ft. Where is the VDP (no chart VDP)?","o":["1.5 NM from the runway","1.0 NM","2.0 NM","0.5 NM"],"e":"HAA 450 ft ÷ 300 ft/NM = 1.5 NM. Most VDPs are 1–2 NM out."},{"id":"5-109","c":"5","r":"FCTM 5.65","q":"On a VNAV path approach, the VDP:","o":["Is automatically complied with if the airplane stays on the published path","Must be computed separately","Is always the MAP","Does not apply"],"e":"Arrival at DA/MDA on path coincides with the VDP."},{"id":"5-110","c":"5","r":"FCTM 5.68","q":"Circling approach configuration:","o":["Gear down, flaps 15, flaps 15 maneuver speed","Gear up, flaps 5","Landing flaps at VREF","Gear down, flaps 30"],"e":"Use minima for the anticipated circling speed."},{"id":"5-111","c":"5","r":"FCTM 5.68","q":"Why is APP mode not recommended to descend to a circling MDA?","o":["The AFDS does not level off at MCP altitude, and exiting APP requires GA or A/P off and F/Ds off","It cannot capture the localizer","It disables HDG SEL","It increases minima"],"e":"Use VNAV or V/S; maintain MDA with ALT HOLD or VNAV ALT."},{"id":"5-112","c":"5","r":"FCTM 5.68","q":"When should landing flaps be selected on a circling approach?","o":["Before starting the turn to base leg","At MDA","On final","Downwind abeam the threshold"],"e":"Aim initially at the inside edge of the threshold to avoid overshooting."},{"id":"5-113","c":"5","r":"FCTM 5.68","q":"In VNAV ALT during circling with a higher MCP altitude set, the pitch mode reverts to:","o":["CWS P","ALT HOLD","LVL CHG","V/S"],"e":"Set the missed approach altitude once in ALT HOLD at MDA."},{"id":"5-114","c":"5","r":"FCTM 5.69","q":"Legacy FAA circling area radius for 140 kt (Cat C):","o":["1.7 NM","2.3 NM","4.2 NM","2.7 NM"],"e":"165 kt: 2.3 NM. ICAO: 180 kt 4.2 NM, 205 kt 5.28 NM."},{"id":"5-115","c":"5","r":"FCTM 5.70","q":"FAA expanded circling radii apply only when the chart shows:","o":["The 'Inverse C' icon in the minima box","An RNAV title","A VDP","A circling restriction note"],"e":"Otherwise the smaller legacy radii apply."},{"id":"5-116","c":"5","r":"FCTM 5.71","q":"One engine inoperative circling: from the FAF until before base turn, configure:","o":["Gear up, flaps 10 (or flaps 5), at that maneuver speed","Gear down, flaps 15","Gear down, flaps 30","Gear up, flaps 1"],"e":"Before base: gear down, flaps 15, VREF15 + wind additive."},{"id":"5-117","c":"5","r":"FCTM 5.71","q":"Missed approach while circling:","o":["Climbing turn in the shortest direction toward the landing runway, then intercept the missed approach course","Fly straight ahead to the MAP","Turn away from the runway","Climb on runway heading"],"e":"Maintain missed approach flaps until close-in maneuvering is complete."},{"id":"5-118","c":"5","r":"FCTM 5.74","q":"Visual traffic pattern: downwind is normally flown at:","o":["1,500 ft AFE, flaps 5, about 2 NM abeam","1,000 ft AFE, flaps 15, 1 NM abeam","2,000 ft AFE, flaps 1, 3 NM abeam","1,500 ft, flaps 15, 1.5 NM abeam"],"e":"Before base: gear down, flaps 15, arm speedbrake."},{"id":"5-119","c":"5","r":"FCTM 5.74","q":"Visual approach: stabilized rate of descent on final is about ___, stabilized by ___ ft:","o":["700–900 fpm / 500 ft","1,000–1,200 fpm / 300 ft","500 fpm / 1,000 ft","600–700 fpm / 300 ft"],"e":"Base leg descent ~600–700 fpm. Avoid more than 1,000 fpm."},{"id":"5-120","c":"5","r":"FCTM 5.74","q":"Recommended visual landing approach path angle:","o":["About 2.5° to 3°","3.5°","2°","4°"],"e":"About 300 ft AFE per NM gives a normal profile."},{"id":"5-121","c":"5","r":"FCTM 5.77","q":"Touch and go: after touchdown the instructor sets:","o":["Flaps 15, stabilizer trim, speedbrakes down","Flaps 5 and autobrake RTO","Flaps 1 and reverse idle","Takeoff flaps and V2"],"e":"Rotate at VREF to ~15°, climb at VREF + 15 to 25."},{"id":"5-122","c":"5","r":"FCTM 5.77","q":"During a touch and go, once reverse thrust is initiated:","o":["A full stop landing must be made","Continue if the reverser stows","Go-around is still allowed below 80 kt","Use idle reverse only"],"e":"Do not arm speedbrakes; autobrakes OFF."},{"id":"5-123","c":"5","r":"FCTM 5.80","q":"Go-around after a dual A/P approach with FLARE armed:","o":["Leave the autopilots engaged and push TO/GA","Disengage the A/P then push TO/GA","Push TO/GA twice","Select LVL CHG"],"e":"A second TO/GA push gives full GA thrust if desired."},{"id":"5-124","c":"5","r":"FCTM 5.80","q":"An automatic go-around initiated at 50 ft loses about:","o":["30 ft","10 ft","50 ft","100 ft"],"e":"If touchdown occurs, the GA continues. An automatic GA cannot be initiated after touchdown."},{"id":"5-125","c":"5","r":"FCTM 5.80","q":"Flaps 1 go-around (authorized operators): limit bank to 15° when speed is below:","o":["VREF15 + 15 or minimum maneuver speed, whichever is less","VREF30 + 5","Flaps 1 maneuver speed","V2"],"e":"For normal flaps 15 landings, go around at flaps 15."},{"id":"5-126","c":"5","r":"FCTM 5.81","q":"The TO/GA roll mode:","o":["Maintains existing ground track","Maintains runway heading","Follows LNAV immediately","Wings level only"],"e":"Above 400 ft AGL, verify LNAV or select a roll mode. Route discontinuities prevent TO/GA to LNAV."},{"id":"5-127","c":"5","r":"FCTM 5.81","q":"After a dual A/P go-around, the A/P reverts to single A/P when:","o":["A pitch mode is selected or altitude capture occurs above 400 ft AGL","Flaps are retracted to 5","At 1,000 ft","TO/GA is pushed again"],"e":"Other modes cannot engage below 400 ft AGL."},{"id":"5-128","c":"5","r":"FCTM 5.82","q":"Low-weight go-around with low level-off altitude: a single TO/GA push commands thrust for:","o":["A 1,000 to 2,000 fpm climb","Full GA thrust","CLB thrust","3,000 fpm"],"e":"Also: use the A/T, reduce to climb thrust earlier, level off manually if needed."},{"id":"5-129","c":"5","r":"FCTM 5.83","q":"Go-around initiated after touchdown, before reverse selection. As thrust levers advance, verify:","o":["Speedbrakes retract and autobrakes disarm","Reversers stow","Flaps retract to 1","A/T disconnects"],"e":"The F/D pitch command is not used for rotation."},{"id":"5-130","c":"5","r":"FCTM 5.83","q":"One engine inoperative go-around from a flaps 15 approach: go-around flaps:","o":["Flaps 1","Flaps 5","Flaps 15","Flaps 10"],"e":"Fail operational from flaps 30: flaps 15. Select CON when flaps are retracted to the desired setting."},{"id":"5-131","c":"5","r":"FCTM 5.83","q":"Engine fails during a go-around. Maintain:","o":["Flaps 15, VREF 30/40 + additive (min 5), bank 15° until safe altitude","Flaps 1, V2 + 15","Flaps 5, flaps 5 speed","Landing flaps, VREF"],"e":"Verify maximum GA thrust; this speed may be below full maneuver margin."},{"id":"6-01","c":"6","r":"FCTM 6.1","q":"VASI systems are normally aligned to intersect the runway:","o":["1,000 or 1,800 ft beyond the threshold","500 ft beyond the threshold","At the threshold","3,000 ft beyond the threshold"],"e":"Flying the VASI to touchdown is like aiming at a point adjacent to the VASI."},{"id":"6-02","c":"6","r":"FCTM 6.1","q":"On a three-bar VASI on glide path, the pilot sees:","o":["One white bar and two red bars","Two white and one red","All white","Two white bars"],"e":"It may result in landing further down the runway."},{"id":"6-03","c":"6","r":"FCTM 6.3","q":"The upper glide path of a three-bar VASI is normally:","o":["3.25°, intended for long wheelbase airplanes","3.5° for all airplanes","2.75°","The same as the lower"],"e":"Lower path (near and middle bars) is normally 3°."},{"id":"6-04","c":"6","r":"FCTM 6.5","q":"On a normal 3° PAPI glide path the pilot sees:","o":["Two white on the left, two red on the right","Four white","Three red, one white","Two red on the left, two white on the right"],"e":"PAPI normally intersects the runway 1,000–1,500 ft beyond the threshold."},{"id":"6-05","c":"6","r":"FCTM 6.7","q":"Final approach should assure safe threshold clearance and gear touchdown at least:","o":["1,000 ft down the runway","500 ft","1,500 ft","2,000 ft"],"e":"Use the RA to judge height if automatic callouts are unavailable."},{"id":"6-06","c":"6","r":"FCTM 6.7","q":"For a planned manual landing from an A/P approach, consider disengaging the A/P and A/T:","o":["1–2 NM before the threshold, or about 300–600 ft AFE","At 50 ft","At DA","At 1,000 ft AFE"],"e":"Allow time to establish control before the flare."},{"id":"6-07","c":"6","r":"FCTM 6.7","q":"The flare is initiated when the main gear is about ___ above the runway by increasing pitch ___:","o":["20 ft / 2–3°","50 ft / 4–5°","10 ft / 1°","30 ft / 5°"],"e":"Then smoothly retard thrust to idle; ideally gear touches down as thrust reaches idle."},{"id":"6-08","c":"6","r":"FCTM 6.8","q":"Trimming during the flare:","o":["Increases the possibility of a tail strike and should not be done","Is recommended to reduce column force","Is required with flaps 40","Has no effect"],"e":"A prolonged flare increases pitch 2–3°."},{"id":"6-09","c":"6","r":"FCTM 6.8","q":"A/T disconnected for landing. Touchdown should occur at no less than:","o":["VREF − 5 kt","VREF","VREF − 10 kt","VREF + 5 kt"],"e":"Maintain gust correction until touchdown; the 5 kt additive may be bled off."},{"id":"6-10","c":"6","r":"FCTM 6.8","q":"Typical landing flare time ranges from:","o":["4 to 8 seconds","1 to 2 seconds","10 to 12 seconds","2 to 3 seconds"],"e":"Flare distance is about 1,000 to 2,000 ft beyond the threshold."},{"id":"6-11","c":"6","r":"FCTM 6.10","q":"Touchdown at VREF − 10 kt:","o":["Seriously reduces aft body-runway clearance","Is the normal touchdown speed","Shortens landing distance with no risk","Is required on short runways"],"e":"Normal touchdown speed: VREF to VREF − 5."},{"id":"6-12","c":"6","r":"FCTM 6.22","q":"How can a bounced landing occur with speedbrakes armed?","o":["Higher than idle thrust at touchdown disables automatic speedbrake deployment","Speedbrakes deploy too early","Autobrakes apply too late","Reversers deploy before touchdown"],"e":"Retarding during the bounce can deploy speedbrakes, causing a tail strike or hard landing."},{"id":"6-13","c":"6","r":"FCTM 6.23","q":"After a high, hard bounce:","o":["Initiate a go-around; don't retract flaps or gear until positive climb","Hold attitude and land","Push the nose down firmly","Deploy reversers immediately"],"e":"For a shallow bounce, hold normal attitude; thrust may not be needed."},{"id":"6-14","c":"6","r":"FCTM 6.23","q":"A balked landing is a go-around initiated:","o":["At or after touchdown, but before reverse thrust","Below DA but before touchdown","Above DA","After reverse thrust"],"e":"A rejected landing is below DA/MDA but before touchdown."},{"id":"6-15","c":"6","r":"FCTM 6.23","q":"Balked landing technique:","o":["A/P and A/T off, GA thrust, speedbrakes retracted, keep landing flaps, rotate toward 15° at no less than VREF","Push TO/GA, select flaps 15, rotate at V2","Retract flaps 1, rotate at VREF + 20","Keep A/P engaged and push TO/GA"],"e":"Selecting GA flaps can reduce lift and increase distance."},{"id":"6-16","c":"6","r":"FCTM 6.25","q":"Boeing's policy for identifying a hard landing:","o":["The pilot report is the only factor that consistently identifies it","The vertical acceleration recorder","Maintenance inspection after each landing","A g-meter reading above 2g"],"e":"Report nose only, main only, both, or hard bounced landing."},{"id":"6-17","c":"6","r":"FCTM 6.25","q":"Holding the nose up after touchdown for aerodynamic braking:","o":["Is not effective and causes high nose gear sink rates on brake application","Reduces landing distance","Is recommended on wet runways","Improves directional control"],"e":"Fly the nose wheels onto the runway without delay; do not use full down elevator."},{"id":"6-18","c":"6","r":"FCTM 6.25","q":"If speedbrakes are not raised after touchdown, braking effectiveness may initially be reduced by up to:","o":["60%","20%","40%","80%"],"e":"PM should announce speedbrake position during landing."},{"id":"6-19","c":"6","r":"FCTM 6.26","q":"During landing rollout, rudder control is effective to about:","o":["60 kt","80 kt","40 kt","30 kt"],"e":"Do not use the tiller until taxi speed."},{"id":"6-20","c":"6","r":"FCTM 6.26","q":"A maximum effort stop distance is approximately what percentage of the dry landing field length?","o":["60%","80%","50%","67%"],"e":"Speedbrakes, max reverse and max manual antiskid braking give minimum distance."},{"id":"6-21","c":"6","r":"FCTM 6.27","q":"Deceleration on the runway compared with in the air (floating) is about:","o":["Three times greater","Twice as great","The same","Five times greater"],"e":"Avoid floating; land near the normal touchdown point."},{"id":"6-22","c":"6","r":"FCTM 6.27","q":"Crossing the threshold at 100 ft instead of 50 ft (3° path) adds about:","o":["950 ft of landing distance","300 ft","1,500 ft","500 ft"],"e":"Flatter approach paths also increase total landing distance."},{"id":"6-23","c":"6","r":"FCTM 6.28","q":"A 3-second float after the flare increases typical dry landing distance by:","o":["515–775 ft","170–310 ft","950 ft","1,200–1,500 ft"],"e":"½ brake pressure: 600–1,530 ft. Speedbrakes not extended: 420–825 ft."},{"id":"6-24","c":"6","r":"FCTM 6.28","q":"Approach speed +10 kt increases typical dry landing distance by:","o":["170–310 ft","515–775 ft","600–1,530 ft","50 ft"],"e":"No speedbrakes and no reversers: 640–1,165 ft."},{"id":"6-25","c":"6","r":"FCTM 6.29","q":"A key concern with ground friction measuring vehicles is that:","o":["Readings may not represent airplane braking, especially with standing water or slush","They are too accurate","They measure only at high speed","They are mandatory for dispatch"],"e":"Evaluate with PIREPs and runway description."},{"id":"6-26","c":"6","r":"FCTM 6.31","q":"Autobrake setting recommended for wet or slippery runways or limited rollout distance:","o":["3","1","MAX","RTO"],"e":"MAX for minimum distance (less than full manual braking). 1 or 2 for routine operations."},{"id":"6-27","c":"6","r":"FCTM 6.31","q":"Using minimum reverse thrust instead of maximum can:","o":["Double brake energy requirements","Halve brake temperatures","Have no effect with autobrakes","Disable autobrakes"],"e":"Establish desired reverse thrust as soon as possible after touchdown."},{"id":"6-28","c":"6","r":"FCTM 6.32","q":"A smooth transition from autobrakes to manual braking is achieved by:","o":["Stowing the speedbrake handle when stopping is assured","Pumping the brake pedals","Selecting reverse idle","Using the tiller"],"e":"Also: apply pedal pressure until autobrakes disarm, or PM selects autobrake OFF."},{"id":"6-29","c":"6","r":"FCTM 6.33","q":"Manual braking on a short or slippery runway:","o":["Full constant brake pedal pressure; do not modulate or pump","Pump the brakes to avoid skids","Light pressure until 60 kt","Wait for nose wheel touchdown"],"e":"Antiskid stops the airplane in the shortest distance."},{"id":"6-30","c":"6","r":"FCTM 6.33","q":"Typical manual braking delay of 4–5 seconds after touchdown can cost:","o":["800 to 1,000 ft of runway","200 ft","2,000 ft","100 ft"],"e":"QRH landing distances assume a 2-second delay."},{"id":"6-31","c":"6","r":"FCTM 6.33","q":"Landing with antiskid inoperative:","o":["Nose wheels on ground and speedbrakes up first; very light pressure increasing as speed decreases; don't pump","Full brakes at touchdown","Pump brakes to prevent skids","Apply brakes before nose wheel touchdown"],"e":"Use minimum braking consistent with runway length."},{"id":"6-32","c":"6","r":"FCTM 6.34","q":"For normal landings, carbon brake wear, comfort and stopping are optimized with autobrake:","o":["2 or 3","1","MAX","OFF"],"e":"One hard, long application produces the same wear as a light short one."},{"id":"6-33","c":"6","r":"FCTM 6.34","q":"The brake temperature monitoring system indicates a stabilized value about:","o":["15 minutes after brake energy absorption","Immediately","5 minutes after","1 hour after"],"e":"So it gives no immediate indication of tire fire or wheel fracture."},{"id":"6-34","c":"6","r":"FCTM 6.35","q":"Minimum brake heating technique includes:","o":["Max reverse as soon as possible after main gear touchdown, without waiting for nose wheel","Autobrake MAX","Smallest flap setting","Delay reverse until 80 kt"],"e":"Also: longest runway, largest flaps, bleed headwind additive, autobrakes OFF once stopping assured."},{"id":"6-35","c":"6","r":"FCTM 6.35","q":"Conditions permitting, reverse thrust should be limited to:","o":["The number 2 reverse detent","Full reverse","Reverse idle","The interlock"],"e":"Maintain reverse as required up to maximum until stopping is assured."},{"id":"6-36","c":"6","r":"FCTM 6.36","q":"Reverse thrust should be reduced so that it reaches reverse idle by:","o":["Taxi speed, starting near 60 KIAS","80 kt","30 kt","Full stop"],"e":"Prevents re-ingestion and FOD; PM calls 60 knots."},{"id":"6-37","c":"6","r":"FCTM 6.36","q":"If an engine surges during reverse thrust:","o":["Quickly select reverse idle on both engines","Stow the reverser on the affected engine only","Increase reverse on the other engine","Shut down the engine"],"e":"PM also calls out inadvertent forward thrust."},{"id":"6-38","c":"6","r":"FCTM 6.38","q":"Slippery runway, crosswind, airplane drifting downwind with reverse thrust. To regain control:","o":["Release brakes and reduce to reverse idle, then reapply once correcting","Increase reverse thrust","Apply more braking","Use full tiller"],"e":"Reverse side force adds to the crosswind; braking reduces cornering."},{"id":"6-39","c":"6","r":"FCTM 6.39","q":"With one engine inoperative, asymmetric reverse thrust:","o":["May be used; return to reverse idle if directional control is a problem","Is prohibited","Must be full","Is used only below 60 kt"],"e":"Reduce crosswind guidelines by 5 kt on wet/contaminated runways when used."},{"id":"6-40","c":"6","r":"FCTM 6.41","q":"Landing crosswind guideline on dry runway or RWYCC 5 (Good):","o":["40 kt","36 kt","35 kt","33 kt"],"e":"RWYCC 4: 35 · 3: 25 · 2: 17 · 1: 15."},{"id":"6-41","c":"6","r":"FCTM 6.41","q":"Landing crosswind guideline for RWYCC 3 (Medium):","o":["25 kt","20 kt","17 kt","35 kt"],"e":"Takeoff guideline for RWYCC 3 is 20 kt."},{"id":"6-42","c":"6","r":"FCTM 6.41","q":"Sideslip-only (zero crab) landings are not recommended with crosswinds above ___ at flaps 30:","o":["18 kt","15 kt","21 kt","25 kt"],"e":"Flaps 15: 15 kt · flaps 30: 18 kt · flaps 40: 21 kt."},{"id":"6-43","c":"6","r":"FCTM 6.41","q":"Whenever a crab is maintained in a crosswind approach:","o":["Offset the flight deck to the upwind side so the main gear lands on centerline","Align the flight deck on centerline","Offset downwind","De-crab at 100 ft"],"e":"Three techniques: de-crab in flare, touchdown in crab, sideslip."},{"id":"6-44","c":"6","r":"FCTM 6.42","q":"Touchdown in crab is best suited to:","o":["Very slippery runways","Dry runways in strong crosswinds","All dry runways","Short runways only"],"e":"On dry runways it causes tracking toward the upwind edge."},{"id":"6-45","c":"6","r":"FCTM 6.42","q":"In the sideslip (wing low) technique, overbanking could cause:","o":["Engine nacelle or winglet contact with the runway","Tail strike only","Nose gear contact first","Spoiler failure"],"e":"Upwind wheels touch just before downwind wheels."},{"id":"6-46","c":"6","r":"FCTM 6.43","q":"For an overweight landing, which flap setting is recommended?","o":["Flaps 30 (more margin to placard speed)","Flaps 40","Flaps 15","Flaps 25"],"e":"Brake energy limits are not exceeded for flaps 30/40 normal landings at all weights."},{"id":"6-47","c":"6","r":"FCTM 6.43","q":"During overweight flap extension, airspeed may be reduced below normal maneuver speed by as much as:","o":["20 kt","10 kt","5 kt","30 kt"],"e":"Larger placard margins but not always the 15° overshoot margin."},{"id":"6-48","c":"6","r":"FCTM 6.44","q":"Overweight autolands:","o":["Are not recommended; disengage the A/P before flare height","Are recommended to reduce sink rate","Are certified up to MTOW","Require flaps 40"],"e":"If necessary in an emergency, allow extra distance and be ready to go around."},{"id":"7-01","c":"7","r":"FCTM 7.1","q":"VMO is:","o":["A structural limit: maximum operating IAS, constant from sea level to where VMO and MMO coincide","An aerodynamic stall limit","The maximum flap extension speed","A thrust limit"],"e":"Above that altitude, MMO is the limit."},{"id":"7-02","c":"7","r":"FCTM 7.2","q":"As the airplane accelerates toward VMO in level flight, the trim required is:","o":["Nose down","Nose up","None","Rudder trim only"],"e":"During deceleration, nose-up trim is required."},{"id":"7-03","c":"7","r":"FCTM 7.2","q":"Minimum control speed in the air (VMCA) is:","o":["Below VR and VREF","Above V2","Equal to VREF","Above flaps up maneuver speed"],"e":"One engine out controllability is excellent."},{"id":"7-04","c":"7","r":"FCTM 7.3","q":"Under instrument conditions, the first indication of an asymmetric thrust condition is usually:","o":["Roll","Yaw on the heading","Slip indicator","Engine instrument change"],"e":"Stop yaw with rudder at the same rate thrust changes."},{"id":"7-05","c":"7","r":"FCTM 7.3","q":"With rudder trimmed to level the wheel after an engine failure, the slip/skid indicator is displaced:","o":["Slightly toward the operating engine","Slightly toward the failed engine","Centered","Fully toward the failed engine"],"e":"A small bank toward the operating engine may also appear."},{"id":"7-06","c":"7","r":"FCTM 7.3","q":"Engine out, turning flight:","o":["Hold rudder constant; do not try to coordinate rudder with lateral control","Coordinate rudder with each turn","Use only aileron","Use rudder to bank"],"e":"Rudder inputs cause roll due to yaw and pilot-induced oscillations."},{"id":"7-07","c":"7","r":"FCTM 7.4","q":"Engine failure at low altitude, not thrust limited: initial thrust setting can use:","o":["The total two-engine fuel flow at the time of failure","Idle on the good engine","Max takeoff thrust","50% N1"],"e":"At high altitude (performance limited), set MCT and adjust attitude."},{"id":"7-08","c":"7","r":"FCTM 7.4","q":"High altitude 'g' buffet training: maximum bank angle used is:","o":["45°","30°","60°","25°"],"e":"Start at M0.80; if no buffet by 45°, increase back pressure."},{"id":"7-09","c":"7","r":"FCTM 7.5","q":"Rapid descent: level off at:","o":["The lowest safe altitude or 10,000 ft, whichever is higher","10,000 ft always","FL140","MSA only"],"e":"Then LRC or 300 kt with speedbrakes down."},{"id":"7-10","c":"7","r":"FCTM 7.5","q":"Rapid descent with suspected structural damage:","o":["Limit airspeed to current speed or less and avoid high maneuvering loads","Descend at VMO","Extend flaps","Use V/S −6,000 fpm"],"e":"Gear extension may then give a better descent rate (observe placards)."},{"id":"7-11","c":"7","r":"FCTM 7.6","q":"During a rapid descent, the PM calls out:","o":["2,000 ft and 1,000 ft above level-off altitude","1,000 ft only","Every 5,000 ft","500 ft above"],"e":"PM also checks lowest safe altitude, notifies ATC, gets QNH."},{"id":"7-12","c":"7","r":"FCTM 7.6","q":"Recommended AFDS technique for a rapid descent:","o":["Autopilot in LVL CHG with A/T connected","V/S mode","VNAV SPD","Manual flight only"],"e":"V/S is not recommended. IAS/Mach changes to IAS at about 300 KIAS."},{"id":"7-13","c":"7","r":"FCTM 7.6","q":"Short-term airspeed excursions above VMO/MMO with the A/P in a rapid descent:","o":["Acceptable; don't disengage the A/P unless clearly unacceptable; log any exceedance","Require immediate A/P disconnect","Require gear extension","Are not possible"],"e":"Usually due to wind and temperature changes."},{"id":"7-14","c":"7","r":"FCTM 7.7","q":"Manual rapid descent initial attitude is approximately:","o":["10° nose down","5° nose down","20° nose down","15° nose down"],"e":"About 10 kt before target speed, slowly raise pitch."},{"id":"7-15","c":"7","r":"FCTM 7.7","q":"After level-off from a rapid descent, do not remove crew oxygen masks if cabin altitude remains above:","o":["10,000 ft","14,000 ft","8,000 ft","12,500 ft"],"e":"Recheck pressurization and obtain a new clearance."},{"id":"7-16","c":"7","r":"FCTM 7.8","q":"Current stall recovery emphasis is on:","o":["Reducing angle of attack below stalling AOA for a positive recovery","Minimum altitude loss","Maximum thrust first","Rolling wings level first"],"e":"Many accidents occurred with altitude available but no positive recovery."},{"id":"7-17","c":"7","r":"FCTM 7.8","q":"Recovery from an approach to stall should begin at:","o":["The earliest recognizable warning: stick shaker or initial buffet","Full stall","Stick shaker plus 2 seconds","Loss of roll control"],"e":"Stick shaker usually precedes buffet; near cruise they may be simultaneous."},{"id":"7-18","c":"7","r":"FCTM 7.9","q":"During stall recovery, nose-down stabilizer trim should be stopped when:","o":["G force or required elevator force lessens","The stick shaker stops","Pitch reaches −10°","Airspeed reaches VREF"],"e":"Too much trim may cause loss of control or high structural loads."},{"id":"7-19","c":"7","r":"FCTM 7.9","q":"Why add thrust smoothly during stall recovery?","o":["Underwing engines cause a nose-up pitch moment with thrust increase","To avoid engine surge","To prevent overspeed","To protect the A/T"],"e":"At high thrust (takeoff/GA), thrust reduction may be needed to stop AOA increasing."},{"id":"7-20","c":"7","r":"FCTM 7.9","q":"Attempting to roll wings level before the wings are unstalled:","o":["Is ineffective; ailerons and spoilers won't work well","Is the first step","Requires full rudder","Is recommended at high altitude"],"e":"Unload with continuous nose-down elevator first."},{"id":"7-21","c":"7","r":"FCTM 7.10","q":"Nose-high stall where pitch keeps increasing despite forward column, trim and thrust reduction:","o":["Roll to a bank angle of about 45° (max 60°) to start the nose down","Extend flaps","Increase thrust","Apply full rudder"],"e":"Careful rudder in the desired roll direction only if roll control is ineffective."},{"id":"7-22","c":"7","r":"FCTM 7.10","q":"Configuration changes during stall recovery:","o":["Not made, except flaps 1 if flaps were inadvertently up at liftoff","Extend flaps 5 always","Lower gear","Retract flaps"],"e":"Flap changes otherwise increase altitude loss."},{"id":"7-23","c":"7","r":"FCTM 7.10","q":"Erroneous continuous stick shaker after liftoff, speed ≥ V2, positive vertical speed:","o":["Continue climbout to acceleration height, monitoring altitude and airspeed","Lower the nose to unstall","Reject the climb and land","Retract flaps immediately"],"e":"Certain system failures can cause erroneous stick shaker."},{"id":"7-24","c":"7","r":"FCTM 7.11","q":"Leading edge devices ensure that at the onset of the stall:","o":["The inboard wing stalls first, pitching the nose down","The outboard wing stalls first","Both stall together","The tail stalls first"],"e":"Flaps increase low speed capability."},{"id":"7-25","c":"7","r":"FCTM 7.11","q":"Speedbrakes extended at a given speed:","o":["Increase AOA, raising buffet and stick shaker speeds, with less effect on actual stall speed","Reduce stall speed","Have no effect","Lower stick shaker speed"],"e":"Per FCTM 7.11."},{"id":"7-26","c":"7","r":"FCTM 7.12","q":"During stall recovery, F/D commands should:","o":["Not be used","Be followed","Be used for pitch only","Be used after the shaker stops"],"e":"F/D isn't designed to provide stall recovery guidance."},{"id":"7-27","c":"7","r":"FCTM 7.14","q":"Steep turn training uses ___ bank at ___:","o":["45° / 250 kt","30° / 250 kt","45° / 210 kt","60° / 280 kt"],"e":"Pilots should never need more than 25–30° in normal or non-normal operations. No stab trim during the maneuver."},{"id":"7-28","c":"7","r":"FCTM 7.15","q":"Steep turn rollout should begin:","o":["15° to 20° before the desired heading","5° before","30° before","At the heading"],"e":"Decrease pitch and thrust during rollout."},{"id":"7-29","c":"7","r":"FCTM 7.15","q":"After a GPWS PULL UP warning, autopilot and autothrottle:","o":["Should not be engaged until terrain clearance is assured","Should be engaged immediately","Must remain engaged","Only the A/T is engaged"],"e":"Immediately accomplish the Terrain Avoidance maneuver."},{"id":"7-30","c":"7","r":"FCTM 7.16","q":"Momentary terrain CAUTION alerts during RNP AR in close terrain that have ceased:","o":["Verify on path and consider continuing in LNAV/VNAV","Always perform terrain avoidance","Go around immediately","Switch off TERR"],"e":"Terrain WARNING-level alerts always require immediate action."},{"id":"7-31","c":"7","r":"FCTM 7.16","q":"Maneuvering based solely on a TCAS TA:","o":["Is not recommended, as it may reduce separation","Is required","Is recommended in RVSM","Is allowed below 1,000 ft"],"e":"The TA alerts to the possibility of an RA."},{"id":"7-32","c":"7","r":"FCTM 7.17","q":"Which is an appropriate use of TA ONLY mode?","o":["Engine out operation","Normal cruise","Every approach","When ATC is not available"],"e":"Also: closely spaced parallel approaches, known nearby traffic on takeoff."},{"id":"7-33","c":"7","r":"FCTM 7.17","q":"During an RA, F/D commands may be followed:","o":["Only if they give a vertical speed that satisfies the RA","Always","Never","Only above 1,000 ft"],"e":"The F/D is not affected by TCAS guidance."},{"id":"7-34","c":"7","r":"FCTM 7.17","q":"With TCAS 7.1 and later, 'ADJUST VERTICAL SPEED' was changed to:","o":["'LEVEL OFF, LEVEL OFF'","'MONITOR VERTICAL SPEED'","'CLIMB, CLIMB'","'MAINTAIN VERTICAL SPEED'"],"e":"Visual contact may be misleading, especially at night."},{"id":"7-35","c":"7","r":"FCTM 7.18","q":"Which warnings take precedence over TCAS advisories?","o":["Windshear, GPWS and stall warnings (stick shaker always)","None","Only TAWS","Only configuration warnings"],"e":"Do not maneuver opposite to an RA; TCAS may be coordinating."},{"id":"7-36","c":"7","r":"FCTM 7.18","q":"Historically, an upset includes pitch greater than ___ nose up, ___ nose down, or bank greater than ___:","o":["25° / 10° / 45°","30° / 15° / 60°","20° / 10° / 30°","25° / 15° / 45°"],"e":"Updated AUPRTA: any deviation from the intended airplane state."},{"id":"7-37","c":"7","r":"FCTM 7.19","q":"In upset recovery, roll the shortest direction to wings level:","o":["Toward the bank pointer","Away from the bank pointer","Toward the sky pointer opposite","Using rudder first"],"e":"The ADI is the primary reference."},{"id":"7-38","c":"7","r":"FCTM 7.20","q":"In all upset situations, the first priority is to:","o":["Recover from a stall, if stalled","Roll wings level","Add full thrust","Extend speedbrakes"],"e":"Maintain nose-down elevator until stall warning ceases."},{"id":"7-39","c":"7","r":"FCTM 7.21","q":"Nose-high upset: after achieving a nose-down pitch rate, control inputs maintain:","o":["Between 0 g and 1 g","2 g","Negative g","1.5 g"],"e":"If altitude permits, reducing some thrust helps achieve nose-down pitch."},{"id":"7-40","c":"7","r":"FCTM 7.22","q":"Nose-low, high bank upset: nose-up elevator should be avoided until:","o":["Approaching wings level","Bank passes 90°","Speed reaches VMO","Immediately"],"e":"Nose-down elevator may be needed if bank exceeds 90°."},{"id":"7-41","c":"7","r":"FCTM 7.22","q":"Level flight cannot be maintained within AFM load limits at bank angles greater than:","o":["67°","45°","60°","75°"],"e":"Nose-up elevator above 60° bank causes little pitch change."},{"id":"7-42","c":"7","r":"FCTM 7.23","q":"Below 500 ft, windshear is mostly:","o":["Horizontal","Vertical","Rotational","Negligible"],"e":"Increasing airspeed may precede a performance-decreasing shear."},{"id":"7-43","c":"7","r":"FCTM 7.23","q":"In a performance-decreasing windshear, time available to recognize and react may be as little as:","o":["5 seconds","15 seconds","30 seconds","1 second"],"e":"Trade airspeed for altitude: increase pitch with maximum thrust."},{"id":"8-01","c":"8","r":"FCTM 8.2","q":"Non-normal checklists should be accomplished:","o":["Only after the desired flight path and configuration are established","Immediately, before stabilizing the flight path","Only on the ground","After landing"],"e":"Recognize → maintain control → analyze → take proper action → evaluate need to land."},{"id":"8-02","c":"8","r":"FCTM 8.2","q":"Oxygen masks should be donned when:","o":["Oxygen deprivation or air contamination is suspected, even without a warning","Only with a cabin altitude warning","Above FL250 only","Only on passenger oxygen deployment"],"e":"Establish crew communication."},{"id":"8-03","c":"8","r":"FCTM 8.3","q":"Master Fire Warning and Master Caution lights:","o":["Provide awareness of alerts outside the forward field of view; they don't indicate higher priority","Indicate the highest priority alert","Replace system annunciators","Only illuminate on the ground"],"e":"Review all lights after each NNC."},{"id":"8-04","c":"8","r":"FCTM 8.4","q":"Which is an example of an unannunciated non-normal situation?","o":["Runaway stabilizer","SPEED TRIM FAIL","Engine fire","STAB OUT OF TRIM"],"e":"Airspeed unreliable is also unannunciated."},{"id":"8-05","c":"8","r":"FCTM 8.10","q":"After an engine shutdown, the DRIVE light illuminates. Should the DRIVE NNC be done?","o":["No; it results from the engine shutdown","Yes, always","Yes, before the engine NNC","Only on the ground"],"e":"System knowledge helps prioritize alerts."},{"id":"8-06","c":"8","r":"FCTM 8.10","q":"Prioritizing NNCs: first do:","o":["NNCs with memory steps","Caution NNCs","The longest checklist","Whatever the PM chooses"],"e":"Then by priority: time critical, warning, caution."},{"id":"8-07","c":"8","r":"FCTM 8.11","q":"Cycling a circuit breaker not directed by the NNC is:","o":["Troubleshooting, which is rarely helpful and has caused further failures","Recommended","Part of every NNC","Required for resets"],"e":"Distraction from troubleshooting contributed to fuel starvation and CFIT accidents."},{"id":"8-08","c":"8","r":"FCTM 8.12","q":"For non-normal landings, autobrakes are recommended because:","o":["Maximum autobrake may be more effective than manual due to timely, symmetrical application","They give the shortest possible distance","They're required by regulation","They reduce reverse thrust need"],"e":"Properly used, maximum manual braking gives the shortest stopping distance."},{"id":"8-09","c":"8","r":"FCTM 8.13","q":"'Nearest suitable airport' is selected:","o":["In terms of time, considering facilities and weather","By straight-line distance","By company preference only","By runway length only"],"e":"Persistent smoke/fire may require the nearest appropriate airport."},{"id":"8-10","c":"8","r":"FCTM 8.13","q":"In flight, the CABIN ALTITUDE light illuminates when cabin altitude reaches:","o":["10,000 ft","8,000 ft","12,500 ft","14,000 ft"],"e":"Immediately do the CABIN ALTITUDE WARNING or Rapid Depressurization NNC; don't confuse with the takeoff config horn."},{"id":"8-11","c":"8","r":"FCTM 8.14","q":"Ditching: life vests should be inflated:","o":["After exiting the airplane","Before touchdown","On final approach","When ordered by ATC"],"e":"Transponder 7700."},{"id":"8-12","c":"8","r":"FCTM 8.14","q":"Ditching final approach: airspeed, descent rate and touchdown attitude:","o":["VREF, 200–300 fpm, 10–12°","VREF + 10, 500 fpm, 5°","V2, 100 fpm, 15°","VREF − 5, 600 fpm, 8°"],"e":"Flaps 40 or appropriate landing flaps; maintain speed and descent with thrust."},{"id":"8-13","c":"8","r":"FCTM 8.15","q":"There is no low oil quantity NNC because:","o":["There is no minimum oil quantity limit; check pressure and temperature","Oil quantity is not displayed","It is a memory item","It is covered by ENGINE FAILURE"],"e":"Oil pressure is the most significant indicator."},{"id":"8-14","c":"8","r":"FCTM 8.15","q":"Engine fire after takeoff: memory items when:","o":["Flight path under control, gear up, at least 400 ft AGL","Immediately at liftoff","After flaps up","Above 1,500 ft"],"e":"PF retards the thrust lever after PM confirms the correct engine."},{"id":"8-15","c":"8","r":"FCTM 8.15","q":"Engine tailpipe fire on the ground: the primary means to extinguish it is:","o":["Motoring the engine","Engine fire extinguisher","APU bleed off","Evacuation"],"e":"The fire checklist is inappropriate; agent isn't effective inside the tailpipe. Notify cabin crew to prevent inappropriate evacuation."},{"id":"8-16","c":"8","r":"FCTM 8.16","q":"Suspected loss of engine thrust control on takeoff:","o":["Continue the takeoff or remain airborne until the NNC can be done","Shut down the engine immediately","Reject the takeoff above V1","Retard both thrust levers"],"e":"Helps directional control and avoids shutting down the wrong engine."},{"id":"8-17","c":"8","r":"FCTM 8.16","q":"Loss of thrust on both engines: windmill restart is most likely to succeed:","o":["As soon as possible, using the high RPM at failure","After APU start","Above FL300","After descending to 10,000 ft"],"e":"Below 30,000 ft, speeds above the crossbleed start envelope improve restart."},{"id":"8-18","c":"8","r":"FCTM 8.17","q":"During in-flight restart, the EGT limit used is:","o":["The lower of the EGT redline and the EGT start limit redline","The EGT redline","The start limit only","No limit"],"e":"Hung start: stagnant RPM with rising EGT."},{"id":"8-19","c":"8","r":"FCTM 8.17","q":"Severe airframe vibration after fan blade separation:","o":["Reduce airspeed and descend; vibration is unlikely to damage the structure","Increase speed to pass through it","Shut down both engines","Climb immediately"],"e":"Vibration may not stop completely."},{"id":"8-20","c":"8","r":"FCTM 8.18","q":"In-flight engine shutdown: who moves the start lever to CUTOUT?","o":["The PM, after PF confirms the correct lever","The PF","The captain always","Either pilot without confirmation"],"e":"PF disconnects A/T and slowly retards the affected thrust lever first."},{"id":"8-21","c":"8","r":"FCTM 8.18","q":"Most bird strikes occur below:","o":["500 ft AGL","1,500 ft AGL","3,000 ft AGL","10,000 ft"],"e":"About 50% of engine bird strikes damage the engine."},{"id":"8-22","c":"8","r":"FCTM 8.19","q":"Bird strike above 80 kt, before V1, no evidence of engine failure:","o":["Continue the takeoff, return if required","Reject the takeoff","Reduce thrust","Abort and evacuate"],"e":"Use the QRH RTO criteria."},{"id":"8-23","c":"8","r":"FCTM 8.19","q":"Using weather radar to scare birds:","o":["Has not been proven effective","Is recommended on approach","Is required at bird-active airports","Works below 500 ft"],"e":"Plan extra landing distance for possible no-reverse landing."},{"id":"8-24","c":"8","r":"FCTM 8.20","q":"If in doubt about the method of evacuation:","o":["Consider an emergency evacuation using the escape slides","Deplane by stairs","Wait for ATC","Keep passengers onboard"],"e":"For non-urgent deplaning, complete the normal shutdown procedure first."},{"id":"8-25","c":"8","r":"FCTM 8.21","q":"During an evacuation for a bomb threat with no fire indications, engine fire bottles should be:","o":["Not discharged","Discharged into both engines","Discharged into the APU","Discharged as prevention"],"e":"Halon has little fire prevention capability and dissipates quickly."},{"id":"8-26","c":"8","r":"FCTM 8.21","q":"All flaps up landing: establish final about:","o":["10 NM from the runway","5 NM","15 NM","3 NM"],"e":"Maintain at least flaps-up maneuver speed until on final."},{"id":"8-27","c":"8","r":"FCTM 8.21","q":"All flaps up landing: normal rate of descent on final is about:","o":["900 fpm","700 fpm","1,200 fpm","500 fpm"],"e":"Aim ~1,000 ft down the runway; A/P OK, no autoland."},{"id":"8-28","c":"8","r":"FCTM 8.22","q":"All flaps up landing: speedbrakes for speed reduction are not recommended below:","o":["800 ft","500 ft","1,000 ft","1,500 ft"],"e":"Go around if landing beyond the touchdown zone is anticipated."},{"id":"8-29","c":"8","r":"FCTM 8.22","q":"LE flaps transit NNC VREF provides:","o":["15° bank capability plus 15° overshoot","40° bank","25° bank only","30° bank"],"e":"Do not float during the flare."},{"id":"8-30","c":"8","r":"FCTM 8.22","q":"Go-around with flaps greater than 25: retracting the gear causes:","o":["A landing gear configuration warning","Flap load relief","Stick shaker","Nothing"],"e":"Per LE/TE asymmetry notes."},{"id":"8-31","c":"8","r":"FCTM 8.23","q":"Alternate flap extension: new command speed is set:","o":["After the flaps reach the selected position","Before selecting flaps","At the same time","Only at the final flap"],"e":"Alternate flaps extend more slowly."},{"id":"8-32","c":"8","r":"FCTM 8.23","q":"Possible indication of an elevator jam:","o":["Unexplained A/P disengagement or altitude over/undershoot at level-off","Stick shaker","SPEED TRIM FAIL","Rudder pedal shaking"],"e":"Can be masked by trim."},{"id":"8-33","c":"8","r":"FCTM 8.24","q":"Jammed control, override needed: if normal force is 10 lb and override 50 lb, total required is:","o":["60 lb","50 lb","10 lb","40 lb"],"e":"The pilot with the non-jammed control flies the rest of the flight."},{"id":"8-34","c":"8","r":"FCTM 8.24","q":"Jammed aileron: manual trim input used is:","o":["Rudder","Stabilizer","Aileron","Elevator"],"e":"Elevator → stabilizer · rudder → aileron · spoiler → rudder, aileron."},{"id":"8-35","c":"8","r":"FCTM 8.25","q":"Approach with a jammed flight control: thrust should not be reduced to idle until:","o":["After touchdown","The flare","50 ft","The threshold"],"e":"Establish touchdown attitude by the threshold; avoid abrupt changes."},{"id":"8-36","c":"8","r":"FCTM 8.25","q":"With a jammed elevator, a go-around:","o":["Should be avoided if at all possible","Is normal","Requires flaps 1","Must be done with A/P"],"e":"If necessary, advance thrust slowly, using stabilizer for pitch."},{"id":"8-37","c":"8","r":"FCTM 8.26","q":"Stabilizer actuator stuck due to ice on the jackscrew suspected:","o":["Descend to a warmer temperature and try again","Use full electric trim","Land immediately","Use autopilot trim"],"e":"Airplane can be flown and landed with stab trim inoperative."},{"id":"8-38","c":"8","r":"FCTM 8.26","q":"Runaway stabilizer: before disengaging the autopilot:","o":["Hold the control column firmly","Set CUTOUT switches","Retard thrust","Extend flaps"],"e":"Then use column, main electric trim and thrust; if it continues, both STAB TRIM CUTOUT."},{"id":"8-39","c":"8","r":"FCTM 8.27","q":"Before extending the manual trim wheel handles:","o":["Both STAB TRIM cutout switches must be in CUTOUT","Use autopilot trim","Disconnect the A/T","Lower the gear"],"e":"Use main electric trim first to get in trim; manual trim is for small corrections."},{"id":"8-40","c":"8","r":"FCTM 8.27","q":"One unit of stabilizer trim requires about ___ turns of the manual trim wheel:","o":["15","5","30","50"],"e":"Reducing airspeed is the most effective way to lower manual trim forces."},{"id":"8-41","c":"8","r":"FCTM 8.28","q":"STANDBY RUDDER ON light without crew action, most probably from a force fight monitor fault:","o":["Avoid full rudder inputs (three PCU valves power the rudder)","Use full rudder to test","Turn off both hydraulic systems","Land immediately"],"e":"If due to a main PCU jam, no NNC is required."},{"id":"8-42","c":"8","r":"FCTM 8.28","q":"If the pitot ram air inlet is blocked but drain holes are open, airspeed:","o":["Slowly drops to zero","Increases in climb","Freezes at current value","Fluctuates randomly"],"e":"If inlet and drains are both blocked, the trapped pressure reacts unpredictably."},{"id":"8-43","c":"8","r":"FCTM 8.30","q":"Airspeed unreliable memory: flaps extended pitch and thrust:","o":["10° and 80% N1","4° and 75% N1","15° and 85% N1","8° and 70% N1"],"e":"Flaps up: 4° and 75% N1. Biased toward higher airspeed."},{"id":"8-44","c":"8","r":"FCTM 8.30","q":"Airspeed unreliable memory: flaps up pitch and thrust:","o":["4° and 75% N1","10° and 80% N1","2° and 70% N1","6° and 80% N1"],"e":"May give slight climb at light weight/low altitude, slight descent heavy/high."},{"id":"8-45","c":"8","r":"FCTM 8.30","q":"Comparing only two airspeed indicators that agree:","o":["Is not conclusive; both can still be unreliable","Confirms a reliable source","Means the standby is wrong","Ends the checklist"],"e":"Use stick shaker side, airspeed low, PLI side, AOA DISAGREE, ISFD and GS."},{"id":"8-46","c":"8","r":"FCTM 8.31","q":"Using an AOA indicator during pitot/static unreliable airspeed, hold the needle at about:","o":["The 3 o'clock position","12 o'clock","6 o'clock","9 o'clock"],"e":"Approximates a safe maneuver or approach speed for any flap position."},{"id":"8-47","c":"8","r":"FCTM 8.31","q":"Unreliable airspeed at or after V1 on takeoff:","o":["Keep takeoff thrust, rotate toward 15° normal pitch, gear up, keep flaps, climb to acceleration height","Reduce thrust to 80% N1","Retract flaps immediately","Reject the takeoff"],"e":"Then do the Airspeed Unreliable NNC."},{"id":"8-48","c":"8","r":"FCTM 8.32","q":"Unreliable airspeed descent: at 2,000 ft above level-off, reduce rate of descent to:","o":["1,000 fpm","500 fpm","1,500 fpm","300 fpm"],"e":"Touch down about 1,000–1,500 ft beyond the threshold; don't float."},{"id":"8-49","c":"8","r":"FCTM 8.32","q":"If only the standby airspeed indication is reliable, on a go-around:","o":["Do not use TO/GA","Use TO/GA normally","Use TO/GA twice","Engage the A/P"],"e":"Review the go-around pitch table before the approach."},{"id":"8-50","c":"8","r":"FCTM 8.33","q":"With unreliable altitude, ATC transponder altitude:","o":["Is not an independent source and cannot verify barometric altitude","Is the most reliable source","Should replace the altimeters","Is GPS-based"],"e":"GPWS DA/MDA callouts come from the Captain's minimums selector."},{"id":"8-51","c":"8","r":"FCTM 8.33","q":"SPEED TRIM FAIL from erroneous AOA appears only when AOA vane difference is:","o":["5.5° or greater","2°","10°","1°"],"e":"FEEL DIFF PRESS if EFS active for 30 continuous seconds."},{"id":"8-52","c":"8","r":"FCTM 8.34","q":"Primary purpose of fuel balance
